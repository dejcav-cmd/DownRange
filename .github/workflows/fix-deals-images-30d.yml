name: Fix Deals Images 30 Day

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Patch last 30 days of broken deal images
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/patch_deals_30day.py

      - name: Commit results
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || (
            FIXED=$(grep -oP '(?<=^FIXED: )\d+' scripts/diag-result.txt | head -1 || echo 0)
            git commit -m "fix: deals images 30d patch ${FIXED} images [skip ci]"
            git pull --rebase && git push
          ) || true
