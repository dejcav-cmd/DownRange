name: Patch Sanity Template Subject
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch YouTuber intro subject in Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          TOKEN = os.environ["SANITY_TOKEN"]
          PROJECT = "vbnsqnkg"
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          def get(q):
              url = f"https://{PROJECT}.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(q)}&returnQuery=false"
              with urllib.request.urlopen(urllib.request.Request(url, headers=H)) as r:
                  return json.loads(r.read())["result"]
          def mutate(m):
              url = f"https://{PROJECT}.api.sanity.io/v2024-01-01/data/mutate/production"
              data = json.dumps({"mutations": m}).encode()
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=H, method="POST")) as r:
                  return json.loads(r.read())
          templates = get('*[_type=="outreachTemplate"]{_id,name,subject}')
          print(f"Found {len(templates)} templates")
          for t in templates:
              name = t.get("name","")
              print(f"  {name} => {t.get('subject','')[:60]}")
              if "YouTuber" in name and "Introduction" in name and "Follow" not in name and "Deeper" not in name:
                  result = mutate([{"patch":{"id":t["_id"],"set":{"subject":"DJ from DownRange \u2014 wanted to tell you directly"}}}])
                  print(f"  PATCHED: {result}")
          print("Done")
          PYEOF
