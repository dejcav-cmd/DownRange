name: Patch Sanity Template Subject
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reseed templates from JSON
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.parse, json, os

          TOKEN   = os.environ["SANITY_TOKEN"]
          PROJECT = "vbnsqnkg"
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          def get(q, params=None):
              url = f"https://{PROJECT}.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(q)}&returnQuery=false"
              with urllib.request.urlopen(urllib.request.Request(url, headers=H)) as r:
                  return json.loads(r.read())["result"]

          def mutate(m):
              url = f"https://{PROJECT}.api.sanity.io/v2024-01-01/data/mutate/production"
              data = json.dumps({"mutations": m}).encode()
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=H, method="POST")) as r:
                  return json.loads(r.read())

          with open("scripts/outreach-templates.json") as f:
              templates = json.load(f)

          existing = get('*[_type=="outreachTemplate"]{_id,name,subject,body}')
          by_name  = {t["name"]: t for t in existing}

          patched = 0
          for tmpl in templates:
              name = tmpl.get("name","")
              ex   = by_name.get(name)
              if not ex:
                  print(f"  SKIP (not in Sanity): {name}")
                  continue
              result = mutate([{"patch": {"id": ex["_id"], "set": {
                  "subject": tmpl.get("subject", ex.get("subject","")),
                  "body":    tmpl.get("body",    ex.get("body","")),
              }}}])
              print(f"  PATCHED: {name}")
              patched += 1

          print(f"Done — {patched} templates updated in Sanity")
          PYEOF
