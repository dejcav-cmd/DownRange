name: Fix News Article Images
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fix news article images (OG + Wikimedia)
        run: python3 scripts/fix-news-images.py
