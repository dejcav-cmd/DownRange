name: Seed NFA Data

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seed NFA baseline data to Sanity
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node scripts/seed-nfa-data.js
