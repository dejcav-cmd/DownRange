name: verify-social-dryrun
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_social_dryrun.py
      - run: python3 scripts/push_diag_result.py docs/social_dryrun_result.json
