name: Fix Specific Article + Full Rescan
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose and fix Berkeley article + full rescan
        run: python3 scripts/fix-specific-article.py
