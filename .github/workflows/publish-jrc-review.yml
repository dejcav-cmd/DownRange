name: Publish JRC Review
on:
  push:
    paths:
      - '.github/workflows/publish-jrc-review.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish article
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: vbnsqnkg
        working-directory: scripts
        run: python3 publish_jrc_review.py
      - name: Commit results
        run: |
          git config user.name "dr-bot"; git config user.email "bot@downrangeco.com"
          git add scripts/jrc_review_result.json || true
          git commit -m "chore: JRC review publish results" || true
          git pull --rebase -q || true; git push || true
