name: verify-image-classifier
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 scripts/verify_image_classifier.py
      - run: python3 scripts/push_diag_result.py docs/image_classify_test_result.json
