name: Check NFA Social
on:
  workflow_dispatch:
    inputs:
      script:
        default: check_nfa_social.py
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        working-directory: scripts
        run: python3 ${{ github.event.inputs.script || 'check_nfa_social.py' }} || echo '{"error":"script failed"}' > nfa_social_check.json
      - name: Commit result
        run: |
          git config user.name "dr-bot"; git config user.email "bot@downrangeco.com"
          git add scripts/nfa_social_check.json
          git commit -m "chore: nfa social check result" || true
          git pull --rebase -q || true
          git push || true
