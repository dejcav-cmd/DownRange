name: TLS Bypass Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install curl_cffi --quiet
      - name: Probe
        run: python3 scripts/tls_bypass_probe.py 2>&1 | tee result.txt
      - name: Publish
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/tls-bypass-probe.txt
