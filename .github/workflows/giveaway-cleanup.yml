name: Giveaway Cleanup + Rerun

on:
  push:
    branches: [giveaway-run]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: giveaway-run
          token: ${{ secrets.GH_PAT }}

      - name: Cleanup junk + re-run feed
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "=== CLEANUP ===" | tee scripts/giveaway-run-result.txt
          python3 scripts/giveaway_cleanup.py | tee -a scripts/giveaway-run-result.txt

          echo "" | tee -a scripts/giveaway-run-result.txt
          echo "=== RE-RUN FEED ===" | tee -a scripts/giveaway-run-result.txt
          curl -sL --max-time 180 "https://downrangeco.com/api/agent?feed=giveaways" \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "x-vercel-protection-bypass: $BYPASS" | tee -a scripts/giveaway-run-result.txt

          echo "" | tee -a scripts/giveaway-run-result.txt
          echo "=== FINAL STATE ===" | tee -a scripts/giveaway-run-result.txt
          python3 - << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          TOKEN = os.environ['SANITY_TOKEN']
          def sq(q):
              url = f"https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(q)}"
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}'})
              with urllib.request.urlopen(req) as r: return json.load(r).get('result', [])
          items = sq('*[_type=="giveaway" && active==true]|order(prizeValue desc){title,category,prizeValue,endDate,sponsor}[0..30]')
          print(f"ACTIVE: {len(items)}")
          for x in items:
              print(f"  [{x.get('category','?'):10}] ${x.get('prizeValue',0):5} | {x.get('title','?')[:55]} | ends:{str(x.get('endDate','?'))[:10]}")
          PYEOF
          cat scripts/giveaway-run-result.txt | tee -a scripts/giveaway-run-result.txt

      - name: Save result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'PYEOF'
          import base64, json, urllib.request, os
          GH_PAT = os.environ['GH_PAT']
          content = open('scripts/giveaway-run-result.txt').read()
          enc = base64.b64encode(content.encode()).decode()
          sha = ''
          try:
              req = urllib.request.Request(
                  'https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/giveaway-run-result.txt?ref=giveaway-run',
                  headers={'Authorization': f'Bearer {GH_PAT}'})
              with urllib.request.urlopen(req) as r: sha = json.load(r).get('sha','')
          except: pass
          body = {'message':'chore: giveaway cleanup+rerun result','content':enc,'branch':'giveaway-run'}
          if sha: body['sha'] = sha
          req2 = urllib.request.Request(
              'https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/giveaway-run-result.txt',
              data=json.dumps(body).encode(), method='PUT',
              headers={'Authorization': f'Bearer {GH_PAT}','Content-Type':'application/json'})
          with urllib.request.urlopen(req2) as r:
              d = json.load(r); print('Saved:', d.get('content',{}).get('name'))
          PYEOF
