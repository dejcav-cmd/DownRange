name: Diag ATF HTML

on:
  push:
    paths:
      - '.github/workflows/diag-atf-html.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registered. Trigger via workflow_dispatch to run."

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch raw ATF HTML
        working-directory: scripts
        run: python3 diag_atf_html.py > diag_output.log 2>&1 || true
      - name: Show snippet
        working-directory: scripts
        run: cat diag_output.log
      - name: Commit diag log back to repo (small, reliable)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COMMIT_PATH: scripts/diag_output.log
          LOCAL_FILE: diag_output.log
        working-directory: scripts
        run: python3 commit_atf_html.py

      - name: Commit raw HTML back to repo (best-effort, may be large)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: scripts
        run: python3 commit_atf_html.py
