name: AvantLink Verify Check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Fetch homepage and check for AvantLink script
        run: bash scripts/avantlink_check.sh
      - name: Commit results
        run: |
          git config user.email "ci@downrangeco.com"
          git config user.name "DownRange CI"
          git add -f scripts/avantlink_check_result.txt
          git commit -m "ci: avantlink check result [skip ci]" || echo "no changes"
          git push origin HEAD:main
