name: ca-br-debug-v2
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Canada Brazil feeds
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'PYEOF'
import urllib.request, urllib.parse, json, os, base64, re

token = os.environ.get('SANITY_API_TOKEN') or os.environ.get('SANITY_TOKEN') or ''
if token.startswith('ST='):
    token = token[3:]
if not token:
    print('ERROR: No Sanity token')
    exit(1)

gh_pat = os.environ.get('GH_PAT', '')
project = 'vbnsqnkg'
base_url = f'https://{project}.api.sanity.io/v2024-01-01/data/query/production'

def q(query):
    url = base_url + '?query=' + urllib.parse.quote(query) + '&returnQuery=false'
    req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
    with urllib.request.urlopen(req, timeout=15) as r:
        return json.loads(r.read())['result']

ca = q('*[_type=="canadaContent"]|order(publishedAt desc)[0..4]{_id,title,publishedAt,source}')
br = q('*[_type=="brazilContent"]|order(publishedAt desc)[0..4]{_id,title,publishedAt,source}')
runs = q('*[_type=="cronRun"&&jobId=="news"]|order(at desc)[0..9]{at,status,details,error}')
ca_count = q('count(*[_type=="canadaContent"])')
br_count = q('count(*[_type=="brazilContent"])')

print(f'canadaContent total: {ca_count}')
print(f'brazilContent total: {br_count}')
print('\nLatest Canada:')
for a in ca:
    print(f'  {str(a.get("publishedAt",""))[:10]} | {a.get("source","?")} | {a.get("title","?")[:70]}')
print('\nLatest Brazil:')
for a in br:
    print(f'  {str(a.get("publishedAt",""))[:10]} | {a.get("source","?")} | {a.get("title","?")[:70]}')
print('\nNews cron last 10 runs:')
for r in runs:
    print(f'  {str(r.get("at",""))[:19]} | {r.get("status","?")} | {str(r.get("details",""))[:120]}')

feed_status = {}
feeds = [
    ('TheGunBlog.ca',     'https://www.thegunblog.ca/feed/'),
    ('NFA Canada',        'https://www.nfa.ca/feed/'),
    ('CSSA',              'https://www.cdnshootingsports.org/feed/'),
    ('Calibre Magazine',  'https://calibremag.ca/feed/'),
    ('CCFR',              'https://www.firearmrights.ca/feed/'),
    ('Wolverine',         'https://www.wolverinesupplies.com/blog/feed/'),
    ('JusticeGunOwners',  'https://justiceforgunowners.ca/feed/'),
    ('Firearmsbrasil',    'https://firearmsbrasil.com.br/feed/'),
    ('Legalmente Armado', 'https://legalmentearmado.com.br/feed/'),
    ('CACs e Armas',      'https://www.cacearmas.com.br/feed/'),
]
import urllib.error
print('\nFeed reachability:')
for name, url in feeds:
    try:
        req = urllib.request.Request(url, headers={
            'User-Agent': 'Mozilla/5.0 (compatible; rss-parser/3.0)',
            'Accept': 'application/rss+xml, application/xml, */*',
        })
        with urllib.request.urlopen(req, timeout=8) as r:
            body = r.read(3000)
            item_count = len(re.findall(b'<item>', body))
            print(f'  OK  {name}: HTTP {r.status}, items in preview: {item_count}')
            feed_status[name] = {'http': r.status, 'items_preview': item_count}
    except urllib.error.HTTPError as e:
        print(f'  ERR {name}: HTTP {e.code}')
        feed_status[name] = {'http': e.code}
    except Exception as ex:
        print(f'  ERR {name}: {str(ex)[:60]}')
        feed_status[name] = {'error': str(ex)[:60]}

result = {'canada_total': ca_count, 'brazil_total': br_count, 'canada_latest': ca, 'brazil_latest': br, 'news_cron_runs': runs, 'feed_reachability': feed_status}
output = json.dumps(result, indent=2, default=str)

if gh_pat:
    content_b64 = base64.b64encode(output.encode()).decode()
    api_url = 'https://api.github.com/repos/dejcav-cmd/DownRange/contents/tmp/ca-br-debug.json'
    try:
        req2 = urllib.request.Request(api_url, headers={'Authorization': f'Bearer {gh_pat}', 'Accept': 'application/vnd.github+json'})
        with urllib.request.urlopen(req2, timeout=10) as r2:
            sha = json.loads(r2.read()).get('sha', '')
    except:
        sha = ''
    payload = json.dumps({'message': 'debug: ca/br result', 'content': content_b64, **({'sha': sha} if sha else {})}).encode()
    req3 = urllib.request.Request(api_url, data=payload, method='PUT', headers={'Authorization': f'Bearer {gh_pat}', 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'})
    with urllib.request.urlopen(req3, timeout=10) as r3:
        print(f'\nWrote debug file: HTTP {r3.status}')
PYEOF
