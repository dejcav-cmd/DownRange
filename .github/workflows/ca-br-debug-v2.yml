name: ca-br-debug-v2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push trigger acknowledged."

  trigger:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Trigger Canada and Brazil writers
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "=== Triggering Canada writer ==="
          curl -s -X GET "https://downrangeco.com/api/cron/write-canada-articles" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 90 | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print('Canada result:', json.dumps(d, indent=2))
          except:
            print('Raw:', sys.stdin.read()[:500])
          " 2>/dev/null || echo "Canada request timed out or errored"

          echo ""
          echo "=== Triggering Brazil writer ==="
          curl -s -X GET "https://downrangeco.com/api/cron/write-brazil-articles" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 90 | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print('Brazil result:', json.dumps(d, indent=2))
          except:
            print('Raw:', sys.stdin.read()[:500])
          " 2>/dev/null || echo "Brazil request timed out or errored"

          echo ""
          echo "=== Checking latest articles in Sanity ==="
          python3 - << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          token = os.environ.get('SANITY_API_TOKEN','')
          if token.startswith('ST='): token = token[3:]
          base = 'https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production'
          def q(query):
              url = base + '?query=' + urllib.parse.quote(query) + '&returnQuery=false'
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read())['result']
          ca = q('*[_type=="canadaContent"]|order(_createdAt desc)[0..2]{"slug":slug.current,title,_createdAt}')
          br = q('*[_type=="brazilContent"]|order(_createdAt desc)[0..2]{"slug":slug.current,title,_createdAt}')
          wr = q('*[_type=="cronRun"&&(jobId=="write-canada"||jobId=="write-brazil")]|order(at desc)[0..3]{jobId,at,status,details}')
          print('Latest Canada:')
          for a in ca: print(f'  {a.get("_createdAt","")[:16]} | {a.get("slug","?")[:50]}')
          print('Latest Brazil:')
          for a in br: print(f'  {a.get("_createdAt","")[:16]} | {a.get("slug","?")[:50]}')
          print('Writer runs:')
          for r in wr: print(f'  {r.get("at","")[:16]} | {r.get("jobId","?")} | {r.get("status","?")} | {r.get("details","")[:80]}')
          PYEOF
