name: ca-br-debug-v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ca-br-debug-v2.yml'

jobs:
  write-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger Canada and Brazil article writers
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          echo "=== Triggering Canada writer ==="
          curl -s -X GET "https://downrangeco.com/api/cron/write-canada-articles" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-bypass: ${VERCEL_BYPASS}" \
            --max-time 60 | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d,indent=2))" 2>/dev/null || echo "Canada writer done"

          echo ""
          echo "=== Triggering Brazil writer ==="
          curl -s -X GET "https://downrangeco.com/api/cron/write-brazil-articles" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-bypass: ${VERCEL_BYPASS}" \
            --max-time 60 | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d,indent=2))" 2>/dev/null || echo "Brazil writer done"
