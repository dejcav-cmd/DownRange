name: trigger-quality-rewrite-backlog
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger quality-rewrite 4x to clear backlog
        run: |
          for i in 1 2 3 4; do
            echo "=== Run $i ==="
            curl -sL --max-time 280 "https://downrangeco.com/api/cron/quality-rewrite" \
              -H "x-admin-key: $ADMIN_KEY"
            echo ""
            sleep 5
          done
      - name: Run diagnostic re-check
        run: python3 scripts/diag_missing_body.py
      - name: Push result via Contents API
        run: python3 scripts/push_diag_result.py
