name: Debug Cron Status
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 - << PYEOF2
import urllib.request, urllib.parse, json, os
T = os.environ["SANITY_TOKEN"]
P = "vbnsqnkg"
H = {"Authorization": "Bearer " + T}

def q(query):
    url = "https://" + P + ".api.sanity.io/v2024-01-01/data/query/production?query=" + urllib.parse.quote(query) + "&returnQuery=false"
    r = urllib.request.urlopen(urllib.request.Request(url, headers=H))
    return json.loads(r.read())["result"]

print("=== Recent cronRuns ===")
GROQ1 = '*[_type == "cronRun"] | order(_updatedAt desc)[0...10]{sourceId, status, details, error, _updatedAt}'
runs = q(GROQ1)
for r in runs:
    print(r.get("_updatedAt","?")[:16], "|", r.get("sourceId","?").ljust(15), "|", r.get("status","?").ljust(8), "|", str(r.get("details") or r.get("error",""))[:80])

print("")
print("=== Latest newsArticles ===")
GROQ2 = '*[_type == "newsArticle"] | order(_createdAt desc)[0...5]{title, _createdAt, publishedAt}'
articles = q(GROQ2)
for a in articles:
    print(" ", a.get("_createdAt","?")[:16], "|", a.get("title","?")[:70])

print("")
print("=== pullLog recent ===")
GROQ3 = '*[_type == "pullLog"] | order(_createdAt desc)[0...5]{sourceId, status, itemCount, newItems, error, _createdAt}'
logs = q(GROQ3)
for l in logs:
    print(" ", l.get("_createdAt","?")[:16], "|", l.get("sourceId","?").ljust(10), "|", l.get("status","?").ljust(8), "| items:", l.get("itemCount",0), "new:", l.get("newItems",0), "|", str(l.get("error",""))[:50])
PYEOF2
