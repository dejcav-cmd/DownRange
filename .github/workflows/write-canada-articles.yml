name: Write Canada Articles
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      admin_key:
        description: 'DownRange admin key'
        required: true
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push trigger acknowledged. Manual dispatch required to execute."

  run:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate 10 Canada articles
        run: |
          curl -s -X POST https://downrangeco.com/api/admin/write-canada-articles \
            -H "x-admin-key: ${{ github.event.inputs.admin_key }}" \
            -H "Content-Type: application/json" \
            -d '{"limit":10}' | tee result.json
          cat result.json
