name: Site Health Check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test news slug HTTP responses
        run: |
          python3 - << 'PYEOF'
import urllib.request, json, urllib.parse, os, subprocess, sys

token = os.environ.get('SANITY_TOKEN', '')
query = '*[_type=="newsArticle" && approved==true && defined(slug.current)]|order(publishedAt desc)[0...8]{"s":slug.current}'
encoded = urllib.parse.quote(query)
url = f"https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query={encoded}"

slugs = []
try:
    req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
    with urllib.request.urlopen(req, timeout=15) as r:
        d = json.loads(r.read())
    slugs = [a['s'] for a in d.get('result', []) if a.get('s')][:6]
    print(f"Sanity returned {len(slugs)} slugs")
except Exception as e:
    print(f"Sanity fetch failed: {e}")
    sys.exit(0)

base = "https://www.downrangeco.com"
passed = 0
failed = 0
print("
=== Testing /news/[slug] pages ===")
for slug in slugs:
    result = subprocess.run(
        ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "-A",
         "Mozilla/5.0 DownRange-SmokeTest", "--max-time", "20", "-L", f"{base}/news/{slug}"],
        capture_output=True, text=True
    )
    status = result.stdout.strip()
    mark = "OK  " if status in ("200","404") else ("FAIL" if status == "500" else "?   ")
    print(f"  {mark} /news/{slug} -> {status}")
    if status == "500":
        failed += 1
    else:
        passed += 1

print(f"
Results: {passed} ok, {failed} 500s")
if failed > 0:
    sys.exit(1)
PYEOF
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
