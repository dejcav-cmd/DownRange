name: Site Health Check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run site check
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/site_check.py
      - name: Push results
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CONTENT=$(base64 -w 0 scripts/site_check_result.json)
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/site_check_result.json" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))")
          curl -s -X PUT \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/site_check_result.json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"ci: site check result [skip ci]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
