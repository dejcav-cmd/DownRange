name: Site Health Check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site check
        run: python3 scripts/site_check.py
      - name: Push results
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CONTENT=$(base64 -w 0 scripts/site_check_result.json)
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/site_check_result.json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            python3 -c "import json; print(json.dumps({'message':'chore: site check result [skip ci]','content':'$CONTENT','sha':'$SHA'}))" > /tmp/p.json
          else
            python3 -c "import json; print(json.dumps({'message':'chore: site check result [skip ci]','content':'$CONTENT'}))" > /tmp/p.json
          fi
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/site_check_result.json" \
            -d @/tmp/p.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if 'content' in d else d.get('message','?')[:80])"
