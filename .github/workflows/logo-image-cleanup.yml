name: logo-image-cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo-shaped images in Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/fix_logo_images.py
      - name: Commit results via API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/commit_results.py
