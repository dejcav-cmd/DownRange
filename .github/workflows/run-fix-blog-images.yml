name: Run Fix Blog Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Fix blog post images
        run: |
          echo "🔧 Fixing blog post images..."
          RESPONSE=$(curl -s -X POST "https://downrangeco.com/api/admin/fix-blog-images" \
            -H "x-admin-key: e0f56a3c7c9d4e8b2f1a5c3e7d9b2f0a" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          echo "📋 Response:"
          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Blog images fixed successfully!"
          else
            echo "❌ Fix may have failed - check response above"
          fi
