name: Giveaway Source Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Live-test giveaway scrapers
        id: test
        continue-on-error: true
        run: node scripts/test_giveaway_sources.mjs 2>&1 | tee result.txt
      - name: Trigger the real cron on production
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "" >> result.txt
          echo "=== PRODUCTION CRON RUN ===" >> result.txt
          curl -s -X POST "https://www.downrangeco.com/api/cron/giveaways" \
            -H "x-admin-key: $ADMIN_KEY" \
            --max-time 120 | python3 -m json.tool >> result.txt 2>&1 || echo "cron call failed" >> result.txt
      - name: Publish result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/giveaway-test.txt
      - name: Fail if test failed
        if: steps.test.outcome == 'failure'
        run: exit 1
