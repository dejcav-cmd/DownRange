name: diag-missing-body-2
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/diag_missing_body.py
      - run: python3 scripts/push_diag_result.py
