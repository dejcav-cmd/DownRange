name: Upload Learn Images to Sanity CDN
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload images to Sanity CDN and patch source files
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/upload-learn-to-sanity.py
