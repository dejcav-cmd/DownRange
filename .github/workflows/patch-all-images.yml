name: Patch All Images (Learn + Guns)
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Learn and Gun page images
        run: python3 scripts/patch-all-images.py
