name: Publish Midterms 2A Blog

on:
  push:
    paths:
      - '.github/workflows/publish-midterms-2a-blog.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run publish script
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: vbnsqnkg
        working-directory: scripts
        run: python3 publish_midterms_2a_blog.py > publish_output.log 2>&1 || true

      - name: Show publish log
        working-directory: scripts
        run: cat publish_output.log

      - name: Report result back via Contents API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: scripts
        run: python3 report_midterms_2a_result.py
