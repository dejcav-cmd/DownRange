name: Diag CDATA Bug

on:
  push:
    paths:
      - '.github/workflows/diag-cdata-bug.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registered. Trigger via workflow_dispatch to run."

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Sanity for CDATA leakage
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: vbnsqnkg
        working-directory: scripts
        run: python3 diag_cdata_bug.py > diag_output.log 2>&1 || true

      - name: Fetch real Bearing Arms RSS feed raw XML
        run: |
          curl -s "https://bearingarms.com/feed/" -H "User-Agent: Mozilla/5.0" -o scripts/bearingarms_raw.xml
          echo "--- first CDATA occurrence context ---"
          python3 -c "
content = open('scripts/bearingarms_raw.xml', encoding='utf-8', errors='replace').read()
idx = content.find('Colorado Sheriffs')
if idx == -1:
    idx = content.find('<description>')
print(content[max(0,idx-200):idx+1200])
" > scripts/bearingarms_snippet.txt
          cat scripts/bearingarms_snippet.txt

      - name: Show log
        working-directory: scripts
        run: cat diag_output.log

      - name: Report result
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: scripts
        run: python3 report_cdata_bug.py
