name: Deploy Sanity Schema

on:
  push:
    branches: [main]
    paths:
      - 'sanity/schemas/**'

jobs:
  deploy:
    name: Deploy to Sanity
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Sanity schema
        run: npm run studio:deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_TOKEN }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: vbnsqnkg
          NEXT_PUBLIC_SANITY_DATASET: production

      - name: Log success
        if: success()
        run: echo "✅ Sanity schema deployed"
