name: Deploy Sanity Schema

on:
  push:
    branches: [main]
    paths:
      - 'sanity/schemas/**'
      - 'sanity/structure/**'
      - 'sanity.cli.js'
      - 'sanity.config.ts'

jobs:
  deploy:
    name: Deploy to Sanity
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Sanity schema
        run: cd sanity && npm run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Notify on success
        if: success()
        run: echo "✅ Sanity schema deployed successfully"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Sanity schema deployment failed" && exit 1
