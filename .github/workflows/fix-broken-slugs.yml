name: Fix All Broken Slugs
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run social post dry-run test
        env:
          ADMIN_KEY: ${{ secrets.AGENT_SECRET }}
        run: pip install requests && python3 scripts/test_social_posts.py
