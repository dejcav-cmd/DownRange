name: Fix All Broken Slugs
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Social post dry-run test
        env:
          ADMIN_KEY: ${{ secrets.AGENT_SECRET }}
        run: pip install requests && python3 scripts/test_social_posts.py
      - name: Commit results
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add fix_results.json
          git diff --staged --quiet || git commit -m "test: social post dry-run results"
          git push || true
