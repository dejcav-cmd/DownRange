name: Fix All Broken Slugs
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run fix-slugs cron (scan all hash slugs)
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=== FIXING HASH SLUGS ==="
          curl -sfL "https://downrangeco.com/api/cron/fix-slugs?limit=500" \
            -H "x-admin-key: $K" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('checked:', d.get('checked'), 'found:', d.get('found'), 'fixed:', d.get('fixed'), 'ms:', d.get('ms'))
for r in d.get('results',[]):
    print('  ' + r['_id'] + ' → ' + r.get('new','?') + (' OK' if r.get('ok') else ' FAIL:'+r.get('error','')))
"
      - name: Rewrite the broken article via backfill
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=== REWRITING news-eed497e6be7af0dc1180944d6c718f95 ==="
          curl -sfL "https://downrangeco.com/api/admin/backfill-articles" \
            -H "x-admin-key: $K" \
            -H "Content-Type: application/json" \
            -d '{"types":["newsArticle"],"singleId":"news-eed497e6be7af0dc1180944d6c718f95","force":true}' \
            --max-time 120 | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('rewrite result:', json.dumps(d)[:400])
except: print('completed')
" || echo "rewrite done"
