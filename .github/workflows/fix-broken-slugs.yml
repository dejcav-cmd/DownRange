name: Fix All Broken Slugs
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Fix slugs
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: pip install requests && python3 fix_slugs.py
      - name: Save results
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add fix_results.json
          git diff --staged --quiet || git commit -m "chore: slug fix results"
          git push
