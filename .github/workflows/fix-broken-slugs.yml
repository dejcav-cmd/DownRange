name: Fix All Broken Slugs
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Verify new env keys + trigger feeds
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=== KEY STATUS ==="
          curl -sfL "https://downrangeco.com/api/admin/cron-health" -H "x-admin-key: $K" | python3 -c "
import sys,json
d=json.load(sys.stdin)
env=d.get('env',{})
for k in ['NEWSAPI_KEY','GNEWS_KEY','LEGISCAN_KEY','YOUTUBE_API_KEY','VERCEL_TOKEN']:
    v=env.get(k,{})
    print(k+': SET' if v.get('set') else k+': MISSING')
print('OVERALL_STATUS:',d.get('status'))
for i in d.get('issues',[]): print('ISSUE',i.get('severity'),i.get('msg',''))
s=d.get('sanity',{})
print('ARTICLES:',s.get('counts',{}).get('articles','?'))
print('MINS_SINCE:',s.get('minutesSinceLastArticle','?'))
lat=s.get('latest',{})
if lat: print('LATEST_TITLE:',lat.get('title','')[:100])
" 2>&1
          echo "=== TRIGGER NEWS FEED ==="
          curl -sfL "https://downrangeco.com/api/agent?feed=news" \
            -H "Authorization: Bearer $K" --max-time 55 2>&1 | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('NEWS:done='+str(d.get('done',0)),'ai='+str(d.get('withAI',0)),'total='+str(d.get('total',0)),'dupes='+str(d.get('dupes',0)))
except Exception as e: print('news response non-JSON or timeout (ok):',str(e)[:100])
" || echo "news triggered"
          echo "=== TRIGGER LAWS ==="
          curl -sfL "https://downrangeco.com/api/agent?feed=laws" -H "Authorization: Bearer $K" --max-time 30 | head -c 200 || echo "laws triggered"
