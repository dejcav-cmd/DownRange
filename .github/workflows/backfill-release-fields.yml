name: Backfill Release Fields
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/backfill_release_fields.py > /tmp/out.txt 2>&1 || true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/put_result.py /tmp/out.txt scripts/backfill_release_fields_result.json
