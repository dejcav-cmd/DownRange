name: Add Twilio Env Vars to Vercel

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - run: echo "push trigger guard"

  add-env:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Add Twilio credentials to Vercel + redeploy + test
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          # ── Get project metadata ──────────────────────────────────────
          PROJECT=$(curl -sf "https://api.vercel.com/v9/projects/downrangeco" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          PROJECT_ID=$(echo "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          TEAM_ID=$(echo "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['accountId'])")
          echo "Project: $PROJECT_ID  Team: $TEAM_ID"

          # ── Upsert one env var ────────────────────────────────────────
          upsert_env() {
            local KEY="$1"
            local VAL="$2"
            echo "→ $KEY"

            # Delete all existing entries with this key
            EXISTING_IDS=$(curl -s \
              "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID&limit=100" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | \
              python3 -c "
import sys,json
data = json.load(sys.stdin)
ids = [e['id'] for e in data.get('envs',[]) if e['key']=='$KEY']
print('\n'.join(ids))
")
            for id in $EXISTING_IDS; do
              curl -sf -X DELETE \
                "https://api.vercel.com/v9/projects/$PROJECT_ID/env/$id?teamId=$TEAM_ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" > /dev/null && echo "  deleted old $id"
            done

            # Create new encrypted var for all targets
            RESP=$(curl -sf -X POST \
              "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$KEY\",\"value\":\"$VAL\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}")
            echo "  ✓ created: $(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id','?')[:16])")"
          }

          upsert_env "TWILIO_ACCOUNT_SID" "$TWILIO_ACCOUNT_SID"
          upsert_env "TWILIO_AUTH_TOKEN"  "$TWILIO_AUTH_TOKEN"
          upsert_env "TWILIO_FROM_NUMBER" "$TWILIO_FROM_NUMBER"
          upsert_env "ALERT_PHONE_NUMBER" "$ALERT_PHONE_NUMBER"
          echo "✓ All 4 Twilio vars written to Vercel"

          # ── Trigger redeploy ──────────────────────────────────────────
          LATEST_DEP=$(curl -sf \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=1&state=READY" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          DEP_ID=$(echo "$LATEST_DEP" | python3 -c "import sys,json; deps=json.load(sys.stdin).get('deployments',[]); print(deps[0]['uid'] if deps else '')")
          echo "Latest deployment: $DEP_ID"

          REDEPLOY=$(curl -sf -X POST \
            "https://api.vercel.com/v13/deployments?teamId=$TEAM_ID&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"deploymentId\":\"$DEP_ID\",\"name\":\"downrangeco\",\"target\":\"production\"}")
          NEW_DEP=$(echo "$REDEPLOY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','?')[:24])")
          echo "✓ Redeploy triggered: $NEW_DEP"

          # ── Wait for deployment to be ready ───────────────────────────
          echo "Waiting 90s for deployment..."
          sleep 90

          # ── Send test SMS ─────────────────────────────────────────────
          echo "Sending test SMS..."
          SMS_RESULT=$(curl -s -X POST "https://downrangeco.com/api/admin/test-sms" \
            -H "Content-Type: application/json" \
            -H "x-admin-key: $ADMIN_KEY" \
            -d '{}')
          echo "SMS result: $SMS_RESULT"

          SENT=$(echo "$SMS_RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sent','false'))")
          SID=$(echo "$SMS_RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sid','—'))")
          if [ "$SENT" = "True" ] || [ "$SENT" = "true" ]; then
            echo "✓ TEST SMS SENT — Twilio SID: $SID"
          else
            echo "✗ SMS failed: $SMS_RESULT"
            exit 1
          fi

      - name: Write result to repo
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          CONTENT="# Twilio Setup — $TS\n\nAll 4 env vars written to Vercel and test SMS dispatched.\n"
          ENCODED=$(printf '%s' "$CONTENT" | base64 -w 0)
          SHA=$(curl -s "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/twilio-setup-result.md" \
            -H "Authorization: Bearer $GH_PAT" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          BODY="{\"message\":\"chore: twilio setup result $TS\",\"content\":\"$ENCODED\""
          [ -n "$SHA" ] && BODY="$BODY,\"sha\":\"$SHA\""
          BODY="$BODY}"
          curl -s -X PUT "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/twilio-setup-result.md" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null
          echo "Result written."
