name: patch-kuna-direct
on:
  workflow_dispatch:
    inputs:
      dummy:
        required: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "guard"
  run:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Patch deals directly
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/patch_kuna_direct.py
