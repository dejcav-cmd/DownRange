name: Trigger Enhanced Law Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      state:
        description: 'State code (or leave blank for all 50)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no changes)?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push trigger acknowledged. Manual dispatch required to execute."

  sync:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Enhanced Law Sync
        run: |
          ADMIN_KEY="${{ secrets.DR_ADMIN_KEY }}"
          STATE="${{ inputs.state }}"
          DRY="${{ inputs.dry_run }}"
          
          echo "🔫 Triggering Enhanced Law Sync"
          echo "Admin Key: ***"
          echo "State: ${STATE:-ALL}"
          echo "Dry Run: ${DRY}"
          echo ""
          
          if [ -z "$STATE" ]; then
            QUERY=""
          else
            QUERY="&state=${STATE}"
          fi
          
          if [ "$DRY" = "true" ]; then
            QUERY="${QUERY}&dry=1"
            echo "Running DRY (no changes)..."
          else
            echo "Running LIVE (will update Sanity)..."
          fi
          
          URL="https://downrangeco.com/api/cron/nra-law-sync-enhanced?key=${ADMIN_KEY}${QUERY}"
          
          echo "Calling: https://downrangeco.com/api/cron/nra-law-sync-enhanced?key=***${QUERY}"
          echo ""
          
          curl -i -X GET "${URL}" -H "User-Agent: GitHub-Actions-DownRange/1.0" \
            --connect-timeout 90 \
            --max-time 120 \
            2>&1 | tee response.txt
          
          echo ""
          echo "✅ Sync triggered"
