name: Fix Broken Articles

# Finds articles whose page 404s (no URL slug): fixes the link, or deletes the thin ones older than 7 days
# (backed up first). Writes the outcome to scripts/fix_broken_result.json so it can be reviewed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preview and apply
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -u
          curl -s --max-time 120 -H "x-admin-key: $ADMIN_KEY" https://www.downrangeco.com/api/admin/fix-broken-articles > preview.json || echo '{"ok":false,"error":"preview request failed"}' > preview.json
          cat preview.json | head -c 3000; echo
          code=$(curl -s -o apply.json -w '%{http_code}' --max-time 280 -X POST -H "x-admin-key: $ADMIN_KEY" -H 'Content-Type: application/json' -d '{"confirm":true}' https://www.downrangeco.com/api/admin/fix-broken-articles || echo 000)
          echo "apply HTTP $code"; cat apply.json | head -c 2000; echo
          python3 - <<'PY'
          import json
          def load(p):
              try: return json.load(open(p))
              except Exception as e: return {"error": str(e)}
          json.dump({"preview": load("preview.json"), "apply": load("apply.json")}, open("scripts/fix_broken_result.json","w"), indent=2)
          PY
      - name: Commit result
        run: |
          git config user.name "claude-bot"; git config user.email "noreply@anthropic.com"
          git add scripts/fix_broken_result.json
          git commit -m "chore: fix-broken-articles result" || echo "nothing to commit"
          git pull --rebase -q || true
          git push || true
