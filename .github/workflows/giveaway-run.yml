name: Run Giveaway Feed

on:
  push:
    branches: [giveaway-run]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run giveaway feed + check results
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          echo "=== BEFORE ===" | tee scripts/giveaway-run-result.txt
          curl -s 'https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=count(*[_type=="giveaway"%20%26%26%20active==true])' \
            -H "Authorization: Bearer $SANITY_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Active before:',d.get('result',0))" | tee -a scripts/giveaway-run-result.txt

          echo "" | tee -a scripts/giveaway-run-result.txt
          echo "=== RUNNING FEED ===" | tee -a scripts/giveaway-run-result.txt
          RESULT=$(curl -sL --max-time 180 "https://downrangeco.com/api/agent?feed=giveaways" \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "x-vercel-protection-bypass: $BYPASS")
          echo "$RESULT" | tee -a scripts/giveaway-run-result.txt

          echo "" | tee -a scripts/giveaway-run-result.txt
          echo "=== AFTER ===" | tee -a scripts/giveaway-run-result.txt
          curl -s 'https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=*[_type=="giveaway"%20%26%26%20active==true]|order(addedAt%20desc){title,sponsor,category,prizeValue,endDate,entryUrl}[0..30]' \
            -H "Authorization: Bearer $SANITY_TOKEN" | python3 -c "
import sys, json
d = json.load(sys.stdin)
items = d.get('result', [])
print(f'Active after: {len(items)}')
for r in items:
    print(f'  [{r.get(\"category\",\"?\"):10}] \${r.get(\"prizeValue\",0):5} | {r.get(\"title\",\"?\")[:50]} | ends:{str(r.get(\"endDate\",\"?\"))[:10]}')
" | tee -a scripts/giveaway-run-result.txt

      - name: Commit result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git remote set-url origin "https://dejcav-cmd:${GH_PAT}@github.com/dejcav-cmd/DownRange.git"
          git add scripts/giveaway-run-result.txt
          git diff --staged --quiet || git commit -m "chore: giveaway run result $(date -u +%H:%M)"
          git push origin HEAD
