name: Run Giveaway Feed

on:
  push:
    branches: [giveaway-run]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write query script
        run: |
          cat > /tmp/sanity_query.py << 'PYEOF'
          import urllib.request, json, os, sys
          TOKEN = os.environ['SANITY_TOKEN']
          def query(q):
              import urllib.parse
              url = f"https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(q)}"
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}'})
              with urllib.request.urlopen(req) as r:
                  return json.load(r).get('result', [])
          before = query('count(*[_type=="giveaway" && active==true])')
          print(f"BEFORE: {before} active giveaways")
          sys.stdout.flush()
          PYEOF

      - name: Check before count
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 /tmp/sanity_query.py | tee scripts/giveaway-run-result.txt

      - name: Run giveaway feed
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          echo "=== RUNNING FEED ===" | tee -a scripts/giveaway-run-result.txt
          curl -sL --max-time 180 "https://downrangeco.com/api/agent?feed=giveaways" \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "x-vercel-protection-bypass: $BYPASS" | tee -a scripts/giveaway-run-result.txt

      - name: Write after-query script
        run: |
          cat > /tmp/sanity_after.py << 'PYEOF'
          import urllib.request, json, os, urllib.parse
          TOKEN = os.environ['SANITY_TOKEN']
          def query(q):
              url = f"https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(q)}"
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}'})
              with urllib.request.urlopen(req) as r:
                  return json.load(r).get('result', [])
          items = query('*[_type=="giveaway" && active==true]|order(addedAt desc){title,sponsor,category,prizeValue,endDate}[0..30]')
          print(f"AFTER: {len(items)} active giveaways")
          for r in items:
              cat = r.get('category','?')
              val = r.get('prizeValue',0)
              title = r.get('title','?')[:50]
              end = str(r.get('endDate','?'))[:10]
              print(f"  [{cat:10}] ${val:5} | {title} | ends:{end}")
          PYEOF

      - name: Check after count
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          echo "" | tee -a scripts/giveaway-run-result.txt
          echo "=== AFTER ===" | tee -a scripts/giveaway-run-result.txt
          python3 /tmp/sanity_after.py | tee -a scripts/giveaway-run-result.txt

      - name: Commit result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git remote set-url origin "https://dejcav-cmd:${GH_PAT}@github.com/dejcav-cmd/DownRange.git"
          git add scripts/giveaway-run-result.txt
          git diff --staged --quiet || git commit -m "chore: giveaway run $(date -u +%H:%M)"
          git push origin HEAD
