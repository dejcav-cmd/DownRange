name: Deal Image Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Jina key test
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: node scripts/jina_key_test.mjs 2>&1 | tee result.txt
      - name: Publish
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/deal-image-probe.txt
