name: Fix Canada Articles (Images + Slugs)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "yes" to apply changes (default is dry-run)'
        required: false
        default: 'no'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push trigger acknowledged. Manual dispatch required to execute."

  fix:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run fix script
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "yes" ]; then
            python3 scripts/fix-canada-articles.py --apply | tee scripts/diag-result.txt
          else
            python3 scripts/fix-canada-articles.py | tee scripts/diag-result.txt
          fi
      - name: Commit result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git remote set-url origin https://x-access-token:$GH_PAT@github.com/dejcav-cmd/DownRange.git
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || (git commit -m "fix canada articles result [skip ci]" && git pull --rebase && git push) || true
