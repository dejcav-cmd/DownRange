name: Trigger gun-deals cron (seed gunDeal docs)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push trigger acknowledged. Manual dispatch required to execute."

  trigger:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Fire gun-deals cron
        run: |
          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://downrangeco.com/api/cron/gun-deals")
          echo "$RESPONSE"
          echo "$RESPONSE" > scripts/gun-deals-cron-result.txt
      - name: Commit result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git remote set-url origin https://x-access-token:$GH_PAT@github.com/dejcav-cmd/DownRange.git
          git add -f scripts/gun-deals-cron-result.txt
          git commit -m "chore: gun-deals cron trigger result" || echo "nothing to commit"
          git push || echo "nothing to push"
