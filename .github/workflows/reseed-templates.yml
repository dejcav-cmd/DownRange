name: Reseed Outreach Templates
on:
  workflow_dispatch:
jobs:
  reseed:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Reseed all 10 templates via Sanity API
        run: python3 scripts/reseed-templates.py
