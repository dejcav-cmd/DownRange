name: Check Deal Sources
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Check sources
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/check_sources.py
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || (git commit -m "check sources result" && git pull --rebase && git push) || true
