name: Verify Release Schema
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_release_schema.py > /tmp/out.txt 2>&1 || true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/put_result.py /tmp/out.txt scripts/verify_release_schema_result.txt
