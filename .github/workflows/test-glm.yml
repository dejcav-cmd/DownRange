name: Test GLM Key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Test GLM via live Vercel endpoint
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "=== Testing GLM via live DownRange endpoints ===" | tee scripts/diag-result.txt
          echo "" | tee -a scripts/diag-result.txt

          # 1. Check AI status (which chains are active)
          echo "── AI Status ────────────────────────────────────" | tee -a scripts/diag-result.txt
          curl -s "https://downrangeco.com/api/admin/ai-status" \
            -H "x-admin-key: $ADMIN_KEY" \
            --max-time 15 | python3 -c "
import sys, json
d = json.load(sys.stdin)
print('Providers:')
for k,v in d.get('available', d).items():
    if isinstance(v, bool):
        print(f'  {k}: {\"YES\" if v else \"NO\"}')
print()
print('Active chains:')
for k,v in d.get('chains', {}).items():
    print(f'  {k:15s}: {v}')
" 2>/dev/null | tee -a scripts/diag-result.txt

          echo "" | tee -a scripts/diag-result.txt

          # 2. Test AI directly via ai-test endpoint
          echo "── Direct GLM test via /api/admin/ai-test ───────" | tee -a scripts/diag-result.txt
          curl -s "https://downrangeco.com/api/admin/ai-test" \
            -X POST \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d '{"provider":"glm","prompt":"Say GLM working","maxTokens":20}' \
            --max-time 20 | python3 -c "
import sys, json
d = json.load(sys.stdin)
print(json.dumps(d, indent=2))
" 2>/dev/null | tee -a scripts/diag-result.txt

          echo "" | tee -a scripts/diag-result.txt

          # 3. Trigger one news cron run and check response
          echo "── News cron test run ───────────────────────────" | tee -a scripts/diag-result.txt
          curl -s "https://downrangeco.com/api/agent?feed=news" \
            -X POST \
            -H "x-admin-key: $ADMIN_KEY" \
            --max-time 45 | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    print(f'Status: {d.get(\"status\", d.get(\"ok\", \"?\"))}')
    print(f'Published: {d.get(\"published\", d.get(\"count\", \"?\"))}')
    print(f'AI provider: {d.get(\"aiProvider\", d.get(\"provider\", \"not reported\"))}')
    print(f'Full: {str(d)[:400]}')
except Exception as e:
    raw = sys.stdin.read()
    print(f'Parse error: {e}')
    print(f'Raw: {raw[:300]}')
" 2>/dev/null | tee -a scripts/diag-result.txt

      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "glm test result [skip ci]" && git push
