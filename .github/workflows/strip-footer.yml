name: Strip Source Footer
on:
  workflow_dispatch:

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @sanity/client
      - name: Run strip script
        env:
          SANITY_TOKEN: "skbUvbYYIvf0Uwc43kqoHa7MX556BIABP7tNDQjW06yeBHY9ImiPeEjgMs87ZxlUafA5XRt6LXwn8d5Y9JcmDaZN13fvjxt6Tm3QgSAE8LqSvP6oU7zgF3W4dGb3jnjVIuBnZTICBsln2LHqgKjFIAybBohK6JCJWR8qHmP6CMhPVpsiPB79"
        run: |
          node - << 'NODEOF'
          const { createClient } = require('@sanity/client')
          const sanity = createClient({
            projectId: 'vbnsqnkg',
            dataset: 'production',
            apiVersion: '2024-01-01',
            useCdn: false,
            token: process.env.SANITY_TOKEN,
          })

          function strip(body) {
            if (!body) return { out: body, changed: false }
            let out = body
            // Cast a wide net — catch any variation of the footer
            out = out.replace(/<p[^>]*>[^<]*[Ss]ource:[^<]*[Vv]isit the original[^<]*<\/p>/gi, '')
            out = out.replace(/<p[^>]*>[^<]*[Ss]ource:[^<]*[Bb]earing Arms[^<]*<\/p>/gi, '')
            out = out.replace(/<p[^>]*>\s*<em>[^<]*[Ss]ource:[^<]*<\/em>\s*<\/p>/gi, '')
            out = out.replace(/\n?<p[^>]*>[^<]*visit the original[^<]*article[^<]*<\/p>/gi, '')
            out = out.replace(/\n?Source:[^\n]*visit the original[^\n]*/gi, '')
            out = out.replace(/\n?Source:[^\n]*[Bb]earing Arms[^\n]*/gi, '')
            out = out.trim()
            return { out, changed: out !== body }
          }

          async function run() {
            const docs = await sanity.fetch('*[_type == "newsArticle" && defined(body) && body != ""]{ _id, body }')
            console.log('Total articles fetched:', docs.length)

            // Print 3 sample tails to see what we are dealing with
            for (let i = 0; i < Math.min(3, docs.length); i++) {
              const tail = docs[i].body.slice(-200).replace(/\n/g,' ')
              console.log('SAMPLE TAIL', i, ':', tail)
            }

            let patched = 0, skipped = 0
            const BATCH = 50
            for (let i = 0; i < docs.length; i += BATCH) {
              const batch = docs.slice(i, i + BATCH)
              const tx = sanity.transaction()
              let hasWork = false
              for (const doc of batch) {
                const { out, changed } = strip(doc.body)
                if (changed) {
                  tx.patch(doc._id, p => p.set({ body: out }))
                  hasWork = true
                  patched++
                } else skipped++
              }
              if (hasWork) { await tx.commit(); console.log('Committed batch', i, '-', i+BATCH) }
            }
            console.log('DONE. Patched:', patched, '| Skipped (clean):', skipped, '| Total:', docs.length)
          }
          run().catch(e => { console.error('FATAL:', e.message); process.exit(1) })
          NODEOF
