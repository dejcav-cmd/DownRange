name: Strip Source Footer
on:
  workflow_dispatch:

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @sanity/client
      - name: Run strip script
        env:
          SANITY_TOKEN: "skbUvbYYIvf0Uwc43kqoHa7MX556BIABP7tNDQjW06yeBHY9ImiPeEjgMs87ZxlUafA5XRt6LXwn8d5Y9JcmDaZN13fvjxt6Tm3QgSAE8LqSvP6oU7zgF3W4dGb3jnjVIuBnZTICBsln2LHqgKjFIAybBohK6JCJWR8qHmP6CMhPVpsiPB79"
        run: |
          node << 'EOF'
          const { createClient } = require('@sanity/client')
          const sanity = createClient({
            projectId: 'vbnsqnkg',
            dataset: 'production',
            apiVersion: '2024-01-01',
            useCdn: false,
            token: process.env.SANITY_TOKEN,
          })
          const PATTERNS = [
            /<p[^>]*>\s*<em>\s*Source:[^<]*visit the original[^<]*article[^<]*<\/em>\s*<\/p>/gi,
            /<p[^>]*>\s*Source:[^<]*visit the original[^<]*<\/p>/gi,
            /\n?Source:\s*visit the original[^\n.]*\./gi,
          ]
          function strip(body) {
            if (!body) return { out: body, changed: false }
            let out = body
            for (const p of PATTERNS) out = out.replace(p, '')
            out = out.trim()
            return { out, changed: out !== body }
          }
          async function run() {
            const docs = await sanity.fetch('*[_type == "newsArticle" && defined(body)]{ _id, body }')
            console.log('Total articles:', docs.length)
            let patched = 0, skipped = 0
            const BATCH = 50
            for (let i = 0; i < docs.length; i += BATCH) {
              const batch = docs.slice(i, i + BATCH)
              const tx = sanity.transaction()
              let hasWork = false
              for (const doc of batch) {
                const { out, changed } = strip(doc.body)
                if (changed) { tx.patch(doc._id, p => p.set({ body: out })); hasWork = true; patched++ }
                else skipped++
              }
              if (hasWork) { await tx.commit(); console.log('Committed batch', i) }
            }
            console.log('DONE. Patched:', patched, '| Skipped:', skipped)
          }
          run().catch(e => { console.error(e.message); process.exit(1) })
          EOF
