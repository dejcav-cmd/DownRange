name: debug-img-check
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query Sanity article image
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 << 'PYEOF'
import urllib.request, urllib.parse, json, os

token = os.environ["SANITY_TOKEN"]
slug = "mark-xix-desert-eagle-suppressor-ready-69efb4"
query = '*[_type == "newsArticle" && slug.current == "' + slug + '"] { _id, title, imageUrl, externalUrl, category, heroImage }'
encoded = urllib.parse.quote(query)
url = f"https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query={encoded}"
req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
with urllib.request.urlopen(req) as r:
    data = json.loads(r.read())
result = data.get("result", [])
print(f"FOUND: {len(result)} docs")
for doc in result:
    print(f"ID: {doc.get(\"_id\")}")
    print(f"TITLE: {doc.get(\"title\")}")
    print(f"IMAGE_URL: {doc.get(\"imageUrl\")}")
    print(f"EXTERNAL_URL: {doc.get(\"externalUrl\")}")
    print(f"CATEGORY: {doc.get(\"category\")}")
PYEOF

