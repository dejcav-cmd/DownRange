name: Probe AmmoSeek RSS
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AmmoSeek probe
        run: python3 scripts/probe_ammoseek.py
      - name: Commit result via API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CONTENT=$(base64 -w 0 scripts/ammoseek_probe_result.json)
          # Get current file SHA if it exists
          SHA=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/ammoseek_probe_result.json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          # Build payload
          if [ -n "$SHA" ]; then
            PAYLOAD=$(python3 -c "import json; print(json.dumps({'message':'chore: ammoseek probe results [skip ci]','content':'$CONTENT','sha':'$SHA'}))")
          else
            PAYLOAD=$(python3 -c "import json; print(json.dumps({'message':'chore: ammoseek probe results [skip ci]','content':'$CONTENT'}))")
          fi
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/ammoseek_probe_result.json" \
            -d "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if 'content' in d else d)"
