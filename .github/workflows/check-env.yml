name: Check Env Vars
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check endpoints and save to public
        env:
          ADMIN_KEY: ${{ secrets.AGENT_SECRET }}
        run: |
          mkdir -p public
          curl -s "https://downrangeco.com/api/admin/cron-health" -H "x-admin-key: $ADMIN_KEY" > public/dr-env-check.json
          echo "DONE"
          cat public/dr-env-check.json | python3 -c "
import sys,json
d=json.load(sys.stdin)
env=d.get('env',{})
print('SET:')
for k,v in env.items():
    if v.get('set'): print(' ',k)
print('MISSING:')
for k,v in env.items():
    if not v.get('set'): print(' ',k,'critical=',v.get('critical'))
"
      - name: Also check ai-status
        env:
          ADMIN_KEY: ${{ secrets.AGENT_SECRET }}
        run: |
          curl -s "https://downrangeco.com/api/admin/ai-status" -H "x-admin-key: $ADMIN_KEY" | python3 -c "
import sys,json
d=json.load(sys.stdin)
s=d.get('status',{})
print('AI STATUS:')
for k,v in s.items():
    print(' ',k,'=',v)
print('ROUTING:')
for k,v in d.get('routing',{}).items():
    print(' ',k,'->',v)
print('TESTS:')
for k,v in d.get('tests',{}).items():
    print(' ',k,v)
"
