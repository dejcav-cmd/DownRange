name: Check Env Vars
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hit cron-health
        env:
          ADMIN_KEY: ${{ secrets.AGENT_SECRET }}
        run: |
          curl -s "https://downrangeco.com/api/admin/cron-health" \
            -H "x-admin-key: $ADMIN_KEY" > /tmp/health.json
          cat /tmp/health.json
      - name: Hit ai-status
        env:
          ADMIN_KEY: ${{ secrets.AGENT_SECRET }}
        run: |
          curl -s "https://downrangeco.com/api/admin/ai-status" \
            -H "x-admin-key: $ADMIN_KEY" > /tmp/aistatus.json
          cat /tmp/aistatus.json
      - name: Hit env-check
        env:
          ADMIN_KEY: ${{ secrets.AGENT_SECRET }}
        run: |
          curl -s "https://downrangeco.com/api/admin/env-check" \
            -H "x-admin-key: $ADMIN_KEY" > /tmp/envcheck.json
          cat /tmp/envcheck.json
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: env-check-results
          path: /tmp/*.json
