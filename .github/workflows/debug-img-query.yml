name: debug-img-query
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Sanity query
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/debug_image_check.py
      - name: Commit results
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git remote set-url origin "https://dejcav-cmd:${GH_PAT}@github.com/dejcav-cmd/DownRange.git"
          git add scripts/debug_image_results.txt
          git commit -m "debug: image query results" || echo "nothing to commit"
          git push origin main
