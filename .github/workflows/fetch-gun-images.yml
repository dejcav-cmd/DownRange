name: Fetch Gun Images
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Fetch from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat << 'PYEOF' > fetch_images.py

import urllib.request, json, urllib.parse, os

KEY = os.environ["PEXELS_API_KEY"]

SEARCHES = {
  "glock-19": "Glock pistol handgun semi-automatic",
  "sig-p320": "SIG Sauer pistol handgun",
  "glock-43x": "compact pistol concealed carry",
  "cz-p10c": "CZ pistol handgun",
  "walther-pdp": "Walther pistol semi-automatic",
  "springfield-hellcat": "micro pistol concealed carry",
  "ar-15": "AR-15 rifle semi-automatic black",
  "ak-47": "AK-47 rifle wood stock",
  "ruger-10-22": "Ruger rimfire rifle scope",
  "daniel-defense-ddm4": "tactical rifle AR-15 scope",
  "tikka-t3x": "bolt action hunting rifle scope",
  "remington-700": "bolt action sniper rifle wood",
  "mossberg-590a1": "pump shotgun tactical",
  "benelli-m2": "semi-automatic shotgun hunting",
  "remington-870": "pump shotgun home defense",
  "benelli-supernova": "pump shotgun waterfowl",
  "silencerco-omega-36m": "gun suppressor silencer",
  "silencerco-omega-9k": "pistol suppressor compact",
  "dead-air-sandman-s": "rifle suppressor tactical black",
}

results = {}
for slug, query in SEARCHES.items():
    url = f"https://api.pexels.com/v1/search?query={urllib.parse.quote(query)}&per_page=3&orientation=landscape"
    req = urllib.request.Request(url, headers={"Authorization": KEY})
    try:
        r = json.loads(urllib.request.urlopen(req, timeout=10).read())
        photos = r.get("photos", [])
        if photos:
            results[slug] = photos[0]["src"]["large2x"]
            print(f"OK {slug}: {results[slug][:80]}")
        else:
            print(f"NONE {slug}")
    except Exception as e:
        print(f"ERR {slug}: {e}")

with open("gun_images.json", "w") as f:
    json.dump(results, f, indent=2)
print("DONE", len(results), "images found")

          PYEOF
          python3 fetch_images.py
      - name: Commit results
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add gun_images.json
          git diff --cached --quiet || git commit -m "data: gun images from pexels"
          git push
