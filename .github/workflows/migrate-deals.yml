name: Migrate Deals newsArticles → gunDeal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run migration
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python scripts/migrate-deals-to-gunDeal.py
      - name: Commit result
        run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/migrate-result.txt
          git commit -m "chore: deals migration result" || echo "nothing"
          git push
