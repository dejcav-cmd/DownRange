name: fix-external-deal-images
on:
  workflow_dispatch:
    inputs:
      dummy:
        required: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "guard"
  run:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Fix external deal images
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/fix_external_deal_images.py
