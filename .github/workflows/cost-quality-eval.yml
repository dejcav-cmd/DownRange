name: Cost & Quality Evaluation (one-shot)

on:
  schedule:
    - cron: '0 9 11 7 *'   # 9am UTC July 11 2026 — one-time run
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run evaluation
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/eval_cost_quality.py
