name: Sanity Full Backup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Sanity backup
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" \
            -X POST \
            -H "x-admin-key: $ADMIN_KEY" \
            "https://downrangeco.com/api/admin/backup")
          echo "$RESPONSE" > scripts/sanity-backup-result.txt
          cat scripts/sanity-backup-result.txt
      - name: Commit result
        run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/sanity-backup-result.txt
          git commit -m "chore: sanity backup result $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
