name: Giveaway Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Audit
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node scripts/audit_giveaways.mjs 2>&1 | tee result.txt
      - name: Publish
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/giveaway-audit.txt
