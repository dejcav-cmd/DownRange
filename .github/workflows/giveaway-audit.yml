name: Giveaway Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run the cron (retirement sweep + scrape)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "=== CRON RUN ===" > result.txt
          curl -s -X POST "https://www.downrangeco.com/api/cron/giveaways" \
            -H "x-admin-key: $ADMIN_KEY" --max-time 120 \
            | python3 -m json.tool >> result.txt 2>&1 || echo "cron call failed" >> result.txt
      - name: Audit what is left
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          echo "" >> result.txt
          node scripts/audit_giveaways.mjs >> result.txt 2>&1
      - name: Publish
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/giveaway-audit.txt
