name: Deep Deals Diagnosis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run diagnosis
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python scripts/deep-deals-diagnosis.py
      - name: Commit result
        run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/deep-deals-diagnosis.txt
          git commit -m "chore: deep deals diagnosis" || echo "nothing"
          git push
