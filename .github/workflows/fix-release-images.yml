name: Fix Release Images
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Patch bad image URLs in all releases
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node scripts/fix-release-images.js
