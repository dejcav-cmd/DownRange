name: Video Pull (Manual)

on:
  workflow_dispatch:

jobs:
  pull-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DownRange Video Feed
        run: |
          response=$(curl -s -X POST "https://downrangeco.com/api/agent?feed=video" \
            -H "Authorization: Bearer ${{ secrets.AGENT_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 280)
          echo "$response" | head -c 500
