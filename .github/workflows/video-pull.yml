name: Video Pull (Manual)
on:
  workflow_dispatch:
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Verify new env vars and trigger feeds
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=== KEY STATUS ==="
          curl -sfL "https://downrangeco.com/api/admin/cron-health" -H "x-admin-key: $K" | python3 -c "
import sys,json
d=json.load(sys.stdin)
env=d.get('env',{})
for k in ['NEWSAPI_KEY','GNEWS_KEY','LEGISCAN_KEY','YOUTUBE_API_KEY','VERCEL_TOKEN']:
    v=env.get(k,{})
    print(k,'SET' if v.get('set') else 'MISSING')
print('STATUS:',d.get('status'))
for i in d.get('issues',[]): print('ISSUE:',i.get('severity'),i.get('msg',''))
s=d.get('sanity',{})
print('ARTICLES:',s.get('counts',{}).get('articles'))
print('MINS_AGO:',s.get('minutesSinceLastArticle'))
lat=s.get('latest',{})
if lat: print('LATEST:',lat.get('title','')[:80])
"
          echo "=== TRIGGER NEWS ==="
          curl -sfL "https://downrangeco.com/api/agent?feed=news" -H "Authorization: Bearer $K" --max-time 55 | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('NEWS done:',d.get('done',0),'ai:',d.get('withAI',0),'total:',d.get('total',0),'dupes:',d.get('dupes',0))
except: print('completed')
" || echo "done"
          echo "=== TRIGGER LAWS ==="
          curl -sfL "https://downrangeco.com/api/agent?feed=laws" -H "Authorization: Bearer $K" --max-time 55 | head -c 300 || echo "done"
