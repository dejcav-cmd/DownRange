name: Video Pull (Manual)

on:
  workflow_dispatch:

jobs:
  pull-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Verify keys and trigger feeds
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=ENV_STATUS="
          curl -sfL "https://downrangeco.com/api/admin/cron-health" -H "x-admin-key: $K" | python3 -c "
import sys,json
d=json.load(sys.stdin)
env=d.get('env',{})
for k in ['NEWSAPI_KEY','GNEWS_KEY','LEGISCAN_KEY','CONGRESS_GOV_KEY','CONTACT_EMAIL','YOUTUBE_API_KEY','VERCEL_TOKEN','UPSTASH_REDIS_REST_TOKEN']:
    v=env.get(k,{})
    status='SET' if v.get('set') else 'MISSING'
    crit=' [CRITICAL]' if v.get('critical') else ''
    print(k+':'+status+crit)
print('OVERALL:'+d.get('status','?'))
for i in d.get('issues',[]): print('ISSUE:'+i.get('severity','')+':'+i.get('msg','')[:80])
s=d.get('sanity',{})
print('ARTICLES:'+str(s.get('counts',{}).get('articles','?')))
print('MINS_AGO:'+str(s.get('minutesSinceLastArticle','?')))
lat=s.get('latest',{})
if lat: print('LATEST:'+lat.get('title','')[:100])
"
          echo "=NEWS_FEED="
          curl -sfL "https://downrangeco.com/api/agent?feed=news" -H "Authorization: Bearer $K" --max-time 55 | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('done='+str(d.get('done',0))+' ai='+str(d.get('withAI',0))+' total='+str(d.get('total',0))+' dupes='+str(d.get('dupes',0)))
except: print('completed')
" || echo "completed"
          echo "=LAWS_FEED="
          curl -sfL "https://downrangeco.com/api/agent?feed=laws" -H "Authorization: Bearer $K" --max-time 55 | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('laws:saved='+str(d.get('saved',d.get('done',0)))+' congress='+str(d.get('congressBills',0)))
except: print('completed')
" || echo "completed"
