name: Video Pull (Manual)

on:
  workflow_dispatch:

jobs:
  pull-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Test social posts dry-run across all platforms
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=== SOCIAL POST DRY-RUN TEST ==="
          for platform in twitter bluesky threads facebook reddit; do
            echo ""
            echo "--- $platform ---"
            curl -sfL "https://downrangeco.com/api/social/cron/$platform" \
              -X POST \
              -H "x-admin-key: $K" \
              -H "Content-Type: application/json" \
              -d '{"count":1,"dryRun":true}' \
              --max-time 60 | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  posts=d.get('posts',[]) or d.get('results',[]) or []
  if posts:
    p=posts[0]
    content=p.get('content','')
    print('CONTENT:', repr(content))
    print('CHAR_COUNT:', len(content))
    import re
    has_full_article='Full article:' in content
    has_url='downrangeco.com' in content
    print('HAS_FULL_ARTICLE:', has_full_article)
    print('HAS_PORTAL_URL:', has_url)
    print('STATUS:', 'PASS' if has_full_article and has_url else 'FAIL')
  else:
    print('NO_POSTS:', json.dumps(d)[:300])
except Exception as e:
  raw=sys.stdin.read()
  print('ERROR:', str(e), raw[:200])
"
          done
