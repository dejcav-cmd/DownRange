name: Patch Remaining Gun Images
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and patch remaining gun images
        run: python3 scripts/patch-remaining-gun-images.py
