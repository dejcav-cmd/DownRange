name: Test Backup
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call backup endpoint and write result
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Calling /api/admin/backup ..."
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "https://www.downrangeco.com/api/admin/backup" \
            -H "x-admin-key: $ADMIN_KEY" --max-time 120)
          BODY=$(cat /tmp/body.txt)
          echo "=== HTTP $HTTP_CODE ==="
          echo "$BODY" | python3 -c "
import sys,json
try:
    d=json.load(sys.stdin)
    print('ok:', d.get('ok'))
    print('totalDocs:', d.get('totalDocs'))
    print('sizeKB:', d.get('sizeKB'))
    print('github.ok:', d.get('github',{}).get('ok'))
    print('github.url:', d.get('github',{}).get('url',''))
    print('github.reason:', d.get('github',{}).get('reason',''))
    print('errors:', d.get('errors',[]))
    print('ms:', d.get('ms'))
except Exception as e:
    print('Parse error:', e)
    print(sys.stdin.read()[:500])
" 2>&1 || echo "$BODY" | head -30
          # Write result to repo via API
          RESULT="HTTP_STATUS=$HTTP_CODE
$BODY"
          B64=$(echo -n "$BODY" | base64 -w0)
          # Check if file exists
          SHA=$(curl -s "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/backup-test-result.txt" \
            -H "Authorization: token $GH_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          PAYLOAD="{\"message\":\"diag: backup test HTTP $HTTP_CODE\",\"content\":\"$B64\"}"
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\":\"diag: backup test HTTP $HTTP_CODE\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"
          fi
          curl -s -X PUT "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/backup-test-result.txt" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print('file written:', d.get('content',{}).get('name','error'))" 2>/dev/null || echo "file write attempted"
