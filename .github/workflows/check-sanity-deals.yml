name: Check Sanity Deals
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/check-sanity-deals.py
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      - run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/sanity-deals-check.txt
          git commit -m "chore: sanity deals check" || echo "nothing"
          git push
