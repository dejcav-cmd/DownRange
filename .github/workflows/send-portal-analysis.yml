name: Send Portal Analysis Email
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        run: |
          node -e "
          const key = process.env.RESEND_KEY;
          if (!key) { console.error('No key'); process.exit(1); }
          const d64 = process.env.DOCX_B64;
          fetch('https://api.resend.com/emails', {
            method:'POST',
            headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
            body:JSON.stringify({
              from:'DownRange Intelligence <intelligence@downrangeco.com>',
              to:['dejcav@gmail.com'],
              subject:'[DownRange] Portal Audit Complete — DOCX Report Attached',
              html:'<div style=\'background:#09090B;color:#e5e7eb;font-family:Arial;padding:32px;max-width:600px;margin:auto\'><div style=\'font-family:Georgia;font-size:32px;font-weight:900;color:#C8922A;letter-spacing:.1em;\'>DOWNRANGE</div><div style=\'font-size:11px;color:#4b5563;letter-spacing:.2em;margin-bottom:24px;\'>PORTAL ANALYSIS — COMPLETE</div><p style=\'font-size:14px;color:#d1d5db;line-height:1.8;\'>Your full portal audit and competitive analysis is ready. The complete enterprise report is attached as a Word document.</p><div style=\'background:#1a1c20;border-left:4px solid #C8922A;padding:16px 20px;margin:20px 0;\'><div style=\'font-size:16px;font-weight:700;color:#C8922A;margin-bottom:8px;\'>Report covers:</div><ul style=\'font-size:12px;color:#9ca3af;line-height:2;\'><li>Full inventory: 46 pages, 38 cron jobs, 7 admin sections, 29 schemas</li><li>Competitive matrix vs TTAG, Pew Pew, TFB, GunDigest, GunsAmerica, WikiArms</li><li>12 critical gaps with effort + impact ratings and exact action steps</li><li>8 SEO opportunities — 4M+ combined monthly searches</li><li>6 monetization streams with 12-month revenue projections</li><li>90-day prioritized execution roadmap, week by week</li></ul></div><a href=\'https://downrangeco.com/admin\' style=\'background:#C8922A;color:#000;padding:12px 24px;text-decoration:none;font-weight:700;font-size:13px;display:inline-block;margin-top:8px;\'>MISSION CONTROL</a></div>',
              attachments:[{filename:'DownRange-Portal-Analysis.docx',content:d64}]
            })
          }).then(r=>r.json()).then(d=>console.log('Done:',JSON.stringify(d))).catch(e=>console.error('Fail:',e.message))
          "
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          DOCX_B64: 
