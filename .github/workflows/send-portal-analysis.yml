name: Send Portal Analysis Email
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployed email route
        run: |
          echo "Calling deployed endpoint..."
          RESPONSE=$(curl -s -X GET \
            "https://downrangeco.com/api/admin/send-portal-report" \
            -H "x-vercel-cron: 1" \
            -H "Accept: application/json" \
            --max-time 60)
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Email sent successfully!"
          else
            echo "❌ Failed. Response above."
            exit 1
          fi
