name: Diag Sources
on:
  push:
    branches: [diag/sources]
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          curl -sSL -H "X-Return-Format: html" -o a.html https://r.jina.ai/https://www.atf.gov/firearms/listing-federal-firearms-licensees
          python3 - <<'PY' >> result.txt
          import re
          h=open('a.html',encoding='utf8',errors='ignore').read()
          for m in re.finditer(r'<form[^>]*ffl-listing-export-form[^>]*>.*?</form>',h,re.S):
              f=m.group(0)
              print(re.sub(r'\s+',' ',f)[:200])
              for t in re.findall(r'<(?:input|select|button)[^>]*>',f): print(re.sub(r'\s+',' ',t)[:300])
          PY
          curl -sSL -A "DownRangeBot/1.0" -o w.txt "https://en.wikipedia.org/w/index.php?title=Gun_laws_in_the_United_States_by_state&action=raw"
          sed -n 37,100p w.txt | cut -c1-400 >> result.txt
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/diag-sources.txt
