name: Diag Sources
on:
  push:
    branches: [diag/sources]
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          for st in Illinois Texas Louisiana; do
            curl -sSL -A "DownRangeBot/1.0" -o w.txt -w "$st %{http_code} %{size_download}\n" "https://en.wikipedia.org/w/index.php?title=Gun_laws_in_$st&action=raw" >> result.txt
            grep -n -i "^==\|summary\|assault\|magazine\|red flag\|waiting\|permitless\|constitutional" w.txt | cut -c1-260 | head -40 >> result.txt
          done
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/diag-sources.txt
