name: Facebook System User Page Token Derive

on:
  workflow_dispatch:

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Derive page token from system user token
        env:
          FB_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 scripts/facebook_me_accounts_check.py > /tmp/result.json
          cat /tmp/result.json
          B64=$(base64 -w0 /tmp/result.json)
          SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/facebook-derive-result.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\":\"chore: derive page token result\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"
          else
            PAYLOAD="{\"message\":\"chore: derive page token result\",\"content\":\"$B64\"}"
          fi
          curl -s -X PUT -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/facebook-derive-result.json"
