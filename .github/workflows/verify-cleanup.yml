name: Verify Cleanup
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_verify.py
