name: Publish Wingman SBR Release v2

on:
  push:
    paths:
      - '.github/workflows/publish-wingman-release-v2.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registered. Trigger via workflow_dispatch to run."

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run publish script
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: vbnsqnkg
        run: |
          cd scripts
          set +e
          python3 publish_wingman_release.py > publish_output.log 2>&1
          echo "EXIT_CODE=$?" >> publish_output.log
          cat publish_output.log

      - name: Report result back via Contents API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd scripts
          RESULT_FILE="wingman_publish_result.json"
          if [ ! -f "$RESULT_FILE" ]; then
            python3 -c "
import json
with open('publish_output.log') as f:
    log = f.read()
json.dump({'ok': False, 'error': 'result file not produced', 'log': log}, open('$RESULT_FILE','w'), indent=2)
"
          fi
          CONTENT_B64=$(base64 -w 0 "$RESULT_FILE")
          GET_RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/$RESULT_FILE")
          echo "GET response: $GET_RESP"
          SHA=$(echo "$GET_RESP" | sed '/HTTP_CODE:/d' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          echo "Existing SHA: $SHA"
          if [ -n "$SHA" ]; then
            PAYLOAD=$(python3 -c "import json; print(json.dumps({'message':'chore: wingman publish result','content':'$CONTENT_B64','sha':'$SHA'}))")
          else
            PAYLOAD=$(python3 -c "import json; print(json.dumps({'message':'chore: wingman publish result','content':'$CONTENT_B64'}))")
          fi
          PUT_RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/$RESULT_FILE" \
            -d "$PAYLOAD")
          echo "PUT response: $PUT_RESP"
