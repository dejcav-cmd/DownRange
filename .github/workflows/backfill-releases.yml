name: Backfill Releases (60 days)
on:
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Backfill 60 days of gun releases
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/backfill-releases.js
      - name: Remove any deal/kit entries that slipped through
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node scripts/remove-psa-deals.js
