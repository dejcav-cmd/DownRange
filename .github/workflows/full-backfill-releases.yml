name: Full Releases Backfill
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: '1 = no 6-month cutoff (pull all history), 0 = standard window'
        required: false
        default: '1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Phase 1 — scrape all sources
        run: |
          echo "Triggering scrape phase (backfill=${{ github.event.inputs.backfill }})..."
          # Try bypass header first, fall back to CRON_SECRET
          RESP=$(curl -s -w "\n%{http_code}" -X GET \
            "https://downrangeco.com/api/agent?feed=releases&phase=scrape&backfill=${{ github.event.inputs.backfill }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            --max-time 120)
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP"
          echo "$BODY"
          if [ "$HTTP" = "403" ]; then
            echo "::warning::WAF blocked. Add VERCEL_BYPASS_SECRET to GitHub Actions secrets."
            echo "Get it from: Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation"
          fi

  process:
    runs-on: ubuntu-latest
    needs: scrape
    timeout-minutes: 20
    steps:
      - name: Phase 2 — process batch 1
        id: b1
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X GET \
            "https://downrangeco.com/api/cron/releases-process?backfill=${{ github.event.inputs.backfill }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            --max-time 310)
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP"; echo "$BODY"
          REM=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('remaining',0))" 2>/dev/null || echo "0")
          echo "remaining=$REM" >> $GITHUB_OUTPUT

      - name: Phase 2 — process batch 2
        if: steps.b1.outputs.remaining != '0'
        run: |
          sleep 5
          curl -s -X GET \
            "https://downrangeco.com/api/cron/releases-process?backfill=${{ github.event.inputs.backfill }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            --max-time 310

      - name: Phase 2 — process batch 3
        run: |
          sleep 5
          curl -s -X GET \
            "https://downrangeco.com/api/cron/releases-process?backfill=${{ github.event.inputs.backfill }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_SECRET }}" \
            --max-time 310
