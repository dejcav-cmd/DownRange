name: Debug Social Articles
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check article fields
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 - << 'PYEOF2'
          import urllib.request, urllib.parse, json, os
          TOKEN = os.environ["SANITY_TOKEN"]
          PROJECT = "vbnsqnkg"
          H = {"Authorization": f"Bearer {TOKEN}"}

          def q(query):
              url = f"https://{PROJECT}.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(query)}&returnQuery=false"
              return json.loads(urllib.request.urlopen(urllib.request.Request(url, headers=H)).read())["result"]

          print("=== SAMPLE ARTICLE ===")
          s = q('*[_type == "newsArticle"][0]{_id,title,status,published,"slug":slug.current,urgencyScore,publishedAt}')
          print(json.dumps(s, indent=2))
          print("\n=== COUNTS ===")
          print("total:", q('count(*[_type == "newsArticle"])'))
          print("status==published:", q('count(*[_type == "newsArticle" && status == "published"])'))
          print("published==true:", q('count(*[_type == "newsArticle" && published == true])'))
          print("has slug:", q('count(*[_type == "newsArticle" && defined(slug.current)])'))
          print("status OR published:", q('count(*[_type == "newsArticle" && (status == "published" || published == true)])'))
          print("active==true:", q('count(*[_type == "newsArticle" && active == true])'))
          print("all fields on first:", list(q('*[_type == "newsArticle"][0]').keys()) if q('*[_type == "newsArticle"][0]') else "none")
          PYEOF2
