name: Sanity Article Debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Query Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          pip install requests -q
          python3 << EOF
import requests, json, os
T = os.environ["SANITY_TOKEN"]
P = "vbnsqnkg"
H = {"Authorization": f"Bearer {T}"}

def q(query):
    r = requests.get(f"https://{P}.api.sanity.io/v2024-01-01/data/query/production", params={"query": query, "returnQuery": "false"}, headers=H)
    return r.json()["result"]

out = {
  "total": q('count(*[_type == "newsArticle"])'),
  "status_eq_published": q('count(*[_type == "newsArticle" && status == "published"])'),
  "published_eq_true": q('count(*[_type == "newsArticle" && published == true])'),
  "has_slug": q('count(*[_type == "newsArticle" && defined(slug.current)])'),
  "active_eq_true": q('count(*[_type == "newsArticle" && active == true])'),
  "sample": q('*[_type == "newsArticle"][0]{_id,title,status,published,active,"slug":slug.current,urgencyScore}'),
}
with open("debug-output.json","w") as f: json.dump(out, f, indent=2)
print(json.dumps(out, indent=2))
EOF
      - name: Push output
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add debug-output.json
          git diff --cached --quiet || git commit -m "debug: sanity article query output"
          git push
