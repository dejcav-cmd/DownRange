name: Delete Google News Releases + Fix Images
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run gnews cleanup + image fix
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          pip install requests --quiet 2>/dev/null || true
          python3 scripts/delete-gnews-releases.py 2>&1 | tee /tmp/cleanup-result.txt
          echo ""
          echo "=== Exit code: $? ==="

      - name: Print result
        if: always()
        run: cat /tmp/cleanup-result.txt || echo "No result file"
