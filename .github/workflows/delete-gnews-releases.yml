name: Delete Google News Releases + Fix Images
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run gnews cleanup + image fix
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          set -e
          python3 scripts/delete-gnews-releases.py 2>&1
          echo "Exit: $?"
