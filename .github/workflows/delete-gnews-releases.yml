name: Delete Google News Releases + Fix Images
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          if [ -z "$SANITY_TOKEN" ]; then
            echo "ERROR: SANITY_TOKEN secret is empty or not set"
            exit 1
          fi
          echo "SANITY_TOKEN length: ${#SANITY_TOKEN} chars"
          # Test Sanity connectivity
          python3 -c "
import urllib.request, urllib.parse, os, json
token = os.environ['SANITY_TOKEN']
url = 'https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=count(*[_type==\"firearmRelease\"])&returnQuery=false'
req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
try:
    with urllib.request.urlopen(req, timeout=15) as r:
        d = json.loads(r.read())
    print('Sanity OK, total releases:', d['result'])
except Exception as e:
    print('Sanity error:', e)
    import sys; sys.exit(1)
"

      - name: Run cleanup
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/delete-gnews-releases.py
