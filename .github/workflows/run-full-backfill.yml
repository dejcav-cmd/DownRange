name: Run Full Deals Image Backfill
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push trigger acknowledged. Manual dispatch required to execute."

  backfill:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Wait for deploy
        run: sleep 40
      - name: Run backfill
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python scripts/run-full-backfill.py
      - name: Commit result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git remote set-url origin https://x-access-token:$GH_PAT@github.com/dejcav-cmd/DownRange.git
          git add -f scripts/full-backfill-result.txt
          git commit -m "chore: full deals image backfill result" || echo "nothing"
          git pull --rebase && git push || true
