name: Run Full Deals Image Backfill
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for deploy
        run: sleep 40
      - name: Run backfill
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python scripts/run-full-backfill.py
      - name: Commit result
        run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/full-backfill-result.txt
          git commit -m "chore: full deals image backfill result" || echo "nothing"
          git pull --rebase && git push || true
