name: Debug Sanity
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Query Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 - << 'PYEOF2'

import urllib.request, urllib.parse, json, os, sys

T = os.environ["SANITY_TOKEN"]
P = "vbnsqnkg"
H = {"Authorization": "Bearer " + T}

def q(query):
    url = "https://" + P + ".api.sanity.io/v2024-01-01/data/query/production?query=" + urllib.parse.quote(query) + "&returnQuery=false"
    r = urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=15)
    return json.loads(r.read())["result"]

out = {}
out["total"] = q('count(*[_type == "newsArticle"])')
out["approved"] = q('count(*[_type == "newsArticle" && approved == true])')
out["after_jun1"] = q('count(*[_type == "newsArticle" && _createdAt > "2026-06-01"])')
out["latest5"] = q('*[_type == "newsArticle"] | order(_createdAt desc)[0...5]{title, _createdAt, "slug": slug.current, approved, publishedAt, externalUrl}')

# Check the specific broken article
bad = q('*[_id == "news-ed2885a86a33802b8759352ff4b98b4a"][0]{_id, title, "slug": slug.current, approved, publishedAt, externalUrl}')
out["broken_article"] = bad

# Check cron logs
out["cron_news"] = q('*[_type == "cronRun" && sourceId == "news"] | order(_updatedAt desc)[0...5]{status, details, error, _updatedAt}')

with open("debug-sanity.json", "w") as f:
    json.dump(out, f, indent=2)
print("DONE")
print("total:", out["total"])
print("approved:", out["approved"])
print("after jun1:", out["after_jun1"])
print("broken article:", json.dumps(out["broken_article"], indent=2))
print("latest cron runs:")
for r in out.get("cron_news", []):
    print(" ", r.get("_updatedAt","?")[:16], r.get("status","?"), "|", str(r.get("details") or r.get("error",""))[:80])

          PYEOF2
      - name: Commit results
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add debug-sanity.json
          git diff --cached --quiet || git commit -m "debug: sanity state"
          git push
