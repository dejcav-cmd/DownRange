name: Sanity Debug
on:
  workflow_dispatch:
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          ST: ${{ secrets.SANITY_TOKEN }}
        run: |
          pip install requests -q
          python3 -c "
import requests, json, os
T = os.environ['ST']
H = {'Authorization': 'Bearer ' + T}
base = 'https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?returnQuery=false&query='
import urllib.parse
def q(x): return requests.get(base+urllib.parse.quote(x), headers=H).json()['result']
print('TOTAL:', q('count(*[_type==%22newsArticle%22])'))
print('APPROVED:', q('count(*[_type==%22newsArticle%22&&approved==true])'))
print('SINCE_JUN:', q('count(*[_type==%22newsArticle%22&&_createdAt>%222026-06-01%22])'))
r=q('*[_type==%22cronRun%22&&sourceId==%22news%22]|order(_updatedAt desc)[0...3]{status,details,error,_updatedAt}')
for x in r: print('CRON:',x.get('_updatedAt','')[:16],x.get('status'),'|',str(x.get('details') or x.get('error',''))[:100])
b=q('*[_id==%22news-ed2885a86a33802b8759352ff4b98b4a%22][0]{title,approved,%22slug%22:slug.current}') 
print('BROKEN:',json.dumps(b))
"
