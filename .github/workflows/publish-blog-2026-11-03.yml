name: Publish Blog 2026-11-03

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch image pages only, no Sanity writes)'
        required: false
        default: 'false'
      only:
        description: 'comma-separated slugs (blank = all)'
        required: false
        default: ''
      mode:
        description: 'publish or diag'
        required: false
        default: 'publish'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install helpers
        run: npm install --no-save --legacy-peer-deps cheerio@^1.0.0 sharp@^0.33.5 @sanity/client@^6.0.0
      - name: Publish articles
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
        run: node scripts/$( [ "$MODE" = diag ] && echo diag-blog-images || echo publish-blog-2026-11-03 ).mjs > result.txt 2> err.txt || echo "script exited nonzero" >> err.txt
      - name: Read back result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cat err.txt >> result.txt
          python3 scripts/publish_result.py result.txt docs/blog-publish-2026-11-03.txt
