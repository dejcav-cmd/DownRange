name: Backfill gun.deals Images → Sanity CDN

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run backfill
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/backfill_gundeals_images.py

      - name: Commit results
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || (
            FIXED=$(grep -oP '(?<=^FIXED: )\d+' scripts/diag-result.txt | head -1 || echo '?')
            git commit -m "fix: gun.deals image backfill — ${FIXED} images patched [skip ci]"
            git pull --rebase
            git push
          ) || true
