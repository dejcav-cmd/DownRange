name: fix-asin-deal
on:
  workflow_dispatch:
    inputs:
      asin:
        description: ASIN to fix
        required: true
        default: B0D1KXJYR6
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fix ASIN deal metadata
        env:
          FIX_ASIN: ${{ github.event.inputs.asin }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/fix_asin_deal.py
