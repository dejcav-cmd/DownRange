name: GLM Test on Push
on:
  push:
    branches: [main]
    paths: ['.github/workflows/glm-test-on-push.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Test GLM via live Vercel
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "=== GLM Live Test ===" | tee scripts/diag-result.txt
          echo "" | tee -a scripts/diag-result.txt

          echo "-- Provider status --" | tee -a scripts/diag-result.txt
          curl -sf "https://downrangeco.com/api/admin/ai-status" \
            -H "x-admin-key: $ADMIN_KEY" --max-time 15 \
          | python3 -c "
import sys, json
d = json.load(sys.stdin)
avail = d.get('available', {})
chains = d.get('chains', {})
print('Providers:')
for k,v in avail.items():
    print(f'  {k}: {\"YES\" if v else \"NO\"}')
print()
print('Active chains (first provider = what gets used):')
for k,v in chains.items():
    print(f'  {k}: {v}')
" 2>/dev/null | tee -a scripts/diag-result.txt

          echo "" | tee -a scripts/diag-result.txt
          echo "-- GLM direct test --" | tee -a scripts/diag-result.txt
          curl -sf "https://downrangeco.com/api/admin/ai-test" \
            -X POST \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"provider\":\"glm\",\"prompt\":\"Reply with only the words: GLM working\",\"maxTokens\":20}" \
            --max-time 25 | tee -a scripts/diag-result.txt
          echo "" | tee -a scripts/diag-result.txt

      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "GLM test result [skip ci]" && git push
