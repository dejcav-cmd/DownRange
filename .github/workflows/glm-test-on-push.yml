name: GLM Test on Push
on:
  push:
    branches: [main]
    paths: ['.github/workflows/glm-test-on-push.yml']
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Trigger weekly-gun-releases now
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "=== Triggering weekly-gun-releases ===" | tee scripts/diag-result.txt
          curl -s -X GET "https://downrangeco.com/api/cron/weekly-gun-releases" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 290 | tee -a scripts/diag-result.txt
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "weekly-gun-releases trigger result [skip ci]" && git push
# trigger-weekly-releases
