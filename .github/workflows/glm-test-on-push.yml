name: GLM Test on Push
on:
  push:
    branches: [main]
    paths: ['.github/workflows/glm-test-on-push.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Check deals images
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/check-deals-images.py | tee scripts/diag-result.txt
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "deals image diag [skip ci]" && git push
# deals-diag
