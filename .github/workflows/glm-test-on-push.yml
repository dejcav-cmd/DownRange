name: GLM Test on Push
on:
  push:
    branches: [main]
    paths: ['.github/workflows/glm-test-on-push.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Check releases
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          python3 scripts/check-releases.py | tee scripts/diag-result.txt
          echo "" | tee -a scripts/diag-result.txt
          echo "=== Triggering releases cron now ===" | tee -a scripts/diag-result.txt
          curl -s -X POST "https://downrangeco.com/api/agent?feed=releases" \
            -H "x-admin-key: $AGENT_SECRET" \
            --max-time 120 | tee -a scripts/diag-result.txt
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "releases check result [skip ci]" && git push
# check-releases
