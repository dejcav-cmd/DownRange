name: test-jina-mfr
on:
  workflow_dispatch:
    inputs:
      dummy:
        required: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "guard"
  run:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Test Jina manufacturer sites
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/test_jina_mfr.py
