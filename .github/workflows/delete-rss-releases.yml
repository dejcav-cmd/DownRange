name: Delete RSS-Sourced Releases
on:
  workflow_dispatch:
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Delete releases from RSS/media sources
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node scripts/delete-rss-releases.js
