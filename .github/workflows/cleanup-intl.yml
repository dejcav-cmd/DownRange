name: Cleanup International Articles
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Write Virginia article
        run: python3 scripts/write-virginia-article.py
      - name: Delete international articles
        run: python3 scripts/cleanup-intl-articles.py
