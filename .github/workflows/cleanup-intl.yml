name: Cleanup International Articles
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check news feed status + write to branch
        run: python3 scripts/read-news-status.py
      - name: Delete international articles from Sanity
        run: python3 scripts/cleanup-intl-articles.py
