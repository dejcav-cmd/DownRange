name: Cleanup International Articles
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Seed YouTube influencers
        run: python3 scripts/seed-influencers.py
      - name: Delete international articles
        run: python3 scripts/cleanup-intl-articles.py
