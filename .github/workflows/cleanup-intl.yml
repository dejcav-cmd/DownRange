name: Cleanup International Articles
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run fix-placeholder-images + verify
        run: python3 scripts/read-news-status.py
      - name: Delete international articles
        run: python3 scripts/cleanup-intl-articles.py
