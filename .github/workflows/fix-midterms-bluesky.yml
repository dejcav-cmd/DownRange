name: Fix Midterms Bluesky

on:
  push:
    paths:
      - '.github/workflows/fix-midterms-bluesky.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: History of recent Bluesky posts
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        working-directory: scripts
        run: python3 diag_bluesky_history.py > publish_output.log 2>&1 || true

      - name: Report history
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESULT_FILE: bluesky_history.json
        working-directory: scripts
        run: python3 report_midterms_2a_result.py

      - name: Retry Bluesky post
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PLATFORM: bluesky
        working-directory: scripts
        run: python3 retry_midterms_social.py > publish_output.log 2>&1 || true

      - name: Report retry
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESULT_FILE: midterms_social_retry.json
        working-directory: scripts
        run: python3 report_midterms_2a_result.py
