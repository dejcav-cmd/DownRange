# Scrapes real product photos from gun.deals and writes them to Sanity.
#
# Runs here rather than on Vercel deliberately: gun.deals rate-limits, so the
# job needs to retry with backoff and pace itself across many minutes. That
# doesn't fit a serverless function's execution window, and it's free here.
name: Backfill Deal Images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, write nothing'
        type: boolean
        default: true
      limit:
        description: 'Max deals to scan'
        default: '600'
  schedule:
    - cron: '30 5,17 * * *'   # twice daily, after the deal feeds have run

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install curl_cffi --quiet
      - name: Backfill
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LIMIT: ${{ inputs.limit || '600' }}
        run: python3 scripts/backfill_deal_images.py 2>&1 | tee result.txt
      - name: Publish
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_result.py result.txt docs/deal-image-backfill.txt
