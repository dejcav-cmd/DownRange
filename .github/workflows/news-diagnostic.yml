name: news-diagnostic
on:
  push:
    paths: ['scripts/run_news_diag.py']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostic
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: python3 scripts/run_news_diag.py > scripts/news-diag-result.txt 2>&1 || true
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add scripts/news-diag-result.txt
          git diff --staged --quiet || git commit -m "diag: news diagnostic result [skip ci]"
          git push
