name: news-diagnostic
on:
  push:
    paths:
      - 'scripts/test_sanity_write.py'
  workflow_dispatch:
    inputs:
      dummy:
        description: 'trigger'
        required: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "push guard"
  run:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Run test
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/test_sanity_write.py
