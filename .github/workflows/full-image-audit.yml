name: Full Image Audit + Fix + Dedup
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Full image audit, catalog, dedup, fix all articles
        run: python3 scripts/full-image-audit.py
