name: Query Recent Articles
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query and write to repo
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_QUERY_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/query_recent.py
