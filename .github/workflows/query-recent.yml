name: Query Recent Articles
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run query
        env:
          SANITY_TOKEN: skbUvbYYIvf0Uwc43kqoHa7MX556BIABP7tNDQjW06yeBHY9ImiPeEjgMs87ZxlUafA5XRt6LXwn8d5Y9JcmDaZN13fvjxt6Tm3QgSAE8LqSvP6oU7zgF3W4dGb3jnjVIuBnZTICBsln2LHqgKjFIAybBohK6JCJWR8qHmP6CMhPVpsiPB79
        run: |
          echo "=== RUN: $(date -u) ===" > /tmp/out.txt
          python3 scripts/query_recent.py >> /tmp/out.txt 2>&1 || true
          cat /tmp/out.txt
          cp /tmp/out.txt scripts/QUERY_RESULT.txt
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/QUERY_RESULT.txt
          git commit -m "ci: article query result $(date -u +%H%M%S)" && git push || echo "push failed"
