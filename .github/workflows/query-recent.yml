name: Query Recent Articles
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Verify new keys + trigger feeds
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=== KEY STATUS ==="
          curl -sfL "https://downrangeco.com/api/admin/cron-health" -H "x-admin-key: $K" | python3 -c "
import sys,json
d=json.load(sys.stdin)
env=d.get('env',{})
for k in ['NEWSAPI_KEY','GNEWS_KEY','LEGISCAN_KEY','YOUTUBE_API_KEY','VERCEL_TOKEN']:
    v=env.get(k,{})
    print(k+': '+('SET' if v.get('set') else 'MISSING'))
print('STATUS:',d.get('status'))
[print('ISSUE:',i.get('msg','')) for i in d.get('issues',[])]
" || echo "health check failed"
          echo "=== TRIGGERING NEWS FEED ==="
          curl -sfL "https://downrangeco.com/api/agent?feed=news" -H "Authorization: Bearer $K" --max-time 30 | head -c 300 || echo "feed triggered/timed-out"
          echo "=== TRIGGERING LAWS FEED ==="
          curl -sfL "https://downrangeco.com/api/agent?feed=laws" -H "Authorization: Bearer $K" --max-time 30 | head -c 300 || echo "laws triggered"
