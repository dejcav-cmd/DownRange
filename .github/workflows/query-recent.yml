name: Query Recent Articles
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Query Sanity for recent articles
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          curl -s "https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=*%5B_type%3D%3D%22newsArticle%22%5D%7Corder(_createdAt+desc)%5B0...10%5D%7B_id%2Ctitle%2C_createdAt%2CpublishedAt%2CexternalUrl%7D" \
            -H "Authorization: Bearer $SANITY_TOKEN" \
            | python3 -c "import sys,json; [print(a.get('title','?')[:80], '|', a.get('_createdAt','?')[:19]) for a in json.load(sys.stdin).get('result',[])]"
