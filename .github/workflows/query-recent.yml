name: Query Recent Articles
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: skbUvbYYIvf0Uwc43kqoHa7MX556BIABP7tNDQjW06yeBHY9ImiPeEjgMs87ZxlUafA5XRt6LXwn8d5Y9JcmDaZN13fvjxt6Tm3QgSAE8LqSvP6oU7zgF3W4dGb3jnjVIuBnZTICBsln2LHqgKjFIAybBohK6JCJWR8qHmP6CMhPVpsiPB79
    steps:
      - name: Query Sanity directly
        run: |
          SINCE=$(date -u -d "24 hours ago" +"%Y-%m-%dT%H:%M:%SZ")
          echo "Querying since: $SINCE"
          QUERY='*[_type=="newsArticle"&&_createdAt>"'"$SINCE"'"]|order(_createdAt desc)[0...50]{title,"slug":slug.current,_createdAt,source}'
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$QUERY")
          curl -s "https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=${ENCODED}&returnQuery=false" \
            -H "Authorization: Bearer $SANITY_TOKEN" \
            | python3 -c "
import sys,json
d=json.load(sys.stdin)
results=d.get('result',[])
print(f'FOUND {len(results)} articles in last 24h')
for a in results:
    slug=a.get('slug','')
    title=(a.get('title','') or '')[:70]
    created=(a.get('_createdAt','') or '')[:19]
    source=a.get('source','')
    print(f'[{created}] {title}')
    print(f'  https://downrangeco.com/news/{slug}  ({source})')
" 2>&1 | tee -a "\$GITHUB_STEP_SUMMARY"
