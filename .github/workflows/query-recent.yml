name: Query Recent Articles
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_QUERY_TOKEN }}
        run: python3 scripts/query_recent.py | tee /tmp/result.txt; exit 0
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: query-result
          path: /tmp/result.txt
