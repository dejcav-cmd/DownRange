name: Query Recent Articles
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query Sanity
        env:
          SANITY_TOKEN: skbUvbYYIvf0Uwc43kqoHa7MX556BIABP7tNDQjW06yeBHY9ImiPeEjgMs87ZxlUafA5XRt6LXwn8d5Y9JcmDaZN13fvjxt6Tm3QgSAE8LqSvP6oU7zgF3W4dGb3jnjVIuBnZTICBsln2LHqgKjFIAybBohK6JCJWR8qHmP6CMhPVpsiPB79
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.parse, json, os
          from datetime import datetime, timedelta, timezone
          token = os.environ['SANITY_TOKEN']
          since = (datetime.now(timezone.utc) - timedelta(hours=24)).strftime('%Y-%m-%dT%H:%M:%SZ')
          query = '*[_type=="newsArticle"&&_createdAt>"' + since + '"]|order(_createdAt desc)[0...50]{title,"slug":slug.current,_createdAt,source}'
          url = 'https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=' + urllib.parse.quote(query) + '&returnQuery=false'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.loads(r.read())
          results = data.get('result', [])
          print('FOUND', len(results), 'articles in last 24h')
          for a in results:
              slug = a.get('slug','')
              title = (a.get('title') or '')[:70]
              created = (a.get('_createdAt') or '')[:19]
              source = a.get('source','')
              print('[' + created + '] ' + title)
              print('  https://downrangeco.com/news/' + slug + '  (' + source + ')')
          PYEOF
