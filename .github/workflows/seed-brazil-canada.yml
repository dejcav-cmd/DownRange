name: Seed Brazil + Canada Articles
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_KEY:   ${{ secrets.ADMIN_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Seed Brazil and Canada articles via live API
        run: python3 scripts/seed-brazil-canada.py
