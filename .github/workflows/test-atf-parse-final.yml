name: Test ATF Parse Final

on:
  push:
    paths:
      - '.github/workflows/test-atf-parse-final.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registered. Trigger via workflow_dispatch to run."

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test full parse
        working-directory: scripts
        run: python3 test_atf_parse_final.py > test_output_final.log 2>&1 || true
      - name: Show log
        working-directory: scripts
        run: cat test_output_final.log
      - name: Report result
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: scripts
        run: python3 report_test_atf_parse.py
