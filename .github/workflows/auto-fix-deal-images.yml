name: Auto-Fix Deal Images
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Fix missing images + delete Reddit docs
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/scheduled_image_fix.py
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || (git commit -m "auto-fix deal images [skip ci]" && git pull --rebase && git push) || true
