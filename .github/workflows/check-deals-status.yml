name: Check Deals Status
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python scripts/check-deals-status.py
      - name: Commit result
        run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/deals-status-result.txt
          git commit -m "chore: deals status result" || echo "nothing to commit"
          git push
