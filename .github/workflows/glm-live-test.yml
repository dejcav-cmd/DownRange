name: GLM Live Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Test GLM via live Vercel endpoints
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "=== GLM Live Test ===" | tee scripts/diag-result.txt

          echo "-- AI Status --" | tee -a scripts/diag-result.txt
          curl -sf "https://downrangeco.com/api/admin/ai-status" \
            -H "x-admin-key: $ADMIN_KEY" --max-time 15 \
          | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('Providers:')
for k,v in d.get('available',{}).items():
    print(f'  {k}: {chr(89) if v else chr(78)}')
print()
print('Chains:')
for k,v in d.get('chains',{}).items():
    print(f'  {k}: {v}')
" 2>/dev/null | tee -a scripts/diag-result.txt

          echo "" | tee -a scripts/diag-result.txt
          echo "-- GLM direct test --" | tee -a scripts/diag-result.txt
          curl -sf "https://downrangeco.com/api/admin/ai-test" \
            -X POST \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"provider\":\"glm\",\"prompt\":\"Reply with only: GLM working\",\"maxTokens\":20}" \
            --max-time 20 | tee -a scripts/diag-result.txt

      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "glm live test result [skip ci]" && git push
