name: Backup Test v2
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test backup endpoint
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          HTTP=$(curl -s -o /tmp/r.txt -w "%{http_code}" \
            https://www.downrangeco.com/api/admin/backup \
            -H "x-admin-key: $ADMIN_KEY" --max-time 120)
          echo "HTTP: $HTTP"
          python3 -c "
import json, sys
try:
  d = json.loads(open('/tmp/r.txt').read())
  print('ok:', d.get('ok'))
  print('totalDocs:', d.get('totalDocs'))
  print('sizeKB:', d.get('sizeKB'))
  print('ms:', d.get('ms'))
  g = d.get('github', {})
  print('github.ok:', g.get('ok'))
  print('github.url:', g.get('url'))
  print('github.reason:', g.get('reason'))
  print('errors:', d.get('errors'))
except Exception as e:
  print('parse error:', e)
  print(open('/tmp/r.txt').read()[:300])
"
          SHA=$(curl -s https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/diag-result.txt \
            -H "Authorization: token $GH_PAT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          B64=$(base64 -w0 /tmp/r.txt)
          PAYLOAD=$(python3 -c "import json; print(json.dumps({'message':'diag: backup test result','content':'$B64'$([ -n '$SHA' ] && echo ",'sha':'$SHA'")}))")
          curl -s -X PUT https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/diag-result.txt \
            -H "Authorization: token $GH_PAT" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print('wrote:', d.get('content',{}).get('name','ERR'))"
