name: Test ATF Stats Fix

on:
  push:
    paths:
      - '.github/workflows/test-atf-stats-fix.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registered. Trigger via workflow_dispatch to run."

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test stats fix
        working-directory: scripts
        run: python3 test_atf_stats_fix.py > test_output_stats.log 2>&1 || true
      - name: Show log
        working-directory: scripts
        run: cat test_output_stats.log
      - name: Report result
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: scripts
        run: python3 report_atf_stats_fix.py
