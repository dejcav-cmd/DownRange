name: deals-image-diag
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diagnose-deals-images.mjs'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run diagnosis
        run: node scripts/diagnose-deals-images.mjs
      - name: Commit results
        run: |
          git config user.name "DownRange CI"
          git config user.email "dj@downrangeco.com"
          git add scripts/deals-image-diagnosis.txt
          git commit -m "diag: deal image pipeline results" || echo "no changes"
          git push
