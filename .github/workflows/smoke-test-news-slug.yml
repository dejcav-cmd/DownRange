name: smoke-test-news-slug
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent slugs from Sanity
        id: slugs
        run: |
          python3 - << 'PYEOF'
import urllib.request, json, urllib.parse, os, sys

token = os.environ.get('SANITY_TOKEN', '')
query = '*[_type=="newsArticle" && approved==true && defined(slug.current)]|order(publishedAt desc)[0...8]{"s":slug.current}'
encoded = urllib.parse.quote(query)
url = f"https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query={encoded}"

try:
    req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
    with urllib.request.urlopen(req, timeout=15) as r:
        d = json.loads(r.read())
    slugs = [a['s'] for a in d.get('result', []) if a.get('s')]
    if slugs:
        print(f"Found {len(slugs)} slugs")
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"slugs={' '.join(slugs[:5])}\n")
    else:
        raise ValueError("No slugs returned")
except Exception as e:
    print(f"Sanity fetch failed: {e} — using fallback slug list")
    with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
        f.write("slugs=FALLBACK\n")
PYEOF
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      - name: Test news slug HTTP responses
        run: |
          BASE="https://www.downrangeco.com"
          SLUGS="${{ steps.slugs.outputs.slugs }}"
          
          if [ "$SLUGS" = "FALLBACK" ]; then
            echo "⚠️  Could not fetch slugs from Sanity — Vercel WAF may block the test too"
            echo "Checking site health endpoint instead..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/site-health" --max-time 15)
            echo "  /api/site-health → HTTP $STATUS"
            exit 0
          fi
          
          PASS=0
          FAIL=0
          echo "=== Testing /news/[slug] pages ==="
          for SLUG in $SLUGS; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/news/$SLUG" \
              -A "Mozilla/5.0 (compatible; DownRange-SmokeTest/1.0)" \
              --max-time 20 -L)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
              echo "  ✓ /news/$SLUG → $STATUS"
              PASS=$((PASS+1))
            elif [ "$STATUS" = "500" ]; then
              echo "  ✗ /news/$SLUG → $STATUS (STILL FAILING)"
              FAIL=$((FAIL+1))
            else
              echo "  ? /news/$SLUG → $STATUS"
              PASS=$((PASS+1))
            fi
          done
          
          echo ""
          echo "Results: $PASS ok, $FAIL failed"
          [ "$FAIL" -eq 0 ]
