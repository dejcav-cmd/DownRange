name: Trigger Image Fix Cron
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    if: github.event_name == \'workflow_dispatch\'
    steps:
      - name: Trigger image-fix cron
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering image-fix cron..."
          curl -s -X POST https://www.downrangeco.com/api/cron/image-fix \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | head -c 500
          echo ""
          echo "Triggering fetch-article-images..."
          curl -s -X POST https://www.downrangeco.com/api/admin/fetch-article-images \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d '{"limit":20,"force":false}' | head -c 500
