name: Twitter Cron Diagnostic
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Call Twitter cron + check Sanity
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          # Hit the live Twitter cron endpoint
          CRON_RESULT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "x-admin-key: $ADMIN_KEY" \
            https://downrangeco.com/api/social/cron/twitter)
          
          # Query Sanity for socialConfig
          SOCIAL_CFG=$(curl -s \
            -H "Authorization: Bearer $SANITY_TOKEN" \
            "https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=*%5B_type+%3D%3D+%22socialConfig%22%5D%5B0%5D%7Bplatforms_config_json%2CminUrgencyScore%7D")
          
          # Query recent twitter posts
          RECENT_POSTS=$(curl -s \
            -H "Authorization: Bearer $SANITY_TOKEN" \
            "https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=*%5B_type+%3D%3D+%22socialPost%22+%26%26+platform+%3D%3D+%22twitter%22%5D+%7C+order(_createdAt+desc)%5B0...5%5D%7Bstatus%2CpostedAt%2CarticleSlug%2Cerror%2C_createdAt%7D")
          
          # Write results
          echo "CRON_RESULT: $CRON_RESULT" > twitter-diag.txt
          echo "SOCIAL_CFG: $SOCIAL_CFG" >> twitter-diag.txt
          echo "RECENT_POSTS: $RECENT_POSTS" >> twitter-diag.txt
          cat twitter-diag.txt
      - name: Save results to repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          cp twitter-diag.txt scripts/twitter-diag-result.txt
          git add scripts/twitter-diag-result.txt
          git commit -m "chore: twitter diagnostic result" || echo "no changes"
          git push https://dejcav-cmd:$GH_PAT@github.com/dejcav-cmd/DownRange.git main
