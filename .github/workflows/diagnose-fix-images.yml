name: Diagnose Fix Broken Images + Delete Articles
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose, fix broken images, delete articles
        run: python3 scripts/diagnose-and-fix-images.py
