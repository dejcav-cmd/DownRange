name: Diagnose Deals Images
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push trigger acknowledged. Manual dispatch required to execute."

  diag:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run check
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/check_top_deals.py
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || (git commit -m "check top deals result" && git pull --rebase && git push) || true
