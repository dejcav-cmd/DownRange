name: Fix Deal Articles
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Run fix-deal-articles via API
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "Triggering fix-deal-articles..."
          curl -sfL https://downrangeco.com/api/admin/fix-deal-articles \
            -X POST \
            -H "x-admin-key: $K" \
            -H "Content-Type: application/json"
