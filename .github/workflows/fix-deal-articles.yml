name: Fix Deal Articles
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run fix-deal-articles via API
        run: |
          echo "Calling fix-deal-articles API..."
          curl -v --max-time 300 -X POST https://downrangeco.com/api/admin/fix-deal-articles \
            -H "x-admin-key: bc081ac920174e0ca49d7f95518a9ce5f8c8d744" \
            -H "Content-Type: application/json" \
            2>&1
          echo "Exit code: $?"
