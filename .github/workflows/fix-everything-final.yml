name: FULL FORCE - Fix All Gun + Learn Images + Add Missing Guns
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY:  ${{ secrets.PIXABAY_API_KEY }}
      SANITY_TOKEN:     ${{ secrets.SANITY_TOKEN }}
      GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download real images, add 11 missing guns, patch all pages
        run: python3 scripts/fix-everything-final.py
