name: Giveaway Backfill

on:
  push:
    branches: [giveaway-fix]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger giveaway feed and check results
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          set -e
          echo "=== TRIGGERING GIVEAWAY FEED ===" | tee scripts/giveaway-diag.txt
          curl -sL --max-time 150 "https://downrangeco.com/api/agent?feed=giveaways" \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "x-vercel-protection-bypass: $BYPASS" | tee -a scripts/giveaway-diag.txt

          echo "" | tee -a scripts/giveaway-diag.txt
          echo "=== ACTIVE GIVEAWAYS AFTER ===" | tee -a scripts/giveaway-diag.txt
          curl -s 'https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query=*[_type==%22giveaway%22+%26%26+active==true]|order(addedAt+desc){title,sponsor,category,endDate,prizeValue,entryUrl}[0..20]' \
            -H "Authorization: Bearer $SANITY_TOKEN" | python3 -c "
import sys,json
d=json.load(sys.stdin)
results=d.get('result',[])
print(f'Active giveaways: {len(results)}')
for r in results:
    print(f'  [{r.get(\"category\",\"?\")}] {r.get(\"title\",\"?\")[:55]} | \${r.get(\"prizeValue\",0)} | ends:{r.get(\"endDate\",\"?\")[:10]}')
" | tee -a scripts/giveaway-diag.txt
          cat scripts/giveaway-diag.txt

      - name: Commit result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git remote set-url origin "https://dejcav-cmd:${GH_PAT}@github.com/dejcav-cmd/DownRange.git"
          git add scripts/giveaway-diag.txt
          git diff --staged --quiet || git commit -m "chore: giveaway backfill result $(date -u +%H:%M)"
          git push origin HEAD
