name: Fix Everything (Images + Delete + Learn + Guns)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run comprehensive fix
        run: python3 scripts/fix-everything.py
