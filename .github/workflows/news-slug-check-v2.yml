name: news-slug-check-v2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent slugs from Sanity and test HTTP responses
        run: |
          python3 - << 'PYEOF'
import urllib.request, json, urllib.parse, os, subprocess, sys

token = os.environ.get('SANITY_TOKEN', '')
query = '*[_type=="newsArticle" && approved==true && defined(slug.current)]|order(publishedAt desc)[0...8]{"s":slug.current}'
encoded = urllib.parse.quote(query)
url = f"https://vbnsqnkg.api.sanity.io/v2024-01-01/data/query/production?query={encoded}"

slugs = []
try:
    req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
    with urllib.request.urlopen(req, timeout=15) as r:
        d = json.loads(r.read())
    slugs = [a['s'] for a in d.get('result', []) if a.get('s')][:5]
    print(f"Sanity returned {len(slugs)} slugs")
except Exception as e:
    print(f"Sanity fetch failed: {e}")

if not slugs:
    print("No slugs available — skipping slug tests")
    sys.exit(0)

base = "https://www.downrangeco.com"
passed = 0
failed = 0
print("\n=== Testing /news/[slug] pages ===")
for slug in slugs:
    url2 = f"{base}/news/{slug}"
    result = subprocess.run(
        ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "-A",
         "Mozilla/5.0 DownRange-SmokeTest", "--max-time", "20", "-L", url2],
        capture_output=True, text=True
    )
    status = result.stdout.strip()
    if status in ("200", "404"):
        print(f"  OK  /news/{slug} -> {status}")
        passed += 1
    elif status == "500":
        print(f"  FAIL /news/{slug} -> {status} (500 STILL OCCURRING)")
        failed += 1
    else:
        print(f"  ?   /news/{slug} -> {status}")
        passed += 1

print(f"\nResults: {passed} ok, {failed} failed")
if failed > 0:
    sys.exit(1)
PYEOF
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
