name: Verify New Keys
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check cron-health for new keys
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          curl -sfL "https://downrangeco.com/api/admin/cron-health" -H "x-admin-key: $K" | python3 -c "
import sys,json
d=json.load(sys.stdin)
env=d.get('env',{})
keys=['NEWSAPI_KEY','GNEWS_KEY','LEGISCAN_KEY','YOUTUBE_API_KEY']
print('=== New Key Status ===')
for k in keys:
    v=env.get(k,{})
    print(k,':', 'SET ✓' if v.get('set') else 'MISSING ✗')
print()
print('Overall status:', d.get('status'))
print('Issues:', len(d.get('issues',[])))
for i in d.get('issues',[]):
    print(' -', i.get('msg',''))
"
      - name: Trigger news feed
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "Triggering news feed..."
          curl -sfL "https://downrangeco.com/api/agent?feed=news" \
            -H "Authorization: Bearer $K" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('News feed result:', json.dumps(d, indent=2)[:500])
except Exception as e:
  print('Response:', sys.stdin.read()[:200] if hasattr(sys.stdin,'read') else str(e))
" 2>/dev/null || echo "Feed triggered (may have timed out - that is OK)"
      - name: Trigger legiscan/laws feed
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "Triggering laws feed..."
          curl -sfL "https://downrangeco.com/api/agent?feed=laws" \
            -H "Authorization: Bearer $K" --max-time 30 | head -c 500 || echo "Laws feed triggered"
