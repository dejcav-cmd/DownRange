name: Setup Twilio in Vercel

on:
  workflow_dispatch:
  push:
    branches: [never-runs-on-push-xz99]

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - run: echo "guard"

  add-env:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Write Twilio vars to Vercel and send test SMS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          PROJECT=$(curl -sf "https://api.vercel.com/v9/projects/downrangeco" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          PROJECT_ID=$(echo "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          TEAM_ID=$(echo "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['accountId'])")
          echo "Project=$PROJECT_ID Team=$TEAM_ID"

          upsert() {
            local K="$1" V="$2"
            echo "Setting $K..."
            # Remove existing
            curl -s "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID&limit=100" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | \
              python3 -c "
import sys,json
for e in json.load(sys.stdin).get('envs',[]):
    if e['key']=='$K': print(e['id'])
" | while read id; do
              curl -sf -X DELETE "https://api.vercel.com/v9/projects/$PROJECT_ID/env/$id?teamId=$TEAM_ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" > /dev/null && echo "  removed $id"
            done
            # Create
            RES=$(curl -sf -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$K\",\"value\":\"$V\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}")
            echo "  created: $(echo $RES | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','ERR')[:20])")"
          }

          upsert "TWILIO_ACCOUNT_SID" "$TWILIO_ACCOUNT_SID"
          upsert "TWILIO_AUTH_TOKEN"  "$TWILIO_AUTH_TOKEN"
          upsert "TWILIO_FROM_NUMBER" "$TWILIO_FROM_NUMBER"
          upsert "ALERT_PHONE_NUMBER" "$ALERT_PHONE_NUMBER"
          echo "All 4 vars written."

          # Redeploy
          LATEST=$(curl -sf "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=1&state=READY" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          DEP_ID=$(echo "$LATEST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deployments'][0]['uid'])")
          echo "Redeploying from $DEP_ID..."
          REDEPLOY=$(curl -sf -X POST "https://api.vercel.com/v13/deployments?teamId=$TEAM_ID&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"deploymentId\":\"$DEP_ID\",\"name\":\"downrangeco\",\"target\":\"production\"}")
          echo "Redeploy: $(echo $REDEPLOY | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','?')[:24])")"

          echo "Waiting 100s for deployment to complete..."
          sleep 100

          # Test SMS
          echo "Sending test SMS..."
          SMS=$(curl -s -X POST "https://downrangeco.com/api/admin/test-sms" \
            -H "Content-Type: application/json" \
            -H "x-admin-key: $ADMIN_KEY" \
            -d '{}')
          echo "SMS result: $SMS"
          echo "$SMS" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('sent'):
    print('SUCCESS: SMS sent, SID='+str(d.get('sid','?')))
else:
    print('FAILED: '+str(d.get('error',d.get('reason','unknown'))))
    exit(1)
"

      - name: Save result
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          B64=$(echo "Twilio setup completed $TS" | base64 -w0)
          SHA=$(curl -s "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/twilio-result.md" \
            -H "Authorization: Bearer $GH_PAT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          BODY="{\"message\":\"chore: twilio result\",\"content\":\"$B64\""
          [ -n "$SHA" ] && BODY="$BODY,\"sha\":\"$SHA\""
          curl -s -X PUT "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/twilio-result.md" \
            -H "Authorization: Bearer $GH_PAT" -H "Content-Type: application/json" -d "$BODY}" > /dev/null
          echo "Done."
