name: Monitor Crons
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since_minutes:
        description: 'Look back N minutes (default 65)'
        required: false
        default: '65'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push event acknowledged. Set dispatch=true to run."

  monitor:
    runs-on: ubuntu-latest
    needs: [guard]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Poll cron results
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          MONITOR_SINCE: ""
        run: |
          MINS="${{ github.event.inputs.since_minutes }}"
          SINCE=$(python3 -c "
          from datetime import datetime, timezone, timedelta
          print((datetime.now(timezone.utc) - timedelta(minutes=int('$MINS'))).isoformat())
          ")
          MONITOR_SINCE="$SINCE" python3 scripts/monitor-crons.py | tee scripts/diag-result.txt
      - name: Commit result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git remote set-url origin https://x-access-token:$GH_PAT@github.com/dejcav-cmd/DownRange.git
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || (git commit -m "cron monitor result [skip ci]" && git pull --rebase && git push) || true

