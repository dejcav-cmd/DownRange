name: Restore News
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore.py
