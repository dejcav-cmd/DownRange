name: Refresh UAT from production

# Keeps the uat branch in sync with production (main) so UAT always
# starts from the latest shipped code. Runs weekly, and can be run manually.
on:
  schedule:
    - cron: '0 2 * * 3'   # Every Wednesday at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-uat
  cancel-in-progress: false

jobs:
  refresh-uat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Refresh UAT from production (with rolling backup)
        run: |
          set -e
          git config user.name  "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git fetch origin main uat

          # If uat already matches main, nothing to do.
          if [ "$(git rev-parse origin/uat)" = "$(git rev-parse origin/main)" ]; then
            echo "UAT already matches production — no refresh needed."
            exit 0
          fi

          # Preserve the current uat state in a rolling backup branch,
          # so any unmerged work is never lost.
          git branch -f uat-backup origin/uat
          git push --force origin uat-backup
          echo "Backed up previous uat -> uat-backup"

          # Reset uat to exactly match production.
          git checkout -B uat origin/main
          git push --force origin uat
          echo "UAT refreshed to match production (main)."
