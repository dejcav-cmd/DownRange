name: Fix News Images v2 (All + Law + Big Horn)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fix all news article images
        run: python3 scripts/fix-news-images-v2.py
