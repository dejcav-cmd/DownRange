name: Check Bad Image

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Check bad image
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 scripts/check_bad_image.py > /tmp/result.txt
          cat /tmp/result.txt
          B64=$(base64 -w0 /tmp/result.txt)
          SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/bad-image-check.txt" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\":\"chore: bad image check\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"
          else
            PAYLOAD="{\"message\":\"chore: bad image check\",\"content\":\"$B64\"}"
          fi
          curl -s -X PUT -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/bad-image-check.txt"
