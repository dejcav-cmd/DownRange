name: run-fix-logo-images
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo-shaped images in Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: python3 scripts/fix_logo_images.py
      - name: Commit results via API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
import base64, json, urllib.request, os
with open('scripts/logo_fix_results.txt', 'rb') as f:
    content = base64.b64encode(f.read()).decode()
pat = os.environ['GH_PAT']
try:
    req = urllib.request.Request(
        'https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/logo_fix_results.txt',
        headers={'Authorization': 'Bearer ' + pat}
    )
    with urllib.request.urlopen(req) as r:
        sha = json.loads(r.read()).get('sha', '')
except:
    sha = ''
payload = {'message': 'debug: logo fix results', 'content': content}
if sha:
    payload['sha'] = sha
req2 = urllib.request.Request(
    'https://api.github.com/repos/dejcav-cmd/DownRange/contents/scripts/logo_fix_results.txt',
    data=json.dumps(payload).encode(), method='PUT',
    headers={'Authorization': 'Bearer ' + pat, 'Content-Type': 'application/json'}
)
with urllib.request.urlopen(req2) as r:
    result = json.loads(r.read())
print('Committed:', result.get('commit', {}).get('sha', '')[:12])
"
