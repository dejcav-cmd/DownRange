name: Fix Single Article Image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/fix-single-article.py
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      - run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/single-fix-result.txt
          git commit -m "chore: single article fix result" || echo "nothing"
          git push
