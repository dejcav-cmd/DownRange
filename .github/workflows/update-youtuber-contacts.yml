name: Update YouTuber Contacts
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update YouTuber emails in Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 - << 'PYEOF2'
          import urllib.request, urllib.parse, json, os

          TOKEN   = os.environ["SANITY_TOKEN"]
          PROJECT = "vbnsqnkg"
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          def query(q, params=None):
              url = f"https://{PROJECT}.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(q)}&returnQuery=false"
              with urllib.request.urlopen(urllib.request.Request(url, headers=H)) as r:
                  return json.loads(r.read())["result"]

          def mutate(mutations):
              url = f"https://{PROJECT}.api.sanity.io/v2024-01-01/data/mutate/production"
              data = json.dumps({"mutations": mutations}).encode()
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=H, method="POST")) as r:
                  return json.loads(r.read())

          UPDATES = [
            {
              "youtubeUrl": "https://youtube.com/@MrColionNoir",
              "altUrl": "https://www.youtube.com/@MrColionNoir",
              "email": "info@mrcolionnoir.com",
              "firstName": "Collins",
              "notes": "Real name: Collins Iyare Idehen Jr. Attorney and 2A advocate. 3.2M subs. Business email: info@mrcolionnoir.com (confirmed from official shop FAQ at shop.mrcolionnoir.com). Company: Noir Inc, LLC."
            },
            {
              "youtubeUrl": "https://youtube.com/@KentuckyBallistics",
              "altUrl": "https://www.youtube.com/@KentuckyBallistics",
              "email": "contact.kentuckyballistics@gmail.com",
              "firstName": "Scott",
              "notes": "Real name: Scott DeShields (confirmed Wikitubia — NOT Scott Duran). Former KY State Trooper. 3.1M subs. Business email confirmed from Facebook: contact.kentuckyballistics@gmail.com"
            },
            {
              "youtubeUrl": "https://youtube.com/@IraqVeteran8888",
              "altUrl": "https://www.youtube.com/@IraqVeteran8888",
              "email": "brandy@iraqveteran8888.com",
              "firstName": "Eric",
              "notes": "Real name: Eric Blandford. Iraq War veteran. 2.6M subs. GOA Georgia State Director. Company: 88 Industries LLC. Business Manager Brandy Kerrison handles all business outreach: brandy@iraqveteran8888.com (confirmed ContactOut + iraqveteran8888.com)."
            },
            {
              "youtubeUrl": "https://youtube.com/@WarriorPoetSociety",
              "altUrl": "https://www.youtube.com/@WarriorPoetSociety",
              "email": "customersupport@warriorpoetsociety.us",
              "firstName": "John",
              "notes": "Real name: John Lovell. Founder/CEO. Former Army Ranger (2nd Ranger Battalion). 2M subs. Business email confirmed from warriorpoetsociety.us: customersupport@warriorpoetsociety.us. Training: training@warriorpoetsociety.us. Direct: jlovell@warriorpoetsociety.us."
            },
          ]

          updated = 0
          not_found = 0
          for u in UPDATES:
              contacts = query(
                  f'*[_type == "outreachContact" && (youtubeUrl == "{u["youtubeUrl"]}" || youtubeUrl == "{u["altUrl"]}")][0]{{_id,name,email,youtubeUrl}}'
              )
              if not contacts:
                  # Try searching by name
                  name_search = u.get("name", "")
                  print(f"NOT FOUND by URL: {u['youtubeUrl']} - trying name search")
                  not_found += 1
                  continue
              doc_id = contacts["_id"]
              result = mutate([{
                  "patch": {
                      "id": doc_id,
                      "set": {
                          "email": u["email"],
                          "firstName": u["firstName"],
                          "notes": u["notes"],
                      }
                  }
              }])
              print(f"UPDATED {contacts['name']}: {contacts.get('email','(none)')} -> {u['email']}")
              updated += 1

          print(f"\nDone. Updated: {updated}, Not found: {not_found}")
          PYEOF2
