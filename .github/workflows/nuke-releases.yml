name: Nuke All Releases
on:
  workflow_dispatch:
jobs:
  nuke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Delete all firearmRelease docs from Sanity
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node scripts/nuke-all-releases.js
