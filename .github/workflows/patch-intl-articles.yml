name: Fix Intl Articles
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "yes" to apply, "check" to just diagnose'
        required: false
        default: 'check'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.apply }}"
          if [ "$MODE" = "check" ]; then
            python3 scripts/check-broken-article.py | tee scripts/diag-result.txt
          elif [ "$MODE" = "yes" ]; then
            python3 scripts/patch-intl-articles.py --apply | tee scripts/diag-result.txt
            python3 scripts/cleanup-intl-offtopic.py | tee -a scripts/diag-result.txt
          fi
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "intl diag result [skip ci]" && git push
