name: Fix Intl Articles
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "yes" to apply changes, "glm" to test GLM key'
        required: false
        default: 'no'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          MODE="${{ github.event.inputs.apply }}"
          if [ "$MODE" = "glm" ]; then
            echo "=== GLM Live Test ===" | tee scripts/diag-result.txt
            echo "-- AI Status --" | tee -a scripts/diag-result.txt
            curl -sf "https://downrangeco.com/api/admin/ai-status" \
              -H "x-admin-key: $ADMIN_KEY" --max-time 15 | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('Providers available:')
for k,v in d.get('available',{}).items():
    print(f'  {k}: {\"YES\" if v else \"NO\"}')
print()
print('Active chains:')
for k,v in d.get('chains',{}).items():
    print(f'  {k}: {v}')
" 2>/dev/null | tee -a scripts/diag-result.txt
            echo "" | tee -a scripts/diag-result.txt
            echo "-- GLM direct call test --" | tee -a scripts/diag-result.txt
            curl -sf "https://downrangeco.com/api/admin/ai-test" \
              -X POST \
              -H "x-admin-key: $ADMIN_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"provider\":\"glm\",\"prompt\":\"Say: GLM working\",\"maxTokens\":20}" \
              --max-time 20 | tee -a scripts/diag-result.txt
          elif [ "$MODE" = "yes" ]; then
            python3 scripts/patch-intl-articles.py --apply | tee scripts/diag-result.txt
            python3 scripts/cleanup-intl-offtopic.py | tee -a scripts/diag-result.txt
          else
            python3 scripts/patch-intl-articles.py | tee scripts/diag-result.txt
          fi
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "result [skip ci]" && git push
