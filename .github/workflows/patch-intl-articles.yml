name: Fix Intl Articles
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to "yes" to apply changes (default is dry-run)'
        required: false
        default: 'no'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run patch + cleanup
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "yes" ]; then
            echo "=== PATCH ===" | tee scripts/diag-result.txt
            python3 scripts/patch-intl-articles.py --apply | tee -a scripts/diag-result.txt
            echo "" | tee -a scripts/diag-result.txt
            echo "=== OFF-TOPIC CLEANUP ===" | tee -a scripts/diag-result.txt
            python3 scripts/cleanup-intl-offtopic.py | tee -a scripts/diag-result.txt
          else
            python3 scripts/patch-intl-articles.py | tee scripts/diag-result.txt
          fi
      - name: Commit result
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add -f scripts/diag-result.txt
          git diff --staged --quiet || git commit -m "fix intl articles result [skip ci]" && git push
