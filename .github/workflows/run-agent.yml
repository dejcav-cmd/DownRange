name: Run News Agent
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Query and run
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          ADMIN_KEY: 15c40bc0707640eb8951fcdd5e79fc44
        run: |
          pip install requests -q
          python3 << 'PYEOF2'
import requests, urllib.parse, json, os, time

T = os.environ["SANITY_TOKEN"]
P = "vbnsqnkg"
H = {"Authorization": "Bearer " + T}
BASE = "https://" + P + ".api.sanity.io/v2024-01-01/data/query/production"

def q(query):
    r = requests.get(BASE, params={"query": query, "returnQuery": "false"}, headers=H, timeout=15)
    return r.json()["result"]

print("=== BEFORE RUN ===")
total_before = q('count(*[_type == "newsArticle"])')
print("Total articles:", total_before)
latest = q('*[_type == "newsArticle"] | order(_createdAt desc)[0...3]{title, _createdAt, "slug": slug.current, approved}')
for a in latest:
    print(f"  {a['_createdAt'][:16]} approved={a.get('approved')} slug={str(a.get('slug') or 'NONE')[:25]} | {a['title'][:50]}")

crons = q('*[_type == "cronRun" && sourceId == "news"] | order(_updatedAt desc)[0...3]{status, details, error, _updatedAt}')
print("Last cron runs:")
for c in crons:
    print(f"  {c.get('_updatedAt','')[:16]} {c.get('status','').ljust(8)} | {str(c.get('details') or c.get('error',''))[:100]}")

broken = q('*[_id == "news-ed2885a86a33802b8759352ff4b98b4a"][0]{_id, title, "slug": slug.current, approved}')
print("Broken article:", json.dumps(broken))

print("\n=== TRIGGERING NEWS AGENT ===")
resp = requests.get("https://downrangeco.com/api/agent?feed=news",
    headers={"Authorization": "Bearer " + os.environ["ADMIN_KEY"], "x-vercel-cron": "1"},
    timeout=120)
print("Status:", resp.status_code)
print("Response:", resp.text[:500])

print("\n=== AFTER RUN (waiting 10s) ===")
time.sleep(10)
total_after = q('count(*[_type == "newsArticle"])')
print("Total articles after:", total_after)
print("DELTA:", total_after - total_before)
latest2 = q('*[_type == "newsArticle"] | order(_createdAt desc)[0...3]{title, _createdAt, "slug": slug.current, approved}')
for a in latest2:
    print(f"  {a['_createdAt'][:16]} approved={a.get('approved')} slug={str(a.get('slug') or 'NONE')[:25]} | {a['title'][:50]}")
PYEOF2
