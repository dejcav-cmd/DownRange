name: Run News Agent Test
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Run agent and check
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: pip install requests && python3 agent_test.py
      - name: Commit results
        run: |
          git config user.email "dj@downrangeco.com"
          git config user.name "DJ Cavalcanti"
          git add agent_test_results.json
          git diff --cached --quiet || git commit -m "debug: agent test results"
          git push
