name: Debug socialConfig
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          python3 << 'PYEOF2'

import urllib.request, urllib.parse, json, os
T = os.environ["SANITY_TOKEN"]
P = "vbnsqnkg"
H = {"Authorization": f"Bearer {T}"}

def q(query):
    url = f"https://{P}.api.sanity.io/v2024-01-01/data/query/production?query={urllib.parse.quote(query)}&returnQuery=false"
    r = urllib.request.urlopen(urllib.request.Request(url, headers=H))
    return json.loads(r.read())["result"]

doc = q('*[_type == "socialConfig"][0]')
print("DOC:", json.dumps(doc, indent=2) if doc else "NONE")
print("FIELDS:", list(doc.keys()) if doc else [])

          PYEOF2
