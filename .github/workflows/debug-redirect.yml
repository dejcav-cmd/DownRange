name: debug-redirect
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sD - -o /tmp/body.txt -X POST "https://downrangeco.com/api/admin/test-image-classify" \
            -H "Content-Type: application/json" -H "x-admin-key: $ADMIN_KEY" \
            -d '{"tests":[]}' > /tmp/headers.txt
          echo "=== HEADERS ===" > docs/debug_redirect.txt
          cat /tmp/headers.txt >> docs/debug_redirect.txt
          echo "=== BODY ===" >> docs/debug_redirect.txt
          cat /tmp/body.txt >> docs/debug_redirect.txt
      - run: python3 scripts/push_diag_result.py docs/debug_redirect.txt
