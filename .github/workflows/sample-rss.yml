name: Sample gun.deals RSS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/sample-gun-deals-rss.py
      - run: |
          git config user.name "DownRange Bot"
          git config user.email "dj@downrangeco.com"
          git add -f scripts/gun-deals-rss-sample.txt
          git commit -m "chore: gun.deals rss sample" || echo "nothing"
          git push
