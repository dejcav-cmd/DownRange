name: Check Social For Post

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_TOKEN }}
          SLUG: falcon-medusa-m1v2-650l-thermal-scope
          BLOG_ID: blog-falcon-optic-medusa-m1v2-650l-first-look
        working-directory: scripts
        run: python3 check_social_slug.py > publish_output.log 2>&1 || true
      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESULT_FILE: social_check_result.json
          COMMIT_MSG: 'chore: social check result'
        working-directory: scripts
        run: python3 report_midterms_2a_result.py
