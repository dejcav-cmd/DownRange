name: Fix All Article Images (Learn + Drafts + Test)
on:
  workflow_dispatch:
jobs:
  fix-images:
    runs-on: ubuntu-latest
    env:
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix all images - Wikimedia search, Sanity patches, Learn source files
        run: python3 scripts/fix-learn-and-draft-images.py
