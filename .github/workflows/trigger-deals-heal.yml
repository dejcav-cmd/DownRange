name: trigger-deals-heal
on:
  workflow_dispatch:
jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Trigger gun-deals heal on prod (2 passes)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          : > scripts/deals-heal-result.txt
          for i in 1 2; do
            echo "=== pass $i @ $(date -u) ===" >> scripts/deals-heal-result.txt
            curl -s -m 300 -H "Authorization: Bearer $CRON_SECRET" \
              "https://www.downrangeco.com/api/cron/gun-deals" >> scripts/deals-heal-result.txt || echo "curl failed" >> scripts/deals-heal-result.txt
            echo "" >> scripts/deals-heal-result.txt
            sleep 10
          done
          cat scripts/deals-heal-result.txt
      - name: Commit result
        run: |
          git config user.name "DownRange CI"
          git config user.email "dj@downrangeco.com"
          git add scripts/deals-heal-result.txt
          git commit -m "heal: gun-deals backfill result" || echo "no changes"
          git push
