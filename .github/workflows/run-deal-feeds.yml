name: run-deal-feeds
on:
  workflow_dispatch:
    inputs:
      feeds:
        description: 'Feeds to run: reddit | web | fix | all'
        required: false
        default: 'all'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - name: Run deal feeds
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          FEEDS="${{ github.event.inputs.feeds }}"
          run_feed() {
            local name=$1 path=$2
            echo ""
            echo "━━━ $name ━━━"
            bash scripts/run_single_feed.sh "$path"
          }
          [[ "$FEEDS" == "all" || "$FEEDS" == "reddit" ]] && run_feed "r/gundeals"   "reddit-deals"
          [[ "$FEEDS" == "all" || "$FEEDS" == "web"    ]] && run_feed "Web Deals"    "web-deals"
          [[ "$FEEDS" == "all" || "$FEEDS" == "fix"    ]] && run_feed "Fix Images"   "fix-placeholder-images"
          echo "Done."
