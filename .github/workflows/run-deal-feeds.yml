name: run-deal-feeds
on:
  workflow_dispatch:
    inputs:
      feeds:
        description: 'Feeds to run: reddit | web | fix | all (default: all)'
        required: false
        default: 'all'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - name: Run deal feeds
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_KEY:   ${{ secrets.ADMIN_KEY }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          FEEDS="${{ github.event.inputs.feeds }}"
          BASE="https://www.downrangeco.com/api/cron"

          run_feed() {
            local name=$1 url=$2
            echo ""
            echo "━━━ $name ━━━"
            RESULT=$(curl -s --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$url")
            echo "$RESULT"
          }

          if [[ "$FEEDS" == "all" || "$FEEDS" == "reddit" ]]; then
            run_feed "r/gundeals" "$BASE/reddit-deals"
          fi
          if [[ "$FEEDS" == "all" || "$FEEDS" == "web" ]]; then
            run_feed "Web Deals" "$BASE/web-deals"
          fi
          if [[ "$FEEDS" == "all" || "$FEEDS" == "fix" ]]; then
            run_feed "Fix Placeholder Images" "https://www.downrangeco.com/api/cron/fix-placeholder-images"
          fi

          echo ""
          echo "Done."
