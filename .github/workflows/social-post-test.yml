name: Social Post Dry-Run Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Test social posts dry-run across all platforms
        env:
          K: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "=== SOCIAL POST DRY-RUN TEST ==="
          FAILED=0
          for platform in twitter bluesky threads facebook reddit; do
            echo ""
            echo "--- $platform ---"
            RESPONSE=$(curl -sL "https://downrangeco.com/api/social/cron/$platform" \
              -X POST \
              -H "x-admin-key: $K" \
              -H "Content-Type: application/json" \
              -d '{"count":1,"dryRun":true}' \
              --max-time 60)
            echo "$RESPONSE" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  posts=d.get('posts',[]) or d.get('results',[]) or []
  if posts:
    p=posts[0]
    content=p.get('content','')
    print('CONTENT:', repr(content[:120]))
    print('CHAR_COUNT:', len(content))
    has_url='downrangeco.com' in content
    print('HAS_PORTAL_URL:', has_url)
    print('STATUS: PASS')
  else:
    print('NO_POSTS:', json.dumps(d)[:300])
except Exception as e:
  raw=sys.stdin.read()
  print('ERROR:', str(e), raw[:200])
"
          done
