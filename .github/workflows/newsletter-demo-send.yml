name: Newsletter Demo Send

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Recipient email for the demo send'
        required: true
        default: 'dejcav@gmail.com'
      state:
        description: 'State code to preview personalization for'
        required: false
        default: 'WA'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call newsletter send-test route
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          EMAIL="${{ github.event.inputs.email }}"
          STATE="${{ github.event.inputs.state }}"
          curl -s -D /tmp/headers.txt -o /tmp/body.json -L -X POST \
            -H "x-admin-key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -H "Cache-Control: no-cache, no-store" \
            -d "{\"email\":\"$EMAIL\",\"state\":\"$STATE\"}" \
            "https://downrangeco.com/api/newsletter/send-test"
          {
            echo "--- Response headers ---"
            cat /tmp/headers.txt
            echo "--- Body ---"
            cat /tmp/body.json
          } > docs/newsletter-demo-send-result.txt
          cat docs/newsletter-demo-send-result.txt
          B64=$(base64 -w0 docs/newsletter-demo-send-result.txt)
          SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/newsletter-demo-send-result.txt" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\":\"chore: newsletter demo send result\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"
          else
            PAYLOAD="{\"message\":\"chore: newsletter demo send result\",\"content\":\"$B64\"}"
          fi
          curl -s -X PUT -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/dejcav-cmd/DownRange/contents/docs/newsletter-demo-send-result.txt"
