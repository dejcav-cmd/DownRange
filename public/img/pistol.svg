<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#09090B"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="50%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8922A"/>
      <stop offset="100%" style="stop-color:#92610a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#C8922A" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <!-- Glow orb -->
  <circle cx="600" cy="315" r="220" fill="rgba(200,146,42,0.06)"/>
  
  <!-- Pistol silhouette - side profile, centered -->
  <g transform="translate(300, 160)" filter="url(#glow)">
    <!-- Slide (top) -->
    <rect x="60" y="80" width="420" height="95" rx="8" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Ejection port -->
    <rect x="200" y="88" width="80" height="30" rx="3" fill="#09090B" opacity="0.8"/>
    <!-- Front sight -->
    <rect x="440" y="72" width="12" height="18" rx="2" fill="#6b7280"/>
    <!-- Rear sight -->
    <rect x="90" y="72" width="20" height="16" rx="2" fill="#6b7280"/>
    <rect x="96" y="75" width="8" height="10" rx="1" fill="#09090B"/>
    <!-- Barrel extension -->
    <rect x="460" y="100" width="50" height="35" rx="4" fill="#374151" stroke="#4b5563" stroke-width="1"/>
    <!-- Frame / grip -->
    <rect x="60" y="175" width="180" height="150" rx="6" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Trigger guard -->
    <path d="M 240 175 Q 280 220 240 260 L 200 260 L 200 175 Z" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Trigger -->
    <rect x="218" y="195" width="12" height="35" rx="3" fill="#C8922A" opacity="0.8"/>
    <!-- Magazine base -->
    <rect x="75" y="320" width="155" height="18" rx="4" fill="#4b5563"/>
    <!-- Grip texture lines -->
    <g opacity="0.3" stroke="#9ca3af" stroke-width="1">
      <line x1="80" y1="195" x2="225" y2="195"/><line x1="80" y1="210" x2="225" y2="210"/>
      <line x1="80" y1="225" x2="225" y2="225"/><line x1="80" y1="240" x2="225" y2="240"/>
      <line x1="80" y1="255" x2="225" y2="255"/><line x1="80" y1="270" x2="225" y2="270"/>
      <line x1="80" y1="285" x2="225" y2="285"/><line x1="80" y1="300" x2="225" y2="300"/>
    </g>
    <!-- Slide serrations -->
    <g opacity="0.4" stroke="#6b7280" stroke-width="2">
      <line x1="370" y1="85" x2="370" y2="172"/><line x1="385" y1="85" x2="385" y2="172"/>
      <line x1="400" y1="85" x2="400" y2="172"/><line x1="415" y1="85" x2="415" y2="172"/>
      <line x1="430" y1="85" x2="430" y2="172"/>
    </g>
  </g>

  <!-- Gold accent bar -->
  <rect x="0" y="580" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Text -->
  <text x="600" y="545" font-family="'Barlow Condensed', Arial Black, sans-serif" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle" letter-spacing="6">DOWNRANGE · FIREARMS INTELLIGENCE</text>
</svg>
