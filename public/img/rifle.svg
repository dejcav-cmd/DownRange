<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#09090B"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/><stop offset="50%" style="stop-color:#1f2937"/><stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8922A"/><stop offset="100%" style="stop-color:#92610a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#C8922A" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <circle cx="600" cy="315" r="240" fill="rgba(200,146,42,0.05)"/>
  
  <!-- AR-15 silhouette -->
  <g transform="translate(80, 220)" filter="url(#glow)">
    <!-- Barrel -->
    <rect x="650" y="118" width="360" height="22" rx="5" fill="#4b5563" stroke="#6b7280" stroke-width="1"/>
    <!-- Muzzle brake -->
    <rect x="995" y="110" width="40" height="38" rx="3" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="999" y="114" width="6" height="12" rx="1" fill="#09090B"/>
    <rect x="999" y="132" width="6" height="12" rx="1" fill="#09090B"/>
    <!-- Upper receiver -->
    <rect x="350" y="100" width="300" height="75" rx="6" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Rail on top -->
    <rect x="360" y="93" width="280" height="12" rx="2" fill="#4b5563"/>
    <g stroke="#6b7280" stroke-width="1" opacity="0.5">
      <line x1="375" y1="93" x2="375" y2="105"/><line x1="395" y1="93" x2="395" y2="105"/>
      <line x1="415" y1="93" x2="415" y2="105"/><line x1="435" y1="93" x2="435" y2="105"/>
      <line x1="455" y1="93" x2="455" y2="105"/><line x1="475" y1="93" x2="475" y2="105"/>
      <line x1="495" y1="93" x2="495" y2="105"/><line x1="515" y1="93" x2="515" y2="105"/>
      <line x1="535" y1="93" x2="535" y2="105"/><line x1="555" y1="93" x2="555" y2="105"/>
      <line x1="575" y1="93" x2="575" y2="105"/><line x1="595" y1="93" x2="595" y2="105"/>
      <line x1="615" y1="93" x2="615" y2="105"/>
    </g>
    <!-- Charging handle -->
    <rect x="630" y="88" width="20" height="25" rx="3" fill="#4b5563"/>
    <!-- Ejection port -->
    <rect x="500" y="110" width="70" height="30" rx="3" fill="#09090B" opacity="0.9"/>
    <!-- Front sight -->
    <rect x="640" y="80" width="10" height="25" rx="2" fill="#9ca3af"/>
    <!-- Lower receiver -->
    <rect x="350" y="175" width="250" height="55" rx="5" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Trigger guard -->
    <path d="M 420 230 Q 440 270 460 230" fill="none" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
    <!-- Trigger -->
    <rect x="432" y="200" width="10" height="30" rx="3" fill="#C8922A" opacity="0.9"/>
    <!-- Magazine -->
    <rect x="400" y="230" width="55" height="120" rx="6" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="408" y="238" width="39" height="8" rx="2" fill="#C8922A" opacity="0.6"/>
    <!-- Grip -->
    <path d="M 500 230 L 530 230 L 545 340 L 490 340 Z" rx="6" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Buffer tube (stock) -->
    <rect x="100" y="155" width="255" height="40" rx="6" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Stock -->
    <path d="M 100 145 L 30 145 L 10 175 L 10 225 L 30 245 L 100 245 Z" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Handguard / gas tube -->
    <rect x="600" y="108" width="55" height="62" rx="4" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="655" y="120" width="3" height="38" rx="1" fill="#4b5563" opacity="0.8"/>
  </g>

  <rect x="0" y="580" width="1200" height="4" fill="url(#accent)"/>
  <text x="600" y="545" font-family="'Barlow Condensed', Arial Black, sans-serif" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle" letter-spacing="6">DOWNRANGE · FIREARMS INTELLIGENCE</text>
</svg>
