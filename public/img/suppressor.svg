<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#09090B"/></linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#4b5563"/><stop offset="50%" style="stop-color:#374151"/><stop offset="100%" style="stop-color:#1f2937"/></linearGradient>
    <linearGradient id="can" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#374151"/><stop offset="30%" style="stop-color:#4b5563"/><stop offset="70%" style="stop-color:#374151"/><stop offset="100%" style="stop-color:#1f2937"/></linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#C8922A"/><stop offset="100%" style="stop-color:#92610a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#C8922A" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/><line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <!-- Suppressor (can) + pistol barrel -->
  <g transform="translate(100, 230)" filter="url(#glow)">
    <!-- Pistol visible at right -->
    <rect x="620" y="80" width="320" height="85" rx="6" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="650" y="165" width="180" height="90" rx="5" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <path d="M 700 255 Q 730 285 760 255" fill="none" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
    <rect x="712" y="220" width="10" height="28" rx="3" fill="#C8922A" opacity="0.9"/>
    <path d="M 720 295 L 740 295 L 748 360 L 710 360 Z" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Barrel thread -->
    <rect x="615" y="100" width="15" height="45" rx="2" fill="#374151"/>
    <g stroke="#6b7280" stroke-width="1.5" opacity="0.6">
      <line x1="617" y1="102" x2="617" y2="142"/><line x1="620" y1="102" x2="620" y2="142"/><line x1="623" y1="102" x2="623" y2="142"/><line x1="626" y1="102" x2="626" y2="142"/>
    </g>
    <!-- Suppressor can - main body -->
    <rect x="200" y="88" width="415" height="69" rx="16" fill="url(#can)" stroke="#6b7280" stroke-width="2"/>
    <!-- Can segments/baffles visible -->
    <g stroke="#1f2937" stroke-width="3" opacity="0.6">
      <line x1="258" y1="90" x2="258" y2="155"/><line x1="295" y1="90" x2="295" y2="155"/>
      <line x1="332" y1="90" x2="332" y2="155"/><line x1="369" y1="90" x2="369" y2="155"/>
      <line x1="406" y1="90" x2="406" y2="155"/><line x1="443" y1="90" x2="443" y2="155"/>
      <line x1="480" y1="90" x2="480" y2="155"/><line x1="517" y1="90" x2="517" y2="155"/>
      <line x1="554" y1="90" x2="554" y2="155"/>
    </g>
    <!-- End caps -->
    <ellipse cx="200" cy="122" rx="16" ry="35" fill="#4b5563" stroke="#6b7280" stroke-width="2"/>
    <ellipse cx="615" cy="122" rx="14" ry="33" fill="#4b5563" stroke="#6b7280" stroke-width="1.5"/>
    <!-- Muzzle end cap hole -->
    <circle cx="200" cy="122" r="6" fill="#09090B"/>
    <!-- Brand marking -->
    <text x="390" y="127" font-family="Arial, sans-serif" font-size="14" fill="rgba(200,146,42,0.5)" text-anchor="middle" letter-spacing="3">NFA ITEM</text>
    <!-- Sound waves (suppressed) -->
    <g opacity="0.15" stroke="#C8922A" stroke-width="2" fill="none">
      <path d="M 155 90 Q 130 122 155 154"/><path d="M 135 75 Q 95 122 135 169"/><path d="M 115 60 Q 60 122 115 184"/>
    </g>
  </g>
  <rect x="0" y="580" width="1200" height="4" fill="url(#accent)"/>
  <text x="600" y="545" font-family="Arial Black, sans-serif" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle" letter-spacing="6">DOWNRANGE · FIREARMS INTELLIGENCE</text>
</svg>