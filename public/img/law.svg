<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#09090B"/>
    </linearGradient>
    <linearGradient id="col" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4b5563"/><stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8922A"/><stop offset="100%" style="stop-color:#92610a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#C8922A" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <circle cx="600" cy="260" r="280" fill="rgba(200,146,42,0.04)"/>

  <!-- Courthouse / scales of justice -->
  <g transform="translate(200, 60)" filter="url(#glow)">
    <!-- Pediment (roof triangle) -->
    <polygon points="400,20 750,20 730,80 420,80" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <!-- Cornice line -->
    <rect x="390" y="80" width="370" height="18" rx="2" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Columns -->
    <g fill="url(#col)" stroke="#4b5563" stroke-width="1.5">
      <rect x="415" y="98" width="32" height="280" rx="4"/>
      <rect x="490" y="98" width="32" height="280" rx="4"/>
      <rect x="565" y="98" width="32" height="280" rx="4"/>
      <rect x="640" y="98" width="32" height="280" rx="4"/>
      <rect x="715" y="98" width="32" height="280" rx="4"/>
    </g>
    <!-- Column fluting -->
    <g opacity="0.2" stroke="#9ca3af" stroke-width="1">
      <line x1="422" y1="98" x2="422" y2="378"/><line x1="429" y1="98" x2="429" y2="378"/><line x1="436" y1="98" x2="436" y2="378"/>
      <line x1="497" y1="98" x2="497" y2="378"/><line x1="504" y1="98" x2="504" y2="378"/><line x1="511" y1="98" x2="511" y2="378"/>
      <line x1="572" y1="98" x2="572" y2="378"/><line x1="579" y1="98" x2="579" y2="378"/><line x1="586" y1="98" x2="586" y2="378"/>
      <line x1="647" y1="98" x2="647" y2="378"/><line x1="654" y1="98" x2="654" y2="378"/><line x1="661" y1="98" x2="661" y2="378"/>
      <line x1="722" y1="98" x2="722" y2="378"/><line x1="729" y1="98" x2="729" y2="378"/><line x1="736" y1="98" x2="736" y2="378"/>
    </g>
    <!-- Steps -->
    <rect x="390" y="378" width="370" height="18" rx="1" fill="#2d3748" stroke="#4b5563" stroke-width="1"/>
    <rect x="375" y="396" width="400" height="18" rx="1" fill="#252d3a" stroke="#4b5563" stroke-width="1"/>
    <rect x="360" y="414" width="430" height="18" rx="1" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <!-- Door -->
    <rect x="530" y="240" width="90" height="138" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <circle cx="614" cy="305" r="5" fill="#C8922A" opacity="0.8"/>

    <!-- Scales of justice - overlaid right side -->
    <g transform="translate(820, 100)" opacity="0.9">
      <!-- Balance beam -->
      <line x1="100" y1="100" x2="100" y2="30" stroke="#C8922A" stroke-width="3"/>
      <circle cx="100" cy="25" r="8" fill="#C8922A" opacity="0.9"/>
      <line x1="20" y1="100" x2="180" y2="100" stroke="#C8922A" stroke-width="3" stroke-linecap="round"/>
      <!-- Left pan chains -->
      <line x1="30" y1="100" x2="20" y2="145" stroke="#C8922A" stroke-width="1.5" opacity="0.7"/>
      <line x1="30" y1="100" x2="50" y2="145" stroke="#C8922A" stroke-width="1.5" opacity="0.7"/>
      <!-- Left pan -->
      <path d="M 10 145 Q 30 160 50 145" stroke="#C8922A" stroke-width="2" fill="rgba(200,146,42,0.15)" stroke-linecap="round"/>
      <!-- Right pan chains -->
      <line x1="170" y1="100" x2="155" y2="145" stroke="#C8922A" stroke-width="1.5" opacity="0.7"/>
      <line x1="170" y1="100" x2="178" y2="145" stroke="#C8922A" stroke-width="1.5" opacity="0.7"/>
      <!-- Right pan (tilted - 2A wins) -->
      <path d="M 145 148 Q 165 158 182 142" stroke="#C8922A" stroke-width="2" fill="rgba(200,146,42,0.15)" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 2A text -->
  <text x="600" y="505" font-family="'Bebas Neue', 'Barlow Condensed', Arial Black, sans-serif" font-size="72" font-weight="700" fill="rgba(200,146,42,0.12)" text-anchor="middle" letter-spacing="8">2ND AMENDMENT</text>

  <rect x="0" y="580" width="1200" height="4" fill="url(#accent)"/>
  <text x="600" y="545" font-family="'Barlow Condensed', Arial Black, sans-serif" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle" letter-spacing="6">DOWNRANGE · FIREARMS INTELLIGENCE</text>
</svg>
