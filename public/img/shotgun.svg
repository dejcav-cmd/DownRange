<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#09090B"/></linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#5c3a1e"/><stop offset="50%" style="stop-color:#4a2e18"/><stop offset="100%" style="stop-color:#3d2512"/></linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#374151"/><stop offset="100%" style="stop-color:#1f2937"/></linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#C8922A"/><stop offset="100%" style="stop-color:#92610a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#C8922A" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/><line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <circle cx="600" cy="315" r="220" fill="rgba(92,58,30,0.08)"/>
  <g transform="translate(60, 220)" filter="url(#glow)">
    <!-- Barrel (two tubes) -->
    <rect x="360" y="95" width="640" height="28" rx="5" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="360" y="130" width="640" height="28" rx="5" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Muzzle end -->
    <rect x="985" y="88" width="22" height="42" rx="3" fill="#4b5563" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="985" y="123" width="22" height="42" rx="3" fill="#4b5563" stroke="#6b7280" stroke-width="1.5"/>
    <!-- Rib between barrels -->
    <rect x="370" y="126" width="610" height="6" rx="1" fill="#4b5563" opacity="0.5"/>
    <!-- Receiver -->
    <rect x="200" y="90" width="165" height="120" rx="6" fill="url(#metal)" stroke="#4b5563" stroke-width="2"/>
    <!-- Trigger guard -->
    <path d="M 250 210 Q 290 255 330 210" fill="none" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
    <!-- Trigger -->
    <rect x="262" y="185" width="10" height="30" rx="3" fill="#C8922A" opacity="0.9"/>
    <!-- Wood stock -->
    <path d="M 50 140 L 205 100 L 205 240 L 50 250 Z" fill="url(#wood)" stroke="#3d2512" stroke-width="2"/>
    <!-- Stock checkering -->
    <g opacity="0.15" stroke="#8B5E3C" stroke-width="1">
      <line x1="70" y1="145" x2="200" y2="108"/><line x1="70" y1="165" x2="200" y2="128"/><line x1="70" y1="185" x2="200" y2="148"/><line x1="70" y1="205" x2="200" y2="168"/><line x1="70" y1="225" x2="200" y2="188"/>
    </g>
    <!-- Fore end (pump) -->
    <rect x="420" y="88" width="110" height="80" rx="5" fill="url(#wood)" stroke="#3d2512" stroke-width="1.5"/>
    <!-- Pump grooves -->
    <g opacity="0.3" stroke="#3d2512" stroke-width="2">
      <line x1="435" y1="90" x2="435" y2="166"/><line x1="450" y1="90" x2="450" y2="166"/><line x1="465" y1="90" x2="465" y2="166"/><line x1="480" y1="90" x2="480" y2="166"/><line x1="495" y1="90" x2="495" y2="166"/>
    </g>
    <!-- Magazine tube -->
    <rect x="360" y="165" width="540" height="20" rx="5" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  </g>
  <rect x="0" y="580" width="1200" height="4" fill="url(#accent)"/>
  <text x="600" y="545" font-family="Arial Black, sans-serif" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle" letter-spacing="6">DOWNRANGE · FIREARMS INTELLIGENCE</text>
</svg>