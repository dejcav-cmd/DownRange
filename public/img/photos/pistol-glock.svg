<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#1a1a1a"/>
<!-- slide -->
<rect x="180" y="160" width="380" height="90" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
<rect x="180" y="160" width="380" height="20" rx="4" fill="#333"/>
<!-- slide serrations -->
<g stroke="#555" stroke-width="1.5">
<line x1="490" y1="165" x2="490" y2="245"/><line x1="502" y1="165" x2="502" y2="245"/>
<line x1="514" y1="165" x2="514" y2="245"/><line x1="526" y1="165" x2="526" y2="245"/>
<line x1="538" y1="165" x2="538" y2="245"/>
</g>
<!-- barrel -->
