<rect x="210" y="265" width="4" height="4" rx="1" fill="#555"/><rect x="222" y="265" width="4" height="4" rx="1" fill="#555"/><rect x="234" y="265" width="4" height="4" rx="1" fill="#555"/><rect x="246" y="265" width="4" height="4" rx="1" fill="#555"/>
<rect x="216" y="277" width="4" height="4" rx="1" fill="#555"/><rect x="228" y="277" width="4" height="4" rx="1" fill="#555"/><rect x="240" y="277" width="4" height="4" rx="1" fill="#555"/>
<rect x="210" y="289" width="4" height="4" rx="1" fill="#555"/><rect x="222" y="289" width="4" height="4" rx="1" fill="#555"/><rect x="234" y="289" width="4" height="4" rx="1" fill="#555"/><rect x="246" y="289" width="4" height="4" rx="1" fill="#555"/>
<rect x="216" y="301" width="4" height="4" rx="1" fill="#555"/><rect x="228" y="301" width="4" height="4" rx="1" fill="#555"/><rect x="240" y="301" width="4" height="4" rx="1" fill="#555"/>
<rect x="210" y="313" width="4" height="4" rx="1" fill="#555"/><rect x="222" y="313" width="4" height="4" rx="1" fill="#555"/><rect x="234" y="313" width="4" height="4" rx="1" fill="#555"/><rect x="246" y="313" width="4" height="4" rx="1" fill="#555"/>
</g>
<!-- trigger guard -->
<path d="M330 250 Q310 280 310 300 L370 300 Q380 280 380 250 Z" fill="#252525" stroke="#3a3a3a" stroke-width="1"/>
<!-- trigger -->
<rect x="340" y="265" width="12" height="28" rx="3" fill="#444"/>
<!-- magazine base -->
<rect x="220" y="388" width="120" height="18" rx="4" fill="#222" stroke="#444" stroke-width="1"/>
<!-- front sight -->
<rect x="186" y="150" width="8" height="14" rx="1" fill="#555"/>
<!-- rear sight -->
<rect x="540" y="150" width="22" height="12" rx="1" fill="#555"/>
<rect x="545" y="152" width="5" height="8" rx="1" fill="#222"/>
<rect x="554" y="152" width="5" height="8" rx="1" fill="#222"/>
<!-- gold label -->
<text x="400" y="465" text-anchor="middle" fill="#C8922A" font-family="Barlow Condensed, sans-serif" font-size="18" font-weight="700" letter-spacing="3">GLOCK 17 · 9MM</text>
</svg>
