<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DR Admin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DR Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090B;--bg2:#111318;--bg3:#1a1d24;--bg4:#21252f;
  --border:#1e293b;--border2:#2d3748;
  --text:#F0EDE6;--dim:#6b7280;--dim2:#4b5563;
  --gold:#C8922A;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;--blue:#3b82f6;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --topbar-h:52px;--nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;overscroll-behavior:none;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
img{display:block;}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:calc(var(--topbar-h) + var(--safe-t));padding-top:var(--safe-t);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r));gap:10px;}
#topbar-logo{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--gold);letter-spacing:.1em;flex-shrink:0;}
#topbar-title{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-status{font-size:10px;color:var(--ok);flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
#topbar-menu-btn{background:none;border:1px solid var(--border);color:var(--dim);width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
#topbar-menu-btn:active{border-color:var(--gold);color:var(--gold);}

/* FLASH */
#flash{position:fixed;top:calc(var(--topbar-h) + var(--safe-t));left:0;right:0;z-index:199;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;display:none;align-items:center;gap:8px;}
#flash.show{display:flex;}
#flash.ok{background:rgba(34,197,94,.12);border-bottom:1px solid rgba(34,197,94,.3);color:#4ade80;}
#flash.err{background:rgba(239,68,68,.14);border-bottom:1px solid rgba(239,68,68,.3);color:#f87171;}
#flash.info{background:rgba(200,146,42,.1);border-bottom:1px solid rgba(200,146,42,.3);color:var(--gold);}
#flash-close{margin-left:auto;background:none;border:none;color:inherit;font-size:16px;}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg2);border-top:1px solid var(--border);display:flex;}
.nav-tab{flex:1;background:none;border:none;border-top:2px solid transparent;color:var(--dim2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;}
.nav-tab.active{color:var(--gold);border-top-color:var(--gold);}
.nav-tab-icon{font-size:18px;line-height:1;}
.nav-tab-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}

/* APP SHELL */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:calc(var(--topbar-h) + var(--safe-t));padding-bottom:calc(var(--nav-h) + var(--safe-b));}
#content{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px;display:none;-webkit-overflow-scrolling:touch;}
.screen.active{display:block;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* DRAWER */
#drawer{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);background:var(--bg);pointer-events:none;}
#drawer.open{transform:translateX(0);pointer-events:all;}
#drawer-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + var(--safe-t));background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
#drawer-back{background:none;border:none;color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 8px;margin-left:-8px;}
#drawer-title{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--text);letter-spacing:.08em;flex:1;}
#drawer-content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--safe-b));}

/* MODAL (confirm dialogs) */
#modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:24px;}
#modal-overlay.open{display:flex;}
#modal-box{background:var(--bg2);border:1px solid var(--border2);width:100%;max-width:360px;padding:24px;}
#modal-title{font-family:'Bebas Neue',cursive;font-size:1.4rem;color:var(--text);margin-bottom:8px;}
#modal-body{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);margin-bottom:20px;line-height:1.6;}
#modal-actions{display:flex;gap:8px;}

/* SECTION SHEET */
#section-sheet{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;}
#section-sheet.open{display:flex;}
#sheet-inner{width:100%;background:var(--bg2);border-top:1px solid var(--border);border-radius:16px 16px 0 0;max-height:80vh;overflow-y:auto;padding-bottom:calc(16px + var(--safe-b));animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
#sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 8px;}
.sheet-hdr{padding:10px 20px 6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);letter-spacing:.12em;text-transform:uppercase;}
.sheet-btn{width:100%;background:none;border:none;border-bottom:1px solid rgba(30,41,59,.5);color:var(--text);text-align:left;display:flex;align-items:center;gap:12px;padding:13px 20px;}
.sheet-btn:active{background:rgba(200,146,42,.08);}
.sheet-btn .pi{font-size:18px;flex-shrink:0;}
.sheet-btn .pl{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;}
.sheet-btn .pb{background:var(--err);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;padding:2px 5px;}

/* LOCK */
#lock-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;}
#lock-logo{font-family:'Bebas Neue',cursive;font-size:3rem;color:var(--gold);letter-spacing:.1em;}
#lock-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);text-align:center;}
#lock-input{width:100%;max-width:300px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:14px 16px;font-size:14px;outline:none;text-align:center;-webkit-appearance:none;}
#lock-input:focus{border-color:var(--gold);}
#lock-btn{width:100%;max-width:300px;background:var(--gold);color:#000;border:none;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
#lock-err{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--err);display:none;text-align:center;}

/* COMPONENTS */
.section-title{font-family:'Bebas Neue',cursive;font-size:1.6rem;color:var(--text);letter-spacing:.04em;margin-bottom:4px;}
.section-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim2);margin-bottom:16px;line-height:1.6;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.stat-box{background:var(--bg2);border:1px solid var(--border);padding:14px;}
.stat-val{font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--gold);line-height:1;}
.stat-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);margin-top:2px;letter-spacing:.08em;text-transform:uppercase;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;display:inline-block;}
.pill-ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3);}
.pill-err{background:rgba(239,68,68,.12);color:var(--err);border:1px solid rgba(239,68,68,.3);}
.pill-warn{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.3);}
.pill-gold{background:rgba(200,146,42,.12);color:var(--gold);border:1px solid rgba(200,146,42,.3);}
.pill-dim{background:rgba(107,114,128,.1);color:var(--dim);border:1px solid var(--border);}
.btn{background:var(--gold);color:#000;border:none;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;transition:opacity .15s;flex-shrink:0;-webkit-appearance:none;}
.btn:active{opacity:.8;}.btn:disabled{opacity:.35;}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-xs{padding:4px 9px;font-size:10px;}
.btn-outline{background:none;border:1px solid var(--border);color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:7px 12px;-webkit-appearance:none;}
.btn-outline:active{border-color:var(--gold);color:var(--gold);}
.btn-danger{background:none;border:1px solid rgba(239,68,68,.4);color:var(--err);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:7px 12px;-webkit-appearance:none;}
.btn-danger:active{background:rgba(239,68,68,.1);}
.btn-blue{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);color:var(--blue);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:7px 12px;-webkit-appearance:none;}
.btn-blue:active{background:rgba(59,130,246,.25);}
.inp{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 12px;outline:none;-webkit-appearance:none;}
.inp:focus{border-color:var(--gold);}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px;}
.form-row{margin-bottom:12px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.empty{text-align:center;padding:40px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2);}
.loading{text-align:center;padding:40px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2);}
.spinner{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);}
.tag{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 6px;background:rgba(200,146,42,.1);color:var(--gold);}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-bottom:none;}
.row:last-child,.row-last{border-bottom:1px solid var(--border);}
.row-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;flex:1;}
.row-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-top:2px;}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px 14px;white-space:nowrap;letter-spacing:.05em;flex-shrink:0;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.qa-btn{background:var(--bg2);border:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;}
.qa-btn:active{border-color:var(--gold);background:rgba(200,146,42,.05);}
.qa-icon{font-size:20px;}.qa-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--text);line-height:1.2;}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}

/* ARTICLE CARD WITH THUMBNAIL */
.art-card{background:var(--bg2);border:1px solid var(--border);margin-bottom:8px;overflow:hidden;}
.art-card-top{display:flex;gap:0;align-items:stretch;}
.art-thumb{width:88px;height:72px;object-fit:cover;flex-shrink:0;background:var(--bg3);}
.art-thumb-ph{width:88px;height:72px;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--dim2);}
.art-info{flex:1;padding:10px 12px;min-width:0;}
.art-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.art-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.art-actions{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border);flex-wrap:wrap;background:rgba(0,0,0,.2);}

/* IMAGE SEARCH GRID */
/* IMAGE FINDER MODAL */
.imgmodal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.97);display:flex;flex-direction:column;animation:imgin .15s ease;}
@keyframes imgin{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.imgmodal-header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #222;flex-shrink:0;}
.imgmodal-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:var(--gold);letter-spacing:.08em;flex-shrink:0;}
.imgmodal-inp{flex:1;background:#111;border:1px solid #333;color:#e5e7eb;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 12px;outline:none;}
.imgmodal-inp:focus{border-color:var(--gold);}
.imgmodal-go{background:var(--gold);color:#000;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;padding:0 18px;height:40px;cursor:pointer;flex-shrink:0;}
.imgmodal-go:disabled{opacity:.4;}
.imgmodal-close{background:none;border:1px solid #333;color:#9ca3af;font-size:18px;width:40px;height:40px;cursor:pointer;flex-shrink:0;}
.imgmodal-meta{padding:6px 14px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4b5563;border-bottom:1px solid #111;flex-shrink:0;min-height:28px;display:flex;align-items:center;}
.imgmodal-body{flex:1;overflow-y:auto;padding:14px;}
.imgmodal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.imgmodal-card{position:relative;aspect-ratio:3/2;overflow:hidden;cursor:pointer;border:2px solid #222;}
.imgmodal-card:active{border-color:var(--gold);}
.imgmodal-card img{width:100%;height:100%;object-fit:cover;}
.imgmodal-card-src{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));font-family:'IBM Plex Mono',monospace;font-size:8px;color:#ccc;padding:14px 6px 5px;text-align:center;}
.imgmodal-applying{position:absolute;inset:0;background:rgba(200,146,42,.4);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#fff;}

/* CRON CARD */
.cron-card{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:8px;}

/* OUTREACH CARD */
.oc{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:8px;}
.oc-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;margin-bottom:2px;}
.oc-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;}

/* LOG ENTRY */
.log-entry{padding:10px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px;}
.log-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.log-detail{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);}
.log-err{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--err);margin-top:3px;}
</style>
</head>
<body>

<div id="lock-screen">
  <div id="lock-logo">◈ DR Admin</div>
  <div id="lock-sub">DownRange Command Center<br>Enter your admin key to continue</div>
  <input type="password" id="lock-input" placeholder="Admin key..." autocomplete="current-password">
  <div id="lock-err"></div>
  <button id="lock-btn" onclick="tryAuth()">Unlock Portal</button>
</div>

<div id="flash"><span id="flash-text"></span><button id="flash-close" onclick="hideFlash()">✕</button></div>

<div id="topbar">
  <div id="topbar-logo">◈ DR</div>
  <div id="topbar-title">COMMAND CENTER</div>
  <div id="topbar-status">●</div>
  <button id="topbar-menu-btn" onclick="openSheet()">☰</button>
</div>

<div id="app">
  <div id="content">
    <div id="screen-dashboard" class="screen active"></div>
    <div id="screen-content"   class="screen"></div>
    <div id="screen-outreach"  class="screen"></div>
    <div id="screen-intel"     class="screen"></div>
    <div id="screen-system"    class="screen"></div>
    <div id="screen-media"     class="screen"></div>
    <div id="screen-settings"  class="screen"></div>
  </div>
</div>

<div id="bottom-nav">
  <button class="nav-tab active" data-s="dashboard" onclick="navTo('dashboard',this)"><span class="nav-tab-icon">◈</span><span class="nav-tab-label">Home</span></button>
  <button class="nav-tab" data-s="content"   onclick="navTo('content',this)"><span class="nav-tab-icon">📰</span><span class="nav-tab-label">Content</span></button>
  <button class="nav-tab" data-s="outreach"  onclick="navTo('outreach',this)"><span class="nav-tab-icon">📬</span><span class="nav-tab-label">Outreach</span></button>
  <button class="nav-tab" data-s="intel"     onclick="navTo('intel',this)"><span class="nav-tab-icon">🧠</span><span class="nav-tab-label">Intel</span></button>
  <button class="nav-tab" data-s="system"    onclick="navTo('system',this)"><span class="nav-tab-icon">⚙️</span><span class="nav-tab-label">System</span></button>
</div>

<div id="drawer">
  <div id="drawer-bar">
    <button id="drawer-back" onclick="closeDrawer()">← Back</button>
    <div id="drawer-title">Panel</div>
    <div id="drawer-action-slot"></div>
  </div>
  <div id="drawer-content"></div>
</div>

<div id="section-sheet" onclick="if(event.target===this)closeSheet()">
  <div id="sheet-inner"><div id="sheet-handle"></div><div id="sheet-list"></div></div>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-box">
    <div id="modal-title">Confirm</div>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<script>
// ─── GLOBALS ─────────────────────────────────────────────────────────────────
let adminKey = '';
let screenInited = {};
let flashTimer;

// ─── AUTH ─────────────────────────────────────────────────────────────────────
async function tryAuth() {
  const val = document.getElementById('lock-input').value.trim();
  if (!val) return;
  const btn = document.getElementById('lock-btn');
  const err = document.getElementById('lock-err');
  btn.disabled=true; btn.textContent='Verifying...'; err.style.display='none';
  try {
    const r = await fetch('/api/admin/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:val})});
    const d = await r.json();
    if (!d.ok) { err.textContent=d.error||'Invalid key'; err.style.display='block'; btn.disabled=false; btn.textContent='Unlock Portal'; return; }
    adminKey=val; localStorage.setItem('dr_admin_key',val);
    document.getElementById('lock-screen').style.display='none';
    initApp();
  } catch(e) { err.textContent='Network error: '+e.message; err.style.display='block'; btn.disabled=false; btn.textContent='Unlock Portal'; }
}
document.getElementById('lock-input').addEventListener('keydown',e=>{if(e.key==='Enter')tryAuth();});
window.addEventListener('load',async()=>{
  const k=localStorage.getItem('dr_admin_key'); if(!k) return;
  try {
    const r=await fetch('/api/admin/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:k})});
    const d=await r.json();
    if(d.ok){adminKey=k;document.getElementById('lock-screen').style.display='none';initApp();}
    else localStorage.removeItem('dr_admin_key');
  } catch { adminKey=k;document.getElementById('lock-screen').style.display='none';initApp(); }
});

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(path,opts={}){
  const h={'x-admin-key':adminKey,...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})};
  const r=await fetch(path,{...opts,headers:h});
  return r.json();
}

// ─── FLASH ────────────────────────────────────────────────────────────────────
function flash(msg,type='info'){
  const el=document.getElementById('flash');
  el.className='show '+type;
  document.getElementById('flash-text').textContent=msg;
  clearTimeout(flashTimer);
  if(!msg.startsWith('⏳'))flashTimer=setTimeout(hideFlash,5000);
}
function hideFlash(){const el=document.getElementById('flash');el.className='';setTimeout(()=>{},200);}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function showModal(title,body,actions){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-actions').innerHTML=actions;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function navTo(s,btn){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const T={dashboard:'Command Center',content:'Content Hub',outreach:'Outreach CRM',intel:'Intelligence',system:'System'};
  document.getElementById('topbar-title').textContent=(T[s]||s).toUpperCase();
  if(!screenInited[s]){screenInited[s]=true;renderScreen(s);}
}

// ─── DRAWER ───────────────────────────────────────────────────────────────────
function openDrawer(title,renderFn,actionHtml=''){
  document.getElementById('drawer-title').textContent=title;
  document.getElementById('drawer-action-slot').innerHTML=actionHtml;
  document.getElementById('drawer-content').innerHTML='<div class="loading"><span class="spinner">◈</span> Loading...</div>';
  document.getElementById('drawer').classList.add('open');
  requestAnimationFrame(()=>renderFn(document.getElementById('drawer-content')));
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');}

function openPanel(id,label){
  const map={
    news:renderNews,blog:renderBlog,releases:renderReleases,reviews:renderReviews,
    breaking:renderBreaking,newsletter:renderNewsletter,social:renderSocialLog,
    drafts:renderDraftRecovery,hub:renderContentHub,canada:renderCanada,
    brazil:renderBrazil,competitions:renderCompetitions,deals:renderDeals,
    schedule:renderSchedule,crons:renderCrons,overview:renderSysOverview,
    deployments:renderDeployments,agents:renderAgents,rss:renderRSSources,
    contacts:renderContacts,queue:renderQueue,history:renderHistory,
    videos:renderVideos,channels:renderChannels,
    aikeys:renderAPIKeys,envcheck:renderEnvCheck,emailtest:renderEmailTest,
    costs:renderCostCenter,siteconfig:renderSiteSettings,alertconfig:renderAlertConfig,
    report:renderPortalReport,backup:renderBackup,lockall:renderLockAll,
    marketbrief:renderMarketBrief,
    copyright:renderCopyright,statelaws:renderStateLaws,sysalerts:renderSysAlerts,
    pulllog:renderPullLog,imgsearch:renderImageSearch,briefings:renderBriefings,
  };
  if(id==='signout'){confirmSignOut();return;}
  if(map[id]) openDrawer(label,map[id]);
  else openDrawer(label,el=>{el.innerHTML=`<div class="empty">🔧 ${label}<br><br><a href="https://downrangeco.com/admin" target="_blank" style="color:var(--gold);font-size:11px">Open Admin →</a></div>`;});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function initApp(){
  screenInited={};
  renderScreen('dashboard'); screenInited.dashboard=true;
  api('/api/admin/cron-health').then(d=>{
    const s=document.getElementById('topbar-status');
    const ok=d.status==='HEALTHY'||d.status==='HEALTHY'||d.status==='ok';
    if(s){s.style.color=ok?'var(--ok)':d.status==='BROKEN'?'var(--err)':'var(--warn)';s.textContent='●';}
  }).catch(()=>{});
}
function renderScreen(s){
  const el=document.getElementById('screen-'+s); if(!el)return;
  const m={dashboard:renderDashboard,content:renderContent,outreach:renderOutreachScreen,intel:renderIntelScreen,system:renderSystemScreen,settings:renderSettingsHub,media:renderMediaScreen};
  m[s]?.(el);
}

async function loadOutreachTab(t){

  try{
    if(t==='contacts'){

      el.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:10px">${d.count||list.length} contacts</div>`+
        list.map(c=>`<div class="oc">

// ─── ARTICLE CARD BUILDER (used by news/blog/releases) ───────────────────────
function artCard(a, type){
  const isLive = type==='blog' ? a.status==='published' : !!(a.publishedAt && a.slug?.current);
  const slug = a.slug?.current||a.slug||'';
  const imgSrc = a.imageUrl || a.heroImage?.asset?.url || null;
  const viewUrl = type==='blog' ? `https://downrangeco.com/blog/${slug}` :
                  type==='release' ? `https://downrangeco.com/releases/${slug}` :
                  `https://downrangeco.com/news/${slug}`;
  const approveAction = type==='blog'
    ? `artAction('${a._id}','blog','publish',this)`
    : type==='release'
    ? `artAction('${a._id}','release','approve',this)`
    : `artAction('${a._id}','news','approve',this)`;

  return `<div class="art-card" id="card-${a._id}">
    <div class="art-card-top">
      ${imgSrc
        ? `<img class="art-thumb" src="${imgSrc}" alt="" onerror="this.parentNode.innerHTML='<div class=art-thumb-ph>📷</div>'">`
        : `<div class="art-thumb-ph">📷</div>`}
      <div class="art-info">
        <div class="art-title">${a.title||'Untitled'}</div>
        <div class="art-meta">
          <span class="pill ${isLive?'pill-ok':'pill-warn'}">${isLive?'live':'draft'}</span>
          ${a.source?`<span>${a.source}</span>`:''}
          ${a.category?`<span class="tag">${a.category}</span>`:''}
          ${a.publishedAt?`<span>${new Date(a.publishedAt).toLocaleDateString()}</span>`:''}
        </div>
      </div>
    </div>
    <div class="art-actions">
      ${!isLive?`<button class="btn btn-xs" onclick="${approveAction}" data-id="${a._id}">✓ Publish</button>`:''}
      <button class="btn-blue btn-xs" onclick="rewriteArticle('${a._id}','${encodeURIComponent(a.title||'')}',this)">✏ Rewrite</button>
      <button class="btn-outline btn-xs" onclick="fixImage('${a._id}','${encodeURIComponent(a.title||'')}','${a.category||''}',this)">📷 Fix Img</button>
      <button class="btn-outline btn-xs" onclick="openImgSearch('${a._id}','${encodeURIComponent(a.title||'')}')">🔍 Search Img</button>
      ${slug?`<a href="${viewUrl}" target="_blank" class="btn-outline btn-xs">↗ View</a>`:''}
      <button class="btn-danger btn-xs" onclick="deleteArticle('${a._id}','${encodeURIComponent(a.title||'')}')">🗑</button>
    </div>
  </div>`;
}

// ─── ARTICLE ACTIONS ──────────────────────────────────────────────────────────

// Approve/Publish
async function artAction(id, type, action, btn){
  if(btn){btn.disabled=true;btn.textContent='⏳';}
  try{
    let endpoint, body;
    if(type==='blog'){
      endpoint='/api/admin/blog-posts';
      body={action:'patch',id,fields:{status:'published',publishedAt:new Date().toISOString()}};
    } else if(type==='release'){
      endpoint='/api/admin/releases-manager';
      body={action:'patch',id,fields:{approved:true,publishedAt:new Date().toISOString()}};
    } else {
      endpoint='/api/admin/articles-list';
      body={action:'patch',id,fields:{approved:true,publishedAt:new Date().toISOString()}};
    }
    const d=await api(endpoint,{method:'POST',body:JSON.stringify(body)});
    if(d.ok){
      flash('✅ Published','ok');
      // update pill inline
      const card=document.getElementById('card-'+id);
      if(card){
        const pill=card.querySelector('.pill');
        if(pill){pill.className='pill pill-ok';pill.textContent='live';}
        const pubBtn=card.querySelector('[data-id="'+id+'"]');
        if(pubBtn)pubBtn.remove();
      }
    } else { flash('❌ '+(d.error||'Failed'),'err'); }
  }catch(e){ flash('Error: '+e.message,'err'); }
  if(btn){btn.disabled=false;btn.textContent='✓ Publish';}
}

// AI Rewrite
async function rewriteArticle(id, encodedTitle, btn){
  const title=decodeURIComponent(encodedTitle);
  if(btn){btn.disabled=true;btn.textContent='⏳ Rewriting...';}
  flash('⏳ Rewriting with AI...','info');
  try{
    const d=await api('/api/admin/quality-rewrite-single',{method:'POST',body:JSON.stringify({id,type:'newsArticle'})});
    if(d.ok){flash('✅ Rewrite done — '+title.slice(0,30)+'…','ok');}
    else{flash('❌ '+(d.error||'Failed'),'err');}
  }catch(e){flash('Error: '+e.message,'err');}
  if(btn){btn.disabled=false;btn.textContent='✏ Rewrite';}
}

// Auto Fix Image (fetch OG from source URL)
async function fixImage(id, encodedTitle, category, btn){
  if(btn){btn.disabled=true;btn.textContent='⏳';}
  try{
    const d=await api('/api/admin/articles-list',{method:'POST',body:JSON.stringify({action:'fix-image',id,title:decodeURIComponent(encodedTitle),category})});
    if(d.ok&&d.imageUrl){
      flash('✅ Image updated','ok');
      const card=document.getElementById('card-'+id);
      if(card){
        const img=card.querySelector('.art-thumb,.art-thumb-ph');
        if(img){img.outerHTML=`<img class="art-thumb" src="${d.imageUrl}" alt="" onerror="this.parentNode.innerHTML='<div class=art-thumb-ph>📷</div>'">`;}
      }
    }else{flash('⚠ '+(d.error||'No image found'),'info');}
  }catch(e){flash('Error: '+e.message,'err');}
  if(btn){btn.disabled=false;btn.textContent='📷 Fix Img';}
}

// Open image search scoped to this article (fullscreen modal)
function openImgSearch(id, encodedTitle){
  const title=decodeURIComponent(encodedTitle);
  openImgModal(id, title);
}

// Delete article
function deleteArticle(id, encodedTitle){
  const title=decodeURIComponent(encodedTitle);
  showModal('Delete Article',
    `Are you sure you want to delete:<br><br><strong style="color:var(--text)">"${title.slice(0,60)}"</strong><br><br>This cannot be undone.`,
    `<button class="btn-danger" style="flex:1" onclick="confirmDelete('${id}')">Delete</button>
     <button class="btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>`

async function confirmDelete(id){
  closeModal();
  try{
    const d=await api('/api/admin/articles-list',{method:'POST',body:JSON.stringify({action:'delete',id})});
    if(d.ok){
      flash('🗑 Deleted','info');
      const card=document.getElementById('card-'+id);
      if(card)card.remove();
    }else flash('❌ '+(d.error||'Failed'),'err');
  }catch(e){flash('Error: '+e.message,'err');}
}

// ─── IMAGE FINDER MODAL (fullscreen) ─────────────────────────────────────────

function openImgModal(targetId, initialQuery) {
  // Remove any existing modal
  document.getElementById('pwa-imgmodal')?.remove();

  const modal = document.createElement('div');
  modal.className = 'imgmodal';
  modal.id = 'pwa-imgmodal';
  modal.innerHTML = `
    <div class="imgmodal-header">
      <div class="imgmodal-title">🔍 FIND IMAGE</div>
      <input class="imgmodal-inp" id="imgm-q" placeholder="Type keyword — gun model, topic, scene…" value="${(initialQuery||'').replace(/"/g,'&quot;')}">
      <button class="imgmodal-go" id="imgm-go" onclick="doImgModalSearch()">GO</button>
      <button class="imgmodal-close" onclick="closeImgModal()">✕</button>
    </div>
    <div class="imgmodal-meta" id="imgm-meta">Type a keyword and tap GO</div>
    <div class="imgmodal-body">
      <div class="imgmodal-grid" id="imgm-grid"></div>
    </div>`;

  document.body.appendChild(modal);
  window._imgModalTargetId = targetId;

  // ESC to close
  modal._escFn = e => { if(e.key==='Escape') closeImgModal(); };
  document.addEventListener('keydown', modal._escFn);

  // Enter to search
  modal.querySelector('#imgm-q').addEventListener('keydown', e => {
    if(e.key==='Enter') doImgModalSearch();
  });

  // Auto-search if we have a query
  if(initialQuery && initialQuery.trim()) doImgModalSearch();
}

function closeImgModal() {
  const modal = document.getElementById('pwa-imgmodal');
  if(modal) {
    document.removeEventListener('keydown', modal._escFn);
    modal.remove();
  }
}

async function doImgModalSearch() {
  const q = document.getElementById('imgm-q')?.value?.trim();
  if(!q) return;
  const meta = document.getElementById('imgm-meta');
  const grid = document.getElementById('imgm-grid');
  const goBtn = document.getElementById('imgm-go');
  meta.innerHTML = '<span class="spinner" style="display:inline-block;width:12px;height:12px;border:2px solid rgba(200,146,42,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px"></span>Searching…';
  grid.innerHTML = '';
  if(goBtn) goBtn.disabled = true;
  try {
    const d = await api('/api/admin/image-finder', {method:'POST', body:JSON.stringify({query:q, source:'all'})});
    const imgs = d.results || [];
    meta.textContent = imgs.length ? `${imgs.length} results — tap to apply` : 'No results. Try a different keyword.';
    if(!imgs.length) return;
    grid.innerHTML = imgs.map((img,i) => `
      <div class="imgmodal-card" id="imgmc-${i}" onclick="applyImgModal('${window._imgModalTargetId}','${(img.largeUrl||img.url).replace(/'/g,"\\'")}',${i})">
        <img src="${img.thumb||img.url}" alt="" loading="lazy" onerror="this.style.opacity='.2'">
        <div class="imgmodal-card-src">${img.source||''}${img.author?' · '+img.author:''}</div>
      </div>`).join('');
  } catch(e) {
    meta.innerHTML = `<span style="color:#f87171">❌ ${e.message}</span>`;
  }
  if(goBtn) goBtn.disabled = false;
}

async function applyImgModal(id, url, i) {
  // Visual feedback on card
  const card = document.getElementById('imgmc-'+i);
  if(card) card.innerHTML += '<div class="imgmodal-applying">Saving…</div>';
  flash('⏳ Saving image...','info');
  try {
    const d = await api('/api/admin/save-image-url', {method:'POST', body:JSON.stringify({id, imageUrl:url})});
    if(d.ok) {
      flash('✅ Image saved','ok');
      // Update thumbnail in article card if visible
      const artCard = document.getElementById('card-'+id);
      if(artCard) {
        const thumb = artCard.querySelector('.art-thumb,.art-thumb-ph');
        if(thumb) thumb.outerHTML = `<img class="art-thumb" src="${url}" alt="" onerror="this.parentNode.innerHTML='<div class=art-thumb-ph>📷</div>'">`;
      }
      setTimeout(closeImgModal, 600);
    } else flash('❌ '+(d.error||'Failed'),'err');
  } catch(e) { flash('Error: '+e.message,'err'); }
}

// ─── BREAKING ALERTS ─────────────────────────────────────────────────────────
async function renderBreaking(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const d=await fetch('/api/breaking-alerts?limit=20').then(r=>r.json());
    const alerts=d.alerts||[];
    el.innerHTML=`
      <div class="form-row"><span class="lbl">Headline</span><input id="brk-h" class="inp" placeholder="Breaking: ..."></div>
      <div class="form-row"><span class="lbl">URL (optional)</span><input id="brk-u" class="inp" placeholder="https://..."></div>
      <div class="form-row"><span class="lbl">Urgency (1-10)</span><input id="brk-urg" class="inp" type="number" min="1" max="10" value="7"></div>
      <button class="btn" style="width:100%;margin-bottom:20px" id="brk-btn" onclick="addAlert()">Publish Alert</button>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:8px">${alerts.length} active alerts</div>
      ${!alerts.length?'<div class="empty">No active alerts</div>':
        alerts.map(a=>`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);margin-bottom:6px">
          <span class="pill pill-err">LIVE</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.headline}</span>
          <button class="btn-danger btn-xs" onclick="delAlert('${a._id}',this)">✕</button>
        </div>`).join('')}`;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}
async function addAlert(){
  const h=document.getElementById('brk-h')?.value?.trim();if(!h)return;
  const btn=document.getElementById('brk-btn');btn.disabled=true;btn.textContent='⏳';
  try{
    await api('/api/admin/breaking-alert',{method:'POST',body:JSON.stringify({headline:h,url:document.getElementById('brk-u')?.value||'',urgency:parseInt(document.getElementById('brk-urg')?.value)||7})});
    flash('✅ Alert published','ok');
    renderBreaking(document.getElementById('drawer-content'));
  }catch(e){flash('❌ '+e.message,'err');btn.disabled=false;btn.textContent='Publish Alert';}
}
async function delAlert(id,btn){
  btn.disabled=true;
  await api('/api/admin/breaking-alert',{method:'DELETE',body:JSON.stringify({id})});
  flash('Removed','info');
  renderBreaking(document.getElementById('drawer-content'));
}

async function renderCrons(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const d=await api('/api/admin/cron-status');
    const jobs=d.jobs||[];
    const groups={};
    jobs.forEach(j=>{const g=j.group||'Other';(groups[g]=groups[g]||[]).push(j);});
    let html=`<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${jobs.length} jobs</div>`;
    for(const[g,jj] of Object.entries(groups)){
      html+=`<div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 8px">${g}</div>`;
      html+=jj.map(j=>{
        const sc=j.status==='success'?'pill-ok':j.status==='failed'?'pill-err':j.status==='overdue'?'pill-warn':'pill-dim';
        const lastRun=j.lastRun?.at?new Date(j.lastRun.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'Never';
        return `<div class="cron-card">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:16px">${j.icon||'⏱'}</span>
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;flex:1">${j.label||j.id}</span>
            <span class="pill ${sc}">${j.status||'never'}</span>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap">
            <span>⏱ ${j.schedule||'—'}</span><span>Last: ${lastRun}</span>${j.rate!=null?`<span>Rate: ${j.rate}%</span>`:''}
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);margin-bottom:8px">${j.desc||''}</div>
          <button class="btn btn-sm" id="cron-btn-${j.id}" onclick="triggerCron('${j.id}',this)">▶ Run Now</button>
        </div>`;
      }).join('');
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}
async function triggerCron(id,btn){
  btn.disabled=true;btn.textContent='⏳';
  try{
    const d=await api('/api/admin/cron-status?trigger=true',{method:'POST',body:JSON.stringify({jobId:id})});
    flash(d.ok?`✓ ${id} (${d.ms||0}ms)`:'✕ '+(d.error||'Failed'),d.ok?'ok':'err');
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;btn.textContent='▶ Run Now';
}

async function renderSysOverview(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Running diagnostics...</div>';
  try{
    const [h, cronD] = await Promise.all([
      api('/api/admin/cron-health'),
      api('/api/admin/cron-status').catch(()=>({jobs:[]})),
    ]);
    const statusColor = h.status==='HEALTHY'?'var(--ok)':h.status==='BROKEN'?'var(--err)':'var(--warn)';
    const statusIcon  = h.status==='HEALTHY'?'✅':h.status==='BROKEN'?'🔴':'⚠️';

    // Sanity freshness
    const s = h.sanity||{};
    const mins = s.minutesSinceLastArticle;
    const freshColor = mins==null?'var(--dim)':mins<60?'var(--ok)':mins<240?'var(--warn)':'var(--err)';
    const freshLabel = mins==null?'—':mins<60?mins+'m ago':mins<1440?Math.floor(mins/60)+'h ago':Math.floor(mins/1440)+'d ago';

    // Cron job summary
    const jobs = cronD.jobs||[];
    const jobOk    = jobs.filter(j=>j.status==='success').length;
    const jobFail  = jobs.filter(j=>j.status==='failed').length;
    const jobOver  = jobs.filter(j=>j.status==='overdue'||j.isOverdue).length;

    // Env vars
    const envEntries = Object.entries(h.env||{});

    el.innerHTML=`
      <!-- STATUS HERO -->
      <div style="padding:20px 16px;background:var(--bg2);border:1px solid ${h.status==='HEALTHY'?'rgba(34,197,94,.25)':h.status==='BROKEN'?'rgba(239,68,68,.3)':'rgba(245,158,11,.3)'};margin-bottom:16px;text-align:center">

        <div style="margin-bottom:16px">
          ${(h.issues||[]).map(i=>`<div style="padding:10px 14px;background:${i.severity==='CRITICAL'?'rgba(239,68,68,.08)':i.severity==='HIGH'?'rgba(239,68,68,.05)':'rgba(245,158,11,.07)'};border-left:3px solid ${i.severity==='CRITICAL'?'var(--err)':i.severity==='HIGH'?'var(--err)':'var(--warn)'};margin-bottom:6px">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">

async function renderPullLog(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const d=await api('/api/admin/cron-status');
    const jobs=d.jobs||[];
    const all=[];
    jobs.forEach(j=>(j.history||[]).forEach(r=>all.push({...r,jobId:j.id,jobLabel:j.label})));
    all.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
    const recent=all.slice(0,50);
    if(!recent.length){el.innerHTML='<div class="empty">No run history</div>';return;}
    el.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${recent.length} recent runs</div>`+
      recent.map(r=>`<div class="log-entry">

          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim)">${r.at?new Date(r.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</span>
        </div>
        ${r.ms!==undefined?`<div class="log-detail">${r.ms}ms${r.pulled!==undefined?' · pulled '+r.pulled:''}${r.saved!==undefined?' · saved '+r.saved:''}</div>`:''}

}

  try{
    const d=await api('/api/admin/deployments?limit=20');

      el.innerHTML=`<div style="padding:16px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);margin-bottom:16px">

    const errored = deps.filter(x=>x.state==='ERROR'||x.state==='FAILED').length;
    const latest  = deps[0];

    el.innerHTML=`
      <!-- Latest deploy hero -->
      <div style="padding:14px;background:var(--bg2);border:1px solid ${stateColor(latest?.state)==='var(--ok)'?'rgba(34,197,94,.25)':stateColor(latest?.state)==='var(--err)'?'rgba(239,68,68,.3)':'rgba(245,158,11,.3)'};margin-bottom:12px">

          <button class="btn btn-xs" onclick="redeployDep('${latest?.id}',this)">↺ Redeploy</button>

        <div class="stat-box" style="text-align:center"><div class="stat-val">${deps.length}</div><div class="stat-lbl">Total</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--ok)">${ready}</div><div class="stat-lbl">Ready</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--err)">${errored}</div><div class="stat-lbl">Errors</div></div>
      </div>

      <!-- Full list -->
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">All Deployments</div>
      ${deps.map(dep=>depCard(dep)).join('')}`;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}

function stateColor(s){
  if(!s)return 'var(--dim)';
  s=s.toUpperCase();
  if(s==='READY')return 'var(--ok)';
  if(s==='ERROR'||s==='FAILED'||s==='CANCELED')return 'var(--err)';
  if(s==='BUILDING'||s==='INITIALIZING'||s==='QUEUED')return 'var(--warn)';
  return 'var(--dim)';
}
function stateClass(s){
  if(!s)return 'pill-dim';
  s=s.toUpperCase();
  if(s==='READY')return 'pill-ok';
  if(s==='ERROR'||s==='FAILED'||s==='CANCELED')return 'pill-err';
  if(s==='BUILDING'||s==='INITIALIZING'||s==='QUEUED')return 'pill-warn';
  return 'pill-dim';
}
function fmtDur(sec){if(!sec)return '';if(sec<60)return sec+'s';return Math.floor(sec/60)+'m '+( sec%60)+'s';}
function fmtAgo(ts){
  if(!ts)return '';const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';
}

function depCard(dep){
  return `<div class="cron-card" id="dep-${dep.id}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span class="pill ${stateClass(dep.state)}" style="flex-shrink:0">${dep.state||'?'}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dep.commit?dep.commit+' · ':''}${dep.branch||'main'}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);flex-shrink:0">${fmtAgo(dep.createdAt)}</span>
    </div>
    ${dep.source?`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dep.source}</div>`:''}
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);margin-bottom:8px;display:flex;gap:10px">
      ${dep.duration?`<span>⏱ ${fmtDur(dep.duration)}</span>`:''}
      ${dep.url?`<a href="${dep.url}" target="_blank" style="color:var(--gold)">↗ Open</a>`:''}
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn-outline btn-xs" onclick="viewDepLogs('${dep.id}',this)">📋 Logs</button>
      <button class="btn btn-xs" onclick="redeployDep('${dep.id}',this)">↺ Redeploy</button>
    </div>
    <div id="dep-logs-${dep.id}" style="display:none;margin-top:10px"></div>
  </div>`;
}

async function viewDepLogs(id, btn){
  const logEl=document.getElementById('dep-logs-'+id);
  if(!logEl)return;
  if(logEl.style.display!=='none'){logEl.style.display='none';btn.textContent='📋 Build Log';return;}
  btn.disabled=true;btn.textContent='⏳ Loading...';
  logEl.style.display='block';
  logEl.innerHTML='<div style="font-family:\'IBM Plex Mono\',monospace;font-size:9px;color:var(--dim);padding:8px">Fetching build logs from Vercel...</div>';
  try{
    const d=await api(`/api/admin/deployments?id=${id}&logs=true`);
    if(!d.ok){
      logEl.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--err);padding:8px">Error: ${d.error||'Failed to fetch logs'}</div>`;
      btn.disabled=false;btn.textContent='📋 Build Log';
      return;
    }
    const lines=d.logs||[];
    if(!lines.length){
      logEl.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);padding:8px">No log output returned (${d.raw||0} raw events parsed).<br>Logs may not be available for older deployments.</div>`;
      btn.disabled=false;btn.textContent='📋 Build Log';
      return;
    }
    logEl.innerHTML=`<div style="background:#000;border:1px solid var(--border);border-radius:2px;margin-top:8px">
      <div style="padding:6px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--dim)">${lines.length} lines</span>
        <button class="btn-outline" style="padding:2px 8px;font-size:8px;margin-left:auto" onclick="this.closest('[id^=dep-logs]').style.display='none'">✕ Close</button>
      </div>
      <div style="max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px" id="log-scroll-${id}">
        <pre style="font-family:'IBM Plex Mono',monospace;font-size:8px;line-height:1.7;white-space:pre-wrap;margin:0;color:#a0aec0">${lines.map(l=>{
          const col = l.type==='stderr'?'#fc8181':l.type==='command'?'#f6c90e':l.type==='delimiter'?'#68d391':'#a0aec0';
          return `<span style="color:${col}">${escHtml(l.text)}</span>`;
        }).join('\n')}</pre>
      </div>
    </div>`;
    // Scroll to bottom of log
    setTimeout(()=>{const s=document.getElementById('log-scroll-'+id);if(s)s.scrollTop=s.scrollHeight;},50);
  }catch(e){logEl.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--err);padding:8px">Error: ${e.message}</div>`;}
  btn.disabled=false;btn.textContent='📋 Hide Log';
}

async function redeployDep(id, btn){
  btn.disabled=true;btn.textContent='⏳ Triggering...';
  try{
    const d=await api('/api/admin/deployments',{method:'POST',body:JSON.stringify({action:'redeploy',depId:id})});
    if(d.ok){flash('🚀 Redeploy triggered — new deployment starting','ok');}
    else flash('❌ '+(d.error||'Failed'),'err');
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;btn.textContent='↺ Redeploy';
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// PANEL — CANADA
// GET /api/canada?all=true → { items: [{_id,type,title,province,active,...}] }
// POST /api/canada { action:'patch'|'delete'|'ai-write', id, fields }
// ═══════════════════════════════════════════════════════════════════
async function renderCanada(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading...</div>';
  try{
    const d = await api('/api/canada?all=true');
    const items = d.items||[];
    if(!items.length){
      el.innerHTML=`<div class="empty">No Canada content yet</div>
        <button class="btn" style="width:100%;margin-top:16px" onclick="triggerCron('canada',this)">▶ Run Canada Feed</button>`;
      return;
    }
    // Group by type
    const byType = {};
    items.forEach(i=>{ const t=i.type||'other'; (byType[t]=byType[t]||[]).push(i); });
    const typeIcons = {law:'⚖',province:'🍁',article:'📰',ammo:'🎯',alert:'🚨',stat:'📊'};

    el.innerHTML=`
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${items.length} items · ${Object.keys(byType).length} types</div>
      <div class="tabs" id="canada-tabs">
        ${Object.keys(byType).map((t,i)=>`<button class="tab-btn ${i===0?'active':''}" onclick="setCanadaTab('${t}',this)">${typeIcons[t]||'📄'} ${t} (${byType[t].length})</button>`).join('')}
      </div>
      <div id="canada-body"></div>`;
    window._canadaData = byType;
    renderCanadaTab(Object.keys(byType)[0]);
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

function setCanadaTab(type, btn){
  document.querySelectorAll('#canada-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderCanadaTab(type);
}

function renderCanadaTab(type){
  const el = document.getElementById('canada-body'); if(!el) return;
  const items = (window._canadaData||{})[type]||[];
  el.innerHTML = items.map(item=>`
    <div class="art-card" id="card-${item._id}">
      <div class="art-card-top">
        <div class="art-thumb-ph">${item.active?'🟢':'⭕'}</div>
        <div class="art-info">
          <div class="art-title">${item.title||item.name||'—'}</div>
          <div class="art-meta">
            <span class="pill ${item.active?'pill-ok':'pill-dim'}">${item.active?'active':'inactive'}</span>
            ${item.province?`<span class="tag">${item.province}</span>`:''}
            ${item.type?`<span>${item.type}</span>`:''}
          </div>
        </div>
      </div>
      <div class="art-actions">
        <button class="btn btn-xs" onclick="patchCanada('${item._id}',${item.active?'false':'true'},this)">${item.active?'Deactivate':'Activate'}</button>
        <button class="btn-blue btn-xs" onclick="rewriteArticle('${item._id}','${encodeURIComponent(item.title||'')}',this)">✏ Rewrite</button>
        <button class="btn-danger btn-xs" onclick="deleteArticle('${item._id}','${encodeURIComponent(item.title||item.name||'')}')">🗑</button>
      </div>
    </div>`).join('') || '<div class="empty">No items in this category</div>';
}

async function patchCanada(id, active, btn){
  btn.disabled=true;
  try{
    await api('/api/canada',{method:'POST',body:JSON.stringify({action:'patch',id,fields:{active}})});
    flash(`✅ ${active?'Activated':'Deactivated'}`,'ok');
    // refresh
    renderCanada(document.getElementById('drawer-content'));
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;
}

    el.innerHTML=`

        <div class="stat-box" style="text-align:center"><div class="stat-val" style="font-size:1.2rem">${bySource.gunDeals||bySource.ammoland||0}</div><div class="stat-lbl">Other</div></div>

          <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center">

            ${deal.flair?`<span class="tag">${deal.flair}</span>`:''}

// RSS SOURCES — full live version with pause/resume
// GET /api/admin/content-sources → { sources: {feedType: [{id,name,url,status}]}, counts }
// POST /api/admin/content-sources { action:'pause'|'resume'|'delete', sourceId, feedType }
// ═══════════════════════════════════════════════════════════════════
async function renderRSSources(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading sources...</div>';
  try{
    const d = await api('/api/admin/content-sources');
    const sources = d.sources||{};
    const counts  = d.counts||{};
    const allSources = Object.values(sources).flat();
    const activeCount = allSources.filter(s=>s.status==='active').length;
    const pausedCount = allSources.filter(s=>s.status==='paused').length;

    el.innerHTML=`
      <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px">
        <div class="stat-box" style="text-align:center"><div class="stat-val">${allSources.length}</div><div class="stat-lbl">Total</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--ok)">${activeCount}</div><div class="stat-lbl">Active</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--warn)">${pausedCount}</div><div class="stat-lbl">Paused</div></div>
      </div>
      <div class="tabs" id="rss-tabs">
        ${Object.keys(sources).map((t,i)=>`<button class="tab-btn ${i===0?'active':''}" onclick="setRSSTab('${t}',this)">${t} (${counts[t]?.total||0})</button>`).join('')}
      </div>
      <div id="rss-body"></div>`;
    window._rssSources = sources;
    renderRSSTab(Object.keys(sources)[0]);
  }catch(e){
    // Fallback to static list
    el.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">Static source list</div>`+
      ['The Firearm Blog','TTAG','Guns.com','NRA-ILA','ATF','SAF','Bearing Arms','AmmoLand',
       'TheGunFeed','TheGunBlog.ca','NFA Canada','CSSA','GOA','American Rifleman',
       'Concealed Nation','r/guns','r/firearms','gun.deals']
      .map(f=>`<div class="row row-last"><span style="font-size:14px">📡</span><div class="row-label">${f}</div><span class="pill pill-ok">Active</span></div>`).join('');
  }
}

function setRSSTab(type, btn){
  document.querySelectorAll('#rss-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderRSSTab(type);
}

function renderRSSTab(type){
  const el = document.getElementById('rss-body'); if(!el) return;
  const sources = (window._rssSources||{})[type]||[];
  el.innerHTML = sources.map(s=>`
    <div style="display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px" id="rss-${s.id}">
      <span style="font-size:14px">📡</span>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name||s.id}</div>
        ${s._custom?'<span style="font-family:\'IBM Plex Mono\',monospace;font-size:8px;color:var(--gold)">custom</span>':''}
      </div>
      <span class="pill ${s.status==='active'?'pill-ok':s.status==='paused'?'pill-warn':'pill-err'}">${s.status||'active'}</span>
      <button class="btn-outline btn-xs" onclick="toggleRSSSource('${s.id}','${type}','${s.status==='active'?'pause':'resume'}',this)">${s.status==='active'?'⏸':'▶'}</button>
    </div>`).join('') || '<div class="empty">No sources in this category</div>';
}

async function toggleRSSSource(sourceId, feedType, action, btn){
  btn.disabled=true;
  try{
    const d = await api('/api/admin/content-sources',{method:'POST',body:JSON.stringify({action,sourceId,feedType})});
    if(d.ok){ flash(`✅ Source ${action}d`,'ok'); renderRSSources(document.getElementById('drawer-content')); }
    else flash('❌ '+(d.error||'Failed'),'err');
  }catch(e){flash('Error: '+e.message,'err'); btn.disabled=false;}
}

// PANEL — SITE SETTINGS (author bio + urgency threshold + nav config)

async function renderSiteSettings(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const [site, nav] = await Promise.all([
      api('/api/admin/site-config'),
      api('/api/admin/nav-config'),
    ]);
    el.innerHTML=`
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Author Bio</div>
      <textarea id="author-bio" class="inp" rows="4" style="resize:vertical;margin-bottom:8px">${site.authorBio||''}</textarea>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-bottom:12px">Last updated: ${site.authorBioUpdatedAt?new Date(site.authorBioUpdatedAt).toLocaleDateString():'never'}</div>
      <button class="btn" style="width:100%;margin-bottom:20px" onclick="saveBio(this)">Save Bio</button>

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Breaking Alert Threshold</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:8px">Urgency score (1-10) required to auto-publish a breaking alert</div>
      <input id="urgency-thresh" class="inp" type="number" min="1" max="10" value="${site.breakingUrgencyThreshold||8}" style="margin-bottom:8px">
      <button class="btn-outline" style="width:100%;margin-bottom:20px" onclick="saveUrgencyThreshold(this)">Save Threshold</button>

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Nav Hidden Items</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:8px">${(nav.hiddenItems||[]).length} items hidden from nav</div>
      ${(nav.hiddenItems||[]).length?
        (nav.hiddenItems||[]).map(item=>`<div class="row row-last"><div class="row-label code">${item}</div><button class="btn-outline btn-xs" onclick="unhideNav('${item}',this)">Show</button></div>`).join('')
        :'<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--ok)">All nav items visible ✓</div>'}
    `;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

async function saveBio(btn){
  const bio=document.getElementById('author-bio')?.value?.trim();
  if(!bio||bio.length<20){flash('Bio must be at least 20 chars','err');return;}
  btn.disabled=true;btn.textContent='⏳';
  try{
    const d=await api('/api/admin/site-config',{method:'POST',body:JSON.stringify({authorBio:bio})});
    flash(d.ok?'✅ Bio saved':'❌ '+(d.error||'Failed'),d.ok?'ok':'err');
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;btn.textContent='Save Bio';
}

async function saveUrgencyThreshold(btn){
  const val=parseInt(document.getElementById('urgency-thresh')?.value)||8;
  btn.disabled=true;btn.textContent='⏳';
  try{
    const d=await api('/api/admin/site-config',{method:'POST',body:JSON.stringify({breakingUrgencyThreshold:val})});
    flash(d.ok?`✅ Threshold set to ${val}`:'❌ '+(d.error||'Failed'),d.ok?'ok':'err');
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;btn.textContent='Save Threshold';
}

async function unhideNav(item,btn){
  btn.disabled=true;
  try{
    const d=await api('/api/admin/nav-config');
    const current=(d.hiddenItems||[]).filter(x=>x!==item);
    await api('/api/admin/nav-config',{method:'POST',body:JSON.stringify({hiddenItems:current})});
    flash(`✅ ${item} shown`,'ok');
    renderSiteSettings(document.getElementById('drawer-content'));
  }catch(e){flash('Error: '+e.message,'err');btn.disabled=false;}
}

async function renderCostCenter(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const d=await api('/api/admin/ai-costs');
    const live=d.live||{};
    const proj=d.projections||{};
    const tiers=d.tiers||{};
    const hist=d.historical||[];
    const today=live.today||{};

    el.innerHTML=`
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Today's Spend</div>
      <div class="stat-grid" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
        <div class="stat-box" style="text-align:center">
          <div class="stat-val" style="color:var(--gold)">$${(live.todayUsd||0).toFixed(4)}</div>
          <div class="stat-lbl">Today USD</div>
        </div>
        <div class="stat-box" style="text-align:center">
          <div class="stat-val">${live.todayCalls||0}</div>
          <div class="stat-lbl">API Calls</div>
        </div>
        <div class="stat-box" style="text-align:center">
          <div class="stat-val" style="font-size:1.2rem;color:var(--warn)">$${(proj.monthly||0).toFixed(2)}</div>
          <div class="stat-lbl">Proj. Monthly</div>
        </div>
        <div class="stat-box" style="text-align:center">
          <div class="stat-val" style="font-size:1.2rem;color:var(--ok)">$${(proj.savedVsSonnet||0).toFixed(2)}</div>
          <div class="stat-lbl">Saved vs Sonnet</div>
        </div>
      </div>

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">By Model Tier</div>
      ${Object.entries(today).map(([tier,v])=>{
        const maxUsd=Math.max(...Object.values(today).map(x=>x.usd||0),0.0001);
        const pct=Math.round(((v.usd||0)/maxUsd)*100);
        return `<div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;margin-bottom:3px">
            <span style="color:var(--text)">${tier} <span style="color:var(--dim)">(${tiers[tier]?.model||''})</span></span>
            <span style="color:var(--gold)">$${(v.usd||0).toFixed(5)} · ${v.calls||0} calls</span>
          </div>
          <div style="height:5px;background:var(--bg3)"><div style="height:100%;background:var(--gold);width:${pct}%"></div></div>
        </div>`;
      }).join('')}

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px">Model Tiers</div>
      ${Object.entries(tiers).map(([tier,t])=>`
        <div class="row row-last">
          <div style="flex:1">
            <div class="row-label">${tier.toUpperCase()} — ${t.model}</div>
            <div class="row-sub">${t.costPer1k} per 1k tokens</div>
          </div>
        </div>`).join('')}

      ${hist.length?`
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px">History (${hist.length} entries)</div>

          <span style="color:var(--dim)">${h.date||h.ts||'?'}</span>
          <span style="color:var(--gold)">$${(h.usd||h.totalUsd||0).toFixed(4)}</span>
          <span style="color:var(--dim2)">${h.calls||0} calls</span>
        </div>`).join('')}`:''}
    `;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

async function renderBackup(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const d=await api('/api/admin/backup');
    const manifest=d.manifest||{};
    const counts=d.counts||manifest.counts||{};
    const totalDocs=d.totalDocs||manifest.totalDocs||Object.values(counts).reduce((s,v)=>s+v,0);

    el.innerHTML=`
      <div style="padding:14px;background:rgba(200,146,42,.06);border:1px solid rgba(200,146,42,.2);margin-bottom:16px">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:4px">LAST BACKUP</div>
        <div style="font-family:'Bebas Neue',cursive;font-size:1.4rem">${totalDocs} documents</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim)">${manifest.timestamp?new Date(manifest.timestamp).toLocaleString():new Date().toLocaleString()} · ${d.sizeKB||0}KB</div>
      </div>

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Document Counts</div>
      ${Object.entries(counts).map(([type,count])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:3px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text)">${type}</span>
          <span style="font-family:'Bebas Neue',cursive;font-size:1.1rem;color:var(--gold)">${count}</span>
        </div>`).join('')}

      <div class="divider"></div>
      <button class="btn" id="backup-btn" style="width:100%" onclick="runBackup(this)">📦 Run Backup Now</button>
      <div id="backup-result" style="margin-top:8px"></div>
    `;
  }catch(e){el.innerHTML=`<div class="empty">Error loading backup data<br><br><button class="btn" onclick="runBackup(this)">📦 Run Backup Now</button><div id="backup-result" style="margin-top:8px"></div></div>`;}
}

async function runBackup(btn){
  btn.disabled=true;btn.textContent='⏳ Backing up...';
  flash('⏳ Running full Sanity backup...','info');
  try{
    const d=await api('/api/admin/backup');
    const res=document.getElementById('backup-result');
    if(res) res.innerHTML=`<div style="padding:10px;background:rgba(34,197,94,.08);border:1px solid var(--ok);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ok)">✅ ${d.totalDocs||0} docs · ${d.sizeKB||0}KB · ${d.ms||0}ms</div>`;
    flash(`✅ Backup complete — ${d.totalDocs||0} documents`,'ok');
    renderBackup(document.getElementById('drawer-content'));
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;btn.textContent='📦 Run Backup Now';
}

async function renderLockAll(el){
  el.innerHTML=`
    <div style="padding:14px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);margin-bottom:16px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--err);margin-bottom:4px">⚠ BULK OPERATION</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);line-height:1.6">Lock or unlock all content of a given type. Locked content cannot be edited in Sanity Studio without unlocking first.</div>
    </div>

    <div class="form-row"><span class="lbl">Content Type</span>
      <select id="lock-type" class="inp">
        <option value="newsArticle">News Articles</option>
        <option value="blogPost">Blog Posts</option>
        <option value="firearmRelease">Firearm Releases</option>
        <option value="socialPost">Social Posts</option>
      </select>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1" onclick="runLockAll(true,this)">🔒 Lock All</button>
      <button class="btn-outline" style="flex:1" onclick="runLockAll(false,this)">🔓 Unlock All</button>
    </div>
    <div id="lock-result" style="margin-top:12px"></div>
  `;
}

async function runLockAll(lock, btn){
  const type=document.getElementById('lock-type')?.value;
  if(!type) return;
  showModal(
    lock?'Lock All Content':'Unlock All Content',
    `${lock?'Lock':'Unlock'} ALL <strong>${type}</strong> documents?${lock?' This prevents editing in Sanity Studio.':''}`,
    `<button class="${lock?'btn-danger':'btn'}" style="flex:1" onclick="confirmLockAll('${type}',${lock},this)">Confirm ${lock?'Lock':'Unlock'}</button>
     <button class="btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>`
  );
}

async function confirmLockAll(type, lock, btn){
  closeModal(); btn.disabled=true;
  flash(`⏳ ${lock?'Locking':'Unlocking'} all ${type}...`,'info');
  try{
    const d=await api('/api/admin/lock-all',{method:'POST',body:JSON.stringify({type,lock})});
    const res=document.getElementById('lock-result');
    if(res) res.innerHTML=`<div style="padding:10px;background:${d.ok?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'};border:1px solid ${d.ok?'var(--ok)':'var(--err)'};font-family:'IBM Plex Mono',monospace;font-size:10px;color:${d.ok?'var(--ok)':'var(--err)'}">${d.ok?`✅ ${lock?'Locked':'Unlocked'} ${d.updated||0} documents`:'❌ '+(d.error||'Failed')}</div>`;
    flash(d.ok?`✅ ${d.updated||0} docs ${lock?'locked':'unlocked'}`:'❌ '+(d.error||'Failed'),d.ok?'ok':'err');
  }catch(e){flash('Error: '+e.message,'err');}
}

// PANEL — ALERT CONFIG (email alerts configuration)
// ═══════════════════════════════════════════════════════════════════
async function renderAlertConfig(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const d=await api('/api/admin/alert-config');
    const cfg=d.config||{};
    el.innerHTML=`
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:16px;line-height:1.6">Configure when DownRange sends system alert emails to dejcav@gmail.com</div>

      <div class="form-row"><span class="lbl">Alert Email</span>
        <input id="alert-email" class="inp" type="email" value="${cfg.email||'dejcav@gmail.com'}">
      </div>
      <div class="form-row"><span class="lbl">Failure Threshold (consecutive fails before alert)</span>
        <input id="alert-threshold" class="inp" type="number" min="1" max="10" value="${cfg.failThreshold||3}">
      </div>

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Alert Types</div>
      ${['cronFailed','cronOverdue','sanityUnreachable','lowArticleCount'].map(key=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px">${key}</span>
          <button class="pill ${cfg[key]!==false?'pill-ok':'pill-dim'}" id="alert-toggle-${key}" onclick="toggleAlertType('${key}',this)">${cfg[key]!==false?'ON':'OFF'}</button>
        </div>`).join('')}

      <div class="divider"></div>
      <button class="btn" style="width:100%" onclick="saveAlertConfig(this)">Save Alert Config</button>
    `;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

function toggleAlertType(key, btn){
  const isOn = btn.textContent.trim()==='ON';
  btn.textContent = isOn?'OFF':'ON';
  btn.className = `pill ${isOn?'pill-dim':'pill-ok'}`;
  if(!window._alertCfgOverrides) window._alertCfgOverrides={};
  window._alertCfgOverrides[key] = !isOn;
}

async function saveAlertConfig(btn){
  btn.disabled=true;btn.textContent='⏳';
  try{
    const overrides=window._alertCfgOverrides||{};
    const config={
      email: document.getElementById('alert-email')?.value||'dejcav@gmail.com',
      failThreshold: parseInt(document.getElementById('alert-threshold')?.value)||3,
      ...overrides,
    };
    const d=await api('/api/admin/alert-config',{method:'POST',body:JSON.stringify({config})});
    flash(d.ok?'✅ Alert config saved':'❌ '+(d.error||'Failed'),d.ok?'ok':'err');
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;btn.textContent='Save Alert Config';
}

     {id:'imgsearch',i:'🔍',l:'Image Search',s:'Pexels + Pixabay finder'},
     {id:'social',i:'📣',l:'Social Media',s:'Post log + analytics + platforms'}]
    .map(p=>`<div class="row row-last" onclick="openPanel('${p.id}','${p.l}')" style="cursor:pointer"><span style="font-size:20px">${p.i}</span><div style="flex:1"><div class="row-label">${p.l}</div><div class="row-sub">${p.s}</div></div><span style="color:var(--dim)">›</span></div>`).join('');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('modal-overlay').classList.contains('open'))closeModal();
    else if(document.getElementById('drawer').classList.contains('open'))closeDrawer();
    else closeSheet();
  }
});
</script>
</body>
</html>
