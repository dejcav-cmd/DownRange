<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DR Admin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─── */
:root {
  --bg:       #09090B;
  --bg2:      #111318;
  --bg3:      #1a1d24;
  --bg4:      #21252f;
  --border:   #1e293b;
  --border2:  #2d3748;
  --text:     #F0EDE6;
  --dim:      #6b7280;
  --dim2:     #4b5563;
  --gold:     #C8922A;
  --gold2:    #a87520;
  --ok:       #22c55e;
  --err:      #ef4444;
  --warn:     #f59e0b;
  --safe-t:   env(safe-area-inset-top, 0px);
  --safe-b:   env(safe-area-inset-bottom, 0px);
  --safe-l:   env(safe-area-inset-left, 0px);
  --safe-r:   env(safe-area-inset-right, 0px);
  --topbar-h: 52px;
  --nav-h:    60px;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body {
  height:100%; background:var(--bg); color:var(--text);
  font-family:'Barlow Condensed',sans-serif;
  overscroll-behavior:none; overflow:hidden;
}
button { font-family:inherit; }
input,textarea,select { font-family:'IBM Plex Mono',monospace; }
a { color:inherit; text-decoration:none; }

/* ─── SHELL ─── */
#app {
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
  padding-top:calc(var(--topbar-h) + var(--safe-t));
  padding-bottom:calc(var(--nav-h) + var(--safe-b));
}

/* ─── TOPBAR ─── */
#topbar {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:calc(var(--topbar-h) + var(--safe-t));
  padding-top:var(--safe-t);
  background:var(--bg2); border-bottom:1px solid var(--border);
  display:flex; align-items:center;
  padding-left:calc(16px + var(--safe-l));
  padding-right:calc(16px + var(--safe-r));
  gap:10px;
}
#topbar-logo {
  font-family:'Bebas Neue',cursive; font-size:1.3rem;
  color:var(--gold); letter-spacing:.1em; flex-shrink:0;
}
#topbar-title {
  font-family:'IBM Plex Mono',monospace; font-size:10px;
  color:var(--dim); letter-spacing:.12em; text-transform:uppercase;
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#topbar-status { font-size:16px; flex-shrink:0; }
#topbar-menu-btn {
  background:none; border:1px solid var(--border); color:var(--dim);
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  font-size:14px; cursor:pointer; flex-shrink:0;
  transition:border-color .15s, color .15s;
}
#topbar-menu-btn:active { border-color:var(--gold); color:var(--gold); }

/* ─── FLASH MESSAGE ─── */
#flash {
  position:fixed; top:calc(var(--topbar-h) + var(--safe-t)); left:0; right:0;
  z-index:199; padding:10px 16px;
  font-family:'IBM Plex Mono',monospace; font-size:11px;
  display:none; align-items:center; gap:8px;
  transform:translateY(-100%); transition:transform .2s ease;
}
#flash.show { display:flex; transform:translateY(0); }
#flash.ok  { background:rgba(34,197,94,.12);  border-bottom:1px solid rgba(34,197,94,.3);  color:#4ade80; }
#flash.err { background:rgba(239,68,68,.12);  border-bottom:1px solid rgba(239,68,68,.3);  color:#f87171; }
#flash.info{ background:rgba(200,146,42,.1);  border-bottom:1px solid rgba(200,146,42,.3); color:var(--gold); }
#flash-close { margin-left:auto; background:none; border:none; color:inherit; font-size:16px; cursor:pointer; }

/* ─── BOTTOM NAV ─── */
#bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:var(--bg2); border-top:1px solid var(--border);
  display:flex; align-items:stretch;
}
.nav-tab {
  flex:1; background:none; border:none; border-top:2px solid transparent;
  color:var(--dim2); cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; padding:0;
  transition:color .15s; position:relative;
}
.nav-tab.active { color:var(--gold); border-top-color:var(--gold); }
.nav-tab-icon { font-size:18px; line-height:1; }
.nav-tab-label { font-size:9px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
.nav-badge {
  position:absolute; top:6px; right:calc(50% - 16px);
  background:var(--err); color:#fff; font-size:7px; font-weight:700;
  padding:1px 4px; border-radius:2px; pointer-events:none;
}

/* ─── CONTENT AREA ─── */
#content { flex:1; overflow:hidden; position:relative; }

/* ─── SCREENS ─── */
.screen {
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  padding:16px; display:none; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.screen.active { display:block; animation:fadeIn .18s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

/* ─── DRAWER (full-screen panel overlay) ─── */
#drawer {
  position:fixed; inset:0; z-index:300;
  display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
  background:var(--bg); pointer-events:none;
}
#drawer.open { transform:translateX(0); pointer-events:all; }
#drawer-topbar {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; padding-top:calc(12px + var(--safe-t));
  background:var(--bg2); border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#drawer-back {
  background:none; border:none; color:var(--gold); font-size:18px;
  cursor:pointer; padding:4px 8px; margin-left:-8px; display:flex; align-items:center; gap:4px;
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em;
}
#drawer-title {
  font-family:'Bebas Neue',cursive; font-size:1.3rem;
  color:var(--text); letter-spacing:.08em; flex:1;
}
#drawer-content {
  flex:1; overflow-y:auto; overflow-x:hidden; padding:16px;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(16px + var(--safe-b));
}

/* ─── SECTION MENU SHEET ─── */
#section-sheet {
  position:fixed; inset:0; z-index:250;
  background:rgba(0,0,0,.7); backdrop-filter:blur(4px);
  display:none; align-items:flex-end;
}
#section-sheet.open { display:flex; }
#section-sheet-inner {
  width:100%; background:var(--bg2); border-top:1px solid var(--border);
  border-radius:16px 16px 0 0; max-height:80vh; overflow-y:auto;
  padding-bottom:calc(16px + var(--safe-b));
  animation:slideUp .22s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:none} }
#sheet-handle { width:36px; height:4px; background:var(--border2); border-radius:2px; margin:12px auto 8px; }
.sheet-section-header {
  padding:10px 20px 6px;
  font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim2);
  letter-spacing:.12em; text-transform:uppercase;
}
.sheet-panel-btn {
  width:100%; background:none; border:none; border-bottom:1px solid rgba(30,41,59,.5);
  color:var(--text); cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:12px;
  padding:13px 20px; transition:background .1s;
}
.sheet-panel-btn:active { background:rgba(200,146,42,.08); }
.sheet-panel-btn .pi { font-size:18px; flex-shrink:0; }
.sheet-panel-btn .pl {
  flex:1; font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:600;
  letter-spacing:.03em;
}
.sheet-panel-btn .pb {
  background:var(--err); color:#fff; font-family:'IBM Plex Mono',monospace;
  font-size:7px; font-weight:700; padding:2px 5px;
}

/* ─── KEY LOCK SCREEN ─── */
#lock-screen {
  position:fixed; inset:0; z-index:500;
  background:var(--bg); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px; padding:32px;
}
#lock-logo { font-family:'Bebas Neue',cursive; font-size:3rem; color:var(--gold); letter-spacing:.1em; }
#lock-sub { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); text-align:center; }
#lock-input {
  width:100%; max-width:300px; background:var(--bg3); border:1px solid var(--border2);
  color:var(--text); padding:14px 16px; font-family:'IBM Plex Mono',monospace;
  font-size:14px; outline:none; text-align:center; border-radius:0;
  -webkit-appearance:none;
}
#lock-input:focus { border-color:var(--gold); }
#lock-btn {
  width:100%; max-width:300px; background:var(--gold); color:#000;
  border:none; padding:14px; font-family:'Barlow Condensed',sans-serif;
  font-size:15px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  cursor:pointer;
}
#lock-err { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--err); display:none; }

/* ─── COMPONENT STYLES ─── */
.card { background:var(--bg2); border:1px solid var(--border); }
.section-title {
  font-family:'Bebas Neue',cursive; font-size:1.6rem;
  color:var(--text); letter-spacing:.04em; margin-bottom:4px;
}
.section-sub {
  font-family:'IBM Plex Mono',monospace; font-size:10px;
  color:var(--dim2); margin-bottom:16px; line-height:1.6;
}
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
.stat-box { background:var(--bg2); border:1px solid var(--border); padding:14px; }
.stat-val { font-family:'Bebas Neue',cursive; font-size:2rem; color:var(--gold); line-height:1; }
.stat-lbl { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim2); margin-top:2px; letter-spacing:.08em; text-transform:uppercase; }
.row { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--bg2); border:1px solid var(--border); border-bottom:none; }
.row:last-child { border-bottom:1px solid var(--border); }
.row-label { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:600; flex:1; }
.row-sub { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); margin-top:2px; }
.pill { font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; padding:2px 7px; }
.pill-ok   { background:rgba(34,197,94,.12);  color:var(--ok);  border:1px solid rgba(34,197,94,.3); }
.pill-err  { background:rgba(239,68,68,.12);  color:var(--err); border:1px solid rgba(239,68,68,.3); }
.pill-warn { background:rgba(245,158,11,.12); color:var(--warn);border:1px solid rgba(245,158,11,.3); }
.pill-gold { background:rgba(200,146,42,.12); color:var(--gold);border:1px solid rgba(200,146,42,.3); }
.pill-dim  { background:rgba(107,114,128,.1); color:var(--dim); border:1px solid var(--border); }
.btn {
  background:var(--gold); color:#000; border:none;
  font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; padding:10px 18px;
  cursor:pointer; transition:opacity .15s; flex-shrink:0;
  -webkit-appearance:none;
}
.btn:active { opacity:.8; }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn-sm { padding:6px 12px; font-size:11px; }
.btn-outline {
  background:none; border:1px solid var(--border); color:var(--dim);
  font-family:'IBM Plex Mono',monospace; font-size:10px; padding:7px 12px;
  cursor:pointer; transition:border-color .15s, color .15s;
  -webkit-appearance:none;
}
.btn-outline:active { border-color:var(--gold); color:var(--gold); }
.btn-danger {
  background:none; border:1px solid rgba(239,68,68,.4); color:var(--err);
  font-family:'IBM Plex Mono',monospace; font-size:10px; padding:7px 12px;
  cursor:pointer; -webkit-appearance:none;
}
.btn-danger:active { background:rgba(239,68,68,.1); }
.inp {
  width:100%; background:var(--bg3); border:1px solid var(--border);
  color:var(--text); font-family:'IBM Plex Mono',monospace;
  font-size:12px; padding:10px 12px; outline:none; -webkit-appearance:none;
}
.inp:focus { border-color:var(--gold); }
.lbl { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim2); letter-spacing:.1em; text-transform:uppercase; display:block; margin-bottom:4px; }
.form-row { margin-bottom:12px; }
.divider { height:1px; background:var(--border); margin:16px 0; }
.empty { text-align:center; padding:40px 16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim2); }
.loading { text-align:center; padding:40px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim2); }
.spinner { display:inline-block; animation:spin 1s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.tag { font-family:'IBM Plex Mono',monospace; font-size:9px; padding:2px 6px; background:rgba(200,146,42,.1); color:var(--gold); }
.code { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--gold); }

/* ─── ARTICLE CARD ─── */
.article-card { background:var(--bg2); border:1px solid var(--border); padding:14px; margin-bottom:8px; }
.article-title { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; color:var(--text); margin-bottom:4px; line-height:1.3; }
.article-meta { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.article-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

/* ─── CRON CARD ─── */
.cron-card { background:var(--bg2); border:1px solid var(--border); padding:14px; margin-bottom:8px; }
.cron-name { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.cron-details { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.cron-actions { display:flex; gap:6px; }

/* ─── LIST ITEM ─── */
.list-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.list-item:last-child { border-bottom:none; }

/* ─── QUICK ACTION GRID ─── */
.qa-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
.qa-btn {
  background:var(--bg2); border:1px solid var(--border); padding:14px 12px;
  cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  transition:border-color .15s; text-align:left;
}
.qa-btn:active { border-color:var(--gold); background:rgba(200,146,42,.05); }
.qa-icon { font-size:20px; }
.qa-label { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:.05em; color:var(--text); line-height:1.2; }

/* ─── OUTREACH ─── */
.outreach-card { background:var(--bg2); border:1px solid var(--border); padding:14px; margin-bottom:8px; }
.outreach-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; margin-bottom:2px; }
.outreach-platform { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--gold); margin-bottom:6px; }
.outreach-meta { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; }
.outreach-actions { display:flex; gap:6px; margin-top:10px; }

/* ─── BLOG CARD ─── */
.blog-card { background:var(--bg2); border:1px solid var(--border); padding:14px; margin-bottom:8px; }
.blog-title { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; margin-bottom:4px; color:var(--text); }
.blog-meta  { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }

/* ─── TABS ─── */
.tabs { display:flex; overflow-x:auto; gap:0; border-bottom:1px solid var(--border); margin-bottom:16px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab-btn {
  background:none; border:none; border-bottom:2px solid transparent;
  color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:10px;
  padding:8px 14px; cursor:pointer; white-space:nowrap; letter-spacing:.05em;
  transition:all .12s; flex-shrink:0;
}
.tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); }

/* ─── RELEASE / GUN CARD ─── */
.release-card { background:var(--bg2); border:1px solid var(--border); padding:14px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
.release-img { width:64px; height:48px; object-fit:cover; flex-shrink:0; background:var(--bg3); }
.release-info { flex:1; min-width:0; }
.release-name { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; margin-bottom:3px; }
.release-meta { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); }

/* ─── COST CHART ─── */
.cost-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.cost-bar-label { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); width:80px; flex-shrink:0; }
.cost-bar-track { flex:1; height:6px; background:var(--bg3); position:relative; }
.cost-bar-fill { height:100%; background:var(--gold); transition:width .5s ease; }
.cost-bar-val { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--text); width:50px; text-align:right; flex-shrink:0; }

/* ─── BOTTOM SHEET (inner drawer panels) ─── */
.inner-tabs { display:flex; overflow-x:auto; gap:0; border-bottom:1px solid var(--border); margin:-16px -16px 16px; padding:0 16px; scrollbar-width:none; }
.inner-tabs::-webkit-scrollbar { display:none; }
</style>
</head>
<body>

<!-- ─── LOCK SCREEN ─── -->
<div id="lock-screen">
  <div id="lock-logo">◈ DR Admin</div>
  <div id="lock-sub">DownRange Command Center<br>Enter your admin key to continue</div>
  <input type="password" id="lock-input" placeholder="Admin key..." autocomplete="current-password">
  <div id="lock-err">Invalid key — check Vercel env vars</div>
  <button id="lock-btn" onclick="tryAuth()">Unlock Portal</button>
</div>

<!-- ─── FLASH ─── -->
<div id="flash">
  <span id="flash-text"></span>
  <button id="flash-close" onclick="hideFlash()">✕</button>
</div>

<!-- ─── TOPBAR ─── -->
<div id="topbar">
  <div id="topbar-logo">◈ DR</div>
  <div id="topbar-title">COMMAND CENTER</div>
  <div id="topbar-status">🟢</div>
  <button id="topbar-menu-btn" onclick="openSectionSheet()">☰</button>
</div>

<!-- ─── APP ─── -->
<div id="app">
  <div id="content">

    <!-- ══ DASHBOARD ══ -->
    <div id="screen-dashboard" class="screen active"></div>

    <!-- ══ CONTENT ══ -->
    <div id="screen-content" class="screen"></div>

    <!-- ══ OUTREACH ══ -->
    <div id="screen-outreach" class="screen"></div>

    <!-- ══ INTELLIGENCE ══ -->
    <div id="screen-intel" class="screen"></div>

    <!-- ══ SYSTEM ══ -->
    <div id="screen-system" class="screen"></div>

    <!-- ══ MEDIA ══ -->
    <div id="screen-media" class="screen"></div>

    <!-- ══ SETTINGS ══ -->
    <div id="screen-settings" class="screen"></div>

    <!-- ══ PUBLISHING ══ -->
    <div id="screen-publishing" class="screen"></div>

  </div>
</div>

<!-- ─── BOTTOM NAV ─── -->
<div id="bottom-nav">
  <button class="nav-tab active" data-screen="dashboard" onclick="navTo('dashboard',this)">
    <span class="nav-tab-icon">◈</span>
    <span class="nav-tab-label">Home</span>
  </button>
  <button class="nav-tab" data-screen="content" onclick="navTo('content',this)">
    <span class="nav-tab-icon">📰</span>
    <span class="nav-tab-label">Content</span>
  </button>
  <button class="nav-tab" data-screen="outreach" onclick="navTo('outreach',this)">
    <span class="nav-tab-icon">📬</span>
    <span class="nav-tab-label">Outreach</span>
  </button>
  <button class="nav-tab" data-screen="intel" onclick="navTo('intel',this)">
    <span class="nav-tab-icon">🧠</span>
    <span class="nav-tab-label">Intel</span>
  </button>
  <button class="nav-tab" data-screen="system" onclick="navTo('system',this)">
    <span class="nav-tab-icon">⚙️</span>
    <span class="nav-tab-label">System</span>
  </button>
</div>

<!-- ─── DRAWER (panel detail) ─── -->
<div id="drawer">
  <div id="drawer-topbar">
    <button id="drawer-back" onclick="closeDrawer()">← Back</button>
    <div id="drawer-title">Panel</div>
  </div>
  <div id="drawer-content"></div>
</div>

<!-- ─── SECTION SHEET ─── -->
<div id="section-sheet" onclick="if(event.target===this)closeSectionSheet()">
  <div id="section-sheet-inner" id="sheet-inner">
    <div id="sheet-handle"></div>
    <div id="sheet-list"></div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let adminKey = '';
let currentScreen = 'dashboard';
let screenInited = {};

// ─── AUTH ─────────────────────────────────────────────────────────────────────
function tryAuth() {
  const val = document.getElementById('lock-input').value.trim();
  if (!val) return;
  adminKey = val;
  localStorage.setItem('dr_admin_key', val);
  document.getElementById('lock-screen').style.display = 'none';
  initApp();
}
document.getElementById('lock-input').addEventListener('keydown', e => { if(e.key==='Enter') tryAuth(); });
window.addEventListener('load', () => {
  const k = localStorage.getItem('dr_admin_key');
  if (k) { adminKey = k; document.getElementById('lock-screen').style.display = 'none'; initApp(); }
});

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  const headers = { 'x-admin-key': adminKey, ...(opts.body ? {'Content-Type':'application/json'} : {}), ...opts.headers };
  const r = await fetch(path, { ...opts, headers });
  return r.json();
}

// ─── FLASH ────────────────────────────────────────────────────────────────────
let flashTimer;
function flash(msg, type='info') {
  const el = document.getElementById('flash');
  el.className = 'show ' + type;
  document.getElementById('flash-text').textContent = msg;
  clearTimeout(flashTimer);
  if (!msg.startsWith('⏳')) flashTimer = setTimeout(hideFlash, 5000);
}
function hideFlash() {
  const el = document.getElementById('flash');
  el.classList.remove('show');
  setTimeout(()=>{ el.className=''; },200);
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function navTo(screen, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  currentScreen = screen;
  const titles = { dashboard:'Command Center', content:'Content', outreach:'Outreach',
    intel:'Intelligence', system:'System', media:'Media', settings:'Settings', publishing:'Publishing' };
  document.getElementById('topbar-title').textContent = (titles[screen]||screen).toUpperCase();
  if (!screenInited[screen]) { screenInited[screen] = true; renderScreen(screen); }
}

// ─── DRAWER ──────────────────────────────────────────────────────────────────
function openDrawer(title, renderFn) {
  document.getElementById('drawer-title').textContent = title;
  document.getElementById('drawer-content').innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading...</div>';
  document.getElementById('drawer').classList.add('open');
  requestAnimationFrame(() => renderFn(document.getElementById('drawer-content')));
}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

// ─── SECTION SHEET ────────────────────────────────────────────────────────────
const SECTIONS = [

  { id:'content',     label:'Content',      icon:'📰', panels:[
    {id:'hub',label:'Content Hub',icon:'◈'}, {id:'drafts',label:'Draft Recovery',icon:'🔍'},

    {id:'canada',label:'Canada',icon:'🇨🇦'}, {id:'brazil',label:'Brasil',icon:'🇧🇷'},

    {id:'rss',label:'RSS Sources',icon:'📡'},{id:'sitemap',label:'Site Map',icon:'🗺️'},
  ]},

    {id:'campaigns',label:'Campaigns',icon:'📬'},{id:'contacts',label:'Contacts',icon:'👤'},
  ]},

    {id:'videos',label:'Video Manager',icon:'▶'},{id:'channels',label:'Channels',icon:'📺'},

    {id:'keys',label:'API Keys',icon:'🔑'},{id:'envcheck',label:'Env Vars',icon:'🔧'},
    {id:'emails',label:'Email Tests',icon:'✉'},
  ]},
];

function openSectionSheet() {
  const list = document.getElementById('sheet-list');
  list.innerHTML = SECTIONS.map(sec => {
    if (sec.panels.length === 0) return `
      <button class="sheet-panel-btn" onclick="navTo('${sec.id}', document.querySelector('[data-screen=${sec.id}]')); closeSectionSheet();">
        <span class="pi">${sec.icon}</span>
        <span class="pl">${sec.label}</span>
      </button>`;
    return `
      <div class="sheet-section-header">${sec.icon} ${sec.label}</div>
      ${sec.panels.map(p => `
        <button class="sheet-panel-btn" onclick="openPanel('${sec.id}','${p.id}','${p.label}'); closeSectionSheet();">
          <span class="pi">${p.icon}</span>
          <span class="pl">${p.label}</span>
          ${p.badge ? `<span class="pb">${p.badge}</span>` : ''}
        </button>`).join('')}`;
  }).join('');
  document.getElementById('section-sheet').classList.add('open');
}
function closeSectionSheet() { document.getElementById('section-sheet').classList.remove('open'); }

// ─── PANEL ROUTER ─────────────────────────────────────────────────────────────
function openPanel(sectionId, panelId, panelLabel) {
  openDrawer(panelLabel, el => {
    switch(panelId) {
      case 'news':        renderNewsPanel(el); break;
      case 'blog':        renderBlogPanel(el); break;
      case 'releases':    renderReleasesPanel(el); break;
      case 'breaking':    renderBreakingPanel(el); break;
      case 'crons':       renderCronsPanel(el); break;
      case 'costs':       renderCostsPanel(el); break;
      case 'keys':        renderKeysPanel(el); break;
      case 'rss':         renderRSSPanel(el); break;
      case 'agents':      renderAgentsPanel(el); break;
      case 'feeds':       renderFeedsPanel(el); break;
      case 'envcheck':    renderEnvPanel(el); break;
      case 'campaigns':   renderCampaignsPanel(el); break;
      case 'contacts':    renderContactsPanel(el); break;
      case 'videos':      renderVideosPanel(el); break;
      case 'channels':    renderChannelsPanel(el); break;
      case 'emails':      renderEmailTestPanel(el); break;
      case 'copyright':   renderCopyrightPanel(el); break;
      case 'statelaws':   renderStateLawsPanel(el); break;
      case 'pulllog':     renderPullLogPanel(el); break;
      case 'overview':    renderSystemOverview(el); break;
      default:
        el.innerHTML = `<div class="empty">🔧 ${panelLabel}<br><br><span style="color:var(--dim2);font-size:9px">Open on desktop for full controls</span><br><br><a href="https://downrangeco.com/admin" target="_blank" style="color:var(--gold);font-size:11px">Open Admin →</a></div>`;
    }
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function initApp() {
  screenInited = {};
  renderScreen('dashboard');
  screenInited.dashboard = true;
  // Check health
  fetch('/api/admin/cron-health').then(r=>r.json()).then(d=>{
    if (d.status !== 'ok') document.getElementById('topbar-status').textContent = '🟡';
  }).catch(()=>{});
}

function renderScreen(screen) {
  const el = document.getElementById('screen-'+screen);
  if (!el) return;
  switch(screen) {
    case 'dashboard':   renderDashboard(el); break;
    case 'content':     renderContent(el); break;
    case 'outreach':    renderOutreach(el); break;
    case 'intel':       renderIntel(el); break;
    case 'system':      renderSystem(el); break;
    case 'media':       renderMedia(el); break;
    case 'settings':    renderSettingsScreen(el); break;
    case 'publishing':  renderPublishing(el); break;
  }
}

async function runNewsFeed() {
  const btn = document.getElementById('run-feed-btn');
  const res = document.getElementById('feed-result');
  btn.disabled = true; btn.textContent = '⏳ Running...';

      method:'POST', body:JSON.stringify({jobId:'news'})
    });
    res.style.cssText = `display:block;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;background:${d.ok?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'};border:1px solid ${d.ok?'var(--ok)':'var(--err)'};color:${d.ok?'var(--ok)':'var(--err)'}`;
    res.textContent = d.ok ? `✓ Feed ran in ${d.ms||0}ms` : '✕ ' + (d.error||'Failed');
  } catch(e) {
    res.style.cssText = 'display:block;padding:10px;background:rgba(239,68,68,.08);border:1px solid var(--err);color:var(--err);font-family:IBM Plex Mono,monospace;font-size:11px;';
    res.textContent = 'Error: ' + e.message;
  }

}

let currentOutreachTab = 'campaigns';
function setOutreachTab(tab, btn) {
  currentOutreachTab = tab;
  document.querySelectorAll('#screen-outreach .tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  loadOutreachTab(tab);

async function loadOutreachTab(tab) {
  const el = document.getElementById('outreach-tab-content');
  if (!el) return;
  el.innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading...</div>';
  try {
    if (tab === 'contacts') {
      const d = await api('/api/admin/influencers?limit=30');
      const list = d.contacts || d.influencers || [];
      el.innerHTML = list.length === 0 ? '<div class="empty">No contacts found</div>' :
        `<div style="margin-bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)">${list.length} contacts</div>` +
        list.map(c=>`
          <div class="outreach-card">
            <div class="outreach-name">${c.name||c.channelName||'—'}</div>
            <div class="outreach-platform">${c.platform||''} ${c.handle?'· '+c.handle:''}</div>
            <div class="outreach-meta">
              ${c.subscribers ? `<span>👥 ${c.subscribers}</span>` : ''}
              ${c.email ? `<span>✉ ${c.email}</span>` : ''}
              ${c.status ? `<span class="pill pill-dim">${c.status}</span>` : ''}
            </div>
          </div>`).join('');
    } else if (tab === 'queue') {
      const d = await api('/api/admin/influencers?queue=true');
      const list = d.queue || d.items || [];
      el.innerHTML = list.length === 0 ? '<div class="empty">Queue is empty</div>' :
        list.map(q=>`
          <div class="outreach-card">
            <div class="outreach-name">${q.recipientName||q.name||'—'}</div>
            <div class="outreach-platform">${q.templateName||''}</div>
            <div class="outreach-meta"><span class="pill pill-warn">PENDING</span></div>
          </div>`).join('');
    } else if (tab === 'history') {
      const d = await api('/api/admin/influencers?history=true');
      const list = d.history || d.logs || d.sent || [];
      el.innerHTML = list.length === 0 ? '<div class="empty">No emails sent yet</div>' :
        list.map(s=>`
          <div class="outreach-card">
            <div class="outreach-name">${s.recipientName||s.name||'—'}</div>
            <div class="outreach-platform">${s.subject||''}</div>
            <div class="outreach-meta">
              <span>${s.sentAt ? new Date(s.sentAt).toLocaleDateString() : ''}</span>
              <span class="pill pill-ok">SENT</span>
            </div>
          </div>`).join('');
    } else {
      // campaigns / templates
      el.innerHTML = `
        <div style="margin-bottom:16px">
          <a href="https://downrangeco.com/admin#outreach" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;">Open Full CRM →</a>
        </div>
        <div class="empty">Template editor and send pipeline<br>available on desktop admin<br><br><span style="font-size:9px;color:var(--dim2)">Mobile view shows contacts & history</span></div>`;
    }
  } catch(e) {
    el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function renderBreakingPanel(el) {
  el.innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading...</div>';

    const alerts = d.alerts || [];

        alerts.map(a=>`

          </div>`).join('')}
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}
async function addBreakingAlert() {
  const h = document.getElementById('brk-headline')?.value?.trim();
  if (!h) return;
  const btn = document.getElementById('brk-submit');
  btn.disabled = true; btn.textContent = '⏳ Publishing...';
  try {
    await api('/api/admin/breaking-alert', {
      method:'POST',
      body: JSON.stringify({ headline:h, url:document.getElementById('brk-url')?.value||'', urgency:parseInt(document.getElementById('brk-urgency')?.value)||7 })
    });
    flash('✅ Alert published', 'ok');
    renderBreakingPanel(document.getElementById('drawer-content'));
  } catch(e) { flash('❌ Error: '+e.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Publish Alert';
}
async function deleteBreakingAlert(id) {
  await api('/api/admin/breaking-alert', { method:'DELETE', body:JSON.stringify({id}) });
  flash('Alert removed', 'info');
  renderBreakingPanel(document.getElementById('drawer-content'));
}

  } catch(e) { flash('Error: '+e.message, 'err'); }
  btn.disabled = false; btn.textContent = '▶ Run';
}

      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${list.length} contacts</div>
      ${list.map(c=>`
        <div class="outreach-card">
          <div class="outreach-name">${c.name||c.channelName||'—'}</div>
          <div class="outreach-platform">${c.platform||''} ${c.handle?'· @'+c.handle:''}</div>
          <div class="outreach-meta">
            ${c.subscribers ? `<span>👥 ${c.subscribers}</span>` : ''}
            ${c.email ? `<span>✉ ${c.email}</span>` : ''}
            ${c.category ? `<span class="tag">${c.category}</span>` : ''}
            ${c.status ? `<span class="pill pill-dim">${c.status}</span>` : ''}
          </div>
        </div>`).join('')}
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

// ─── PANEL: VIDEOS ────────────────────────────────────────────────────────────
async function renderVideosPanel(el) {
  el.innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading videos...</div>';
  try {
    const d = await api('/api/admin/save-videos?list=true');
    const videos = d.videos || [];
    if (!videos.length) { el.innerHTML = '<div class="empty">No videos cached</div>'; return; }
    el.innerHTML = `
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${videos.length} videos</div>
      ${videos.slice(0,20).map(v=>`
        <div style="display:flex;gap:10px;padding:12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:6px;align-items:flex-start;">
          ${v.thumbnail ? `<img src="${v.thumbnail}" style="width:64px;height:48px;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none'">` : '<div style="width:64px;height:48px;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;">▶</div>'}
          <div style="flex:1;min-width:0;">
            <div style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${v.title||'—'}</div>
            <div style="font-family:\'IBM Plex Mono\',monospace;font-size:9px;color:var(--dim)">${v.channel||''} ${v.publishedAt?'· '+new Date(v.publishedAt).toLocaleDateString():''}</div>
          </div>
        </div>`).join('')}
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Video list not available from API</div>`; }
}

// ─── PANEL: CHANNELS ──────────────────────────────────────────────────────────
async function renderChannelsPanel(el) {
  el.innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading channels...</div>';
  try {
    const d = await api('/api/admin/youtube-channels');
    const channels = d.channels || d.items || [];
    if (!channels.length) {
      el.innerHTML = `
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">Static channel list</div>
        ${['Military Arms Channel','Lucky Gunner','IraqVeteran8888','Hickok45','Garand Thumb','Paul Harrell','Guns & Gadgets'].map(c=>`
          <div class="row" style="cursor:default;"><span style="font-size:16px;">📺</span><div class="row-label">${c}</div><span class="pill pill-ok">Active</span></div>`).join('')}`;
      return;
    }
    el.innerHTML = `
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${channels.length} channels</div>
      ${channels.map(c=>`
        <div class="row" style="cursor:default;">
          <span style="font-size:18px;">📺</span>
          <div style="flex:1;">
            <div class="row-label">${c.name||c.channelName||'—'}</div>
            <div class="row-sub">${c.handle||c.channelId||''} ${c.category?'· '+c.category:''}</div>
          </div>
          <span class="pill pill-ok">Active</span>
        </div>`).join('')}
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

// ─── PANEL: EMAIL TEST ────────────────────────────────────────────────────────
async function renderEmailTestPanel(el) {
  el.innerHTML = `
    <div class="section-sub">Test email delivery via Resend</div>
    <div class="form-row"><span class="lbl">To Address</span><input id="et-to" class="inp" type="email" placeholder="test@example.com"></div>
    <button class="btn" style="width:100%;margin-bottom:20px" onclick="sendTestEmail()">Send Test Email</button>
    <div id="et-result"></div>
  `;
}
async function sendTestEmail() {
  const to = document.getElementById('et-to')?.value?.trim();
  if (!to) { flash('Enter an email address', 'err'); return; }
  try {
    const d = await api('/api/admin/test-emails', { method:'POST', body:JSON.stringify({to}) });
    const r = document.getElementById('et-result');
    r.innerHTML = `<div style="padding:10px;background:${d.ok?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'};border:1px solid ${d.ok?'var(--ok)':'var(--err)'};font-family:'IBM Plex Mono',monospace;font-size:11px;color:${d.ok?'var(--ok)':'var(--err)'}">
      ${d.ok ? '✅ Test email sent' : '❌ '+(d.error||'Failed')}</div>`;
  } catch(e) { flash('Error: '+e.message, 'err'); }
}

// ─── PANEL: COPYRIGHT ─────────────────────────────────────────────────────────
async function renderCopyrightPanel(el) {
  el.innerHTML = '<div class="loading"><span class="spinner">◈</span> Scanning...</div>';
  try {
    const d = await api('/api/admin/content-scan');
    const items = d.items || d.articles || [];
    const high = items.filter(i=>i.risk==='HIGH').length;
    const med  = items.filter(i=>i.risk==='MEDIUM').length;
    const low  = items.filter(i=>i.risk==='LOW').length;
    el.innerHTML = `
      <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="stat-box" style="text-align:center;"><div class="stat-val" style="color:var(--err)">${high}</div><div class="stat-lbl">High</div></div>
        <div class="stat-box" style="text-align:center;"><div class="stat-val" style="color:var(--warn)">${med}</div><div class="stat-lbl">Medium</div></div>
        <div class="stat-box" style="text-align:center;"><div class="stat-val" style="color:var(--ok)">${low}</div><div class="stat-lbl">Low</div></div>
      </div>
      <div style="margin-bottom:12px;">
        <a href="https://downrangeco.com/admin" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;">Open Full Report →</a>
      </div>
      ${items.slice(0,15).map(a=>`
        <div class="article-card">
          <div class="article-title">${a.title||a.sourceTitle||'—'}</div>
          <div class="article-meta">
            <span class="pill ${a.risk==='HIGH'?'pill-err':a.risk==='MEDIUM'?'pill-warn':'pill-ok'}">${a.risk||'?'}</span>
            ${a.source ? `<span>${a.source}</span>` : ''}
          </div>
        </div>`).join('')}
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Copyright scan not available<br><br><a href="https://downrangeco.com/admin" target="_blank" style="color:var(--gold)">Open Admin →</a></div>`; }
}

// ─── PANEL: STATE LAWS ────────────────────────────────────────────────────────
async function renderStateLawsPanel(el) {
  el.innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading states...</div>';
  try {
    const d = await api('/api/admin/state-profiles');
    const states = d.states || d.profiles || [];
    if (!states.length) { el.innerHTML = '<div class="empty">No state profiles loaded<br><span style="font-size:9px;color:var(--dim2)">Run State Feed agent to populate</span></div>'; return; }
    const cc = states.filter(s=>s.constitutionalCarry).length;
    const rf = states.filter(s=>s.redFlagLaw).length;
    el.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-val">${states.length}</div><div class="stat-lbl">States</div></div>
        <div class="stat-box"><div class="stat-val" style="color:var(--ok)">${cc}</div><div class="stat-lbl">Const. Carry</div></div>
        <div class="stat-box"><div class="stat-val" style="color:var(--err)">${rf}</div><div class="stat-lbl">Red Flag</div></div>
      </div>
      <input class="inp" id="state-search" placeholder="Search state..." oninput="filterStates(this.value)" style="margin-bottom:12px;">
      <div id="state-list">
        ${states.map(s=>`
          <div class="row" style="cursor:default;" data-state="${(s.name||'').toLowerCase()}">
            <div style="flex:1;">
              <div class="row-label"><span style="color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;margin-right:6px">${s.abbr||''}</span>${s.name||'—'}</div>
            </div>
            ${s.rating ? `<span style="font-family:'Bebas Neue',cursive;font-size:1.2rem;color:${s.rating==='A'||s.rating==='A+'?'#22c55e':s.rating==='F'?'#ef4444':'#f59e0b'}">${s.rating}</span>` : ''}
            ${s.constitutionalCarry ? '<span class="pill pill-ok" style="margin-left:4px">CC</span>' : ''}
            ${s.redFlagLaw ? '<span class="pill pill-err" style="margin-left:4px">RF</span>' : ''}
          </div>`).join('')}
      </div>
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

function filterStates(q) {
  document.querySelectorAll('#state-list .row').forEach(row => {
    row.style.display = row.dataset.state?.includes(q.toLowerCase()) ? '' : 'none';
  });
}

// ─── PANEL: PULL LOG ──────────────────────────────────────────────────────────
async function renderPullLogPanel(el) {
  el.innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading logs...</div>';
  try {
    const d = await api('/api/admin/cron-status');
    const logs = d.recent || d.runs || d.logs || [];
    if (!logs.length) { el.innerHTML = '<div class="empty">No pull logs found</div>'; return; }
    el.innerHTML = `
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${logs.length} recent runs</div>
      ${logs.map(l=>`
        <div style="padding:10px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <span class="pill ${l.status==='ok'||l.success?'pill-ok':'pill-err'}">${l.status||'?'}</span>
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;">${l.job||l.name||'—'}</span>
            <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim)">${l._createdAt?new Date(l._createdAt).toLocaleString():''}</span>
          </div>
          ${l.pulled !== undefined ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim)">Pulled: ${l.pulled} · Saved: ${l.saved||0}</div>` : ''}
          ${l.error ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--err);margin-top:4px">${l.error}</div>` : ''}
        </div>`).join('')}
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

// ─── KEYBOARD HANDLING ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
    else closeSectionSheet();
  }
});
</script>
</body>
</html>
