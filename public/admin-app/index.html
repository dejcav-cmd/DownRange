<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DR Admin">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090B; --bg2:#111318; --bg3:#1a1d24; --bg4:#21252f;
  --border:#1e293b; --border2:#2d3748;
  --text:#F0EDE6; --dim:#6b7280; --dim2:#4b5563;
  --gold:#C8922A; --ok:#22c55e; --err:#ef4444; --warn:#f59e0b;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --topbar-h:52px; --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;overscroll-behavior:none;overflow:hidden;}
button{font-family:inherit;} input,textarea,select{font-family:'IBM Plex Mono',monospace;} a{color:inherit;text-decoration:none;}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:calc(var(--topbar-h) + var(--safe-t));padding-bottom:calc(var(--nav-h) + var(--safe-b));}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:calc(var(--topbar-h) + var(--safe-t));padding-top:var(--safe-t);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r));gap:10px;}
#topbar-logo{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--gold);letter-spacing:.1em;flex-shrink:0;}
#topbar-title{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-status{font-size:16px;flex-shrink:0;}
#topbar-menu-btn{background:none;border:1px solid var(--border);color:var(--dim);width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;transition:border-color .15s,color .15s;}
#topbar-menu-btn:active{border-color:var(--gold);color:var(--gold);}

/* FLASH */
#flash{position:fixed;top:calc(var(--topbar-h) + var(--safe-t));left:0;right:0;z-index:199;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;display:none;align-items:center;gap:8px;transform:translateY(-100%);transition:transform .2s ease;}
#flash.show{display:flex;transform:translateY(0);}
#flash.ok{background:rgba(34,197,94,.12);border-bottom:1px solid rgba(34,197,94,.3);color:#4ade80;}
#flash.err{background:rgba(239,68,68,.12);border-bottom:1px solid rgba(239,68,68,.3);color:#f87171;}
#flash.info{background:rgba(200,146,42,.1);border-bottom:1px solid rgba(200,146,42,.3);color:var(--gold);}
#flash-close{margin-left:auto;background:none;border:none;color:inherit;font-size:16px;cursor:pointer;}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:stretch;}
.nav-tab{flex:1;background:none;border:none;border-top:2px solid transparent;color:var(--dim2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;transition:color .15s;position:relative;}
.nav-tab.active{color:var(--gold);border-top-color:var(--gold);}
.nav-tab-icon{font-size:18px;line-height:1;}
.nav-tab-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}

/* CONTENT AREA */
#content{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px;display:none;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.screen.active{display:block;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* DRAWER */
#drawer{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);background:var(--bg);pointer-events:none;}
#drawer.open{transform:translateX(0);pointer-events:all;}
#drawer-topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + var(--safe-t));background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
#drawer-back{background:none;border:none;color:var(--gold);cursor:pointer;padding:4px 8px;margin-left:-8px;display:flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;}
#drawer-title{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--text);letter-spacing:.08em;flex:1;}
#drawer-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--safe-b));}

/* SECTION SHEET */
#section-sheet{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;}
#section-sheet.open{display:flex;}
#section-sheet-inner{width:100%;background:var(--bg2);border-top:1px solid var(--border);border-radius:16px 16px 0 0;max-height:80vh;overflow-y:auto;padding-bottom:calc(16px + var(--safe-b));animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
#sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 8px;}
.sheet-section-header{padding:10px 20px 6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);letter-spacing:.12em;text-transform:uppercase;}
.sheet-panel-btn{width:100%;background:none;border:none;border-bottom:1px solid rgba(30,41,59,.5);color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 20px;transition:background .1s;}
.sheet-panel-btn:active{background:rgba(200,146,42,.08);}
.sheet-panel-btn .pi{font-size:18px;flex-shrink:0;}
.sheet-panel-btn .pl{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;letter-spacing:.03em;}
.sheet-panel-btn .pb{background:var(--err);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;padding:2px 5px;}

/* LOCK */
#lock-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;}
#lock-logo{font-family:'Bebas Neue',cursive;font-size:3rem;color:var(--gold);letter-spacing:.1em;}
#lock-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);text-align:center;}
#lock-input{width:100%;max-width:300px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:14px 16px;font-family:'IBM Plex Mono',monospace;font-size:14px;outline:none;text-align:center;-webkit-appearance:none;}
#lock-input:focus{border-color:var(--gold);}
#lock-btn{width:100%;max-width:300px;background:var(--gold);color:#000;border:none;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
#lock-err{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--err);display:none;}

/* COMPONENTS */
.card{background:var(--bg2);border:1px solid var(--border);}
.section-title{font-family:'Bebas Neue',cursive;font-size:1.6rem;color:var(--text);letter-spacing:.04em;margin-bottom:4px;}
.section-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim2);margin-bottom:16px;line-height:1.6;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.stat-box{background:var(--bg2);border:1px solid var(--border);padding:14px;}
.stat-val{font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--gold);line-height:1;}
.stat-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);margin-top:2px;letter-spacing:.08em;text-transform:uppercase;}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-bottom:none;}
.row:last-child{border-bottom:1px solid var(--border);}
.row-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;flex:1;}
.row-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-top:2px;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;}
.pill-ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3);}
.pill-err{background:rgba(239,68,68,.12);color:var(--err);border:1px solid rgba(239,68,68,.3);}
.pill-warn{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.3);}
.pill-gold{background:rgba(200,146,42,.12);color:var(--gold);border:1px solid rgba(200,146,42,.3);}
.pill-dim{background:rgba(107,114,128,.1);color:var(--dim);border:1px solid var(--border);}
.btn{background:var(--gold);color:#000;border:none;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;cursor:pointer;transition:opacity .15s;flex-shrink:0;-webkit-appearance:none;}
.btn:active{opacity:.8;} .btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-outline{background:none;border:1px solid var(--border);color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;-webkit-appearance:none;}
.btn-outline:active{border-color:var(--gold);color:var(--gold);}
.btn-danger{background:none;border:1px solid rgba(239,68,68,.4);color:var(--err);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:7px 12px;cursor:pointer;-webkit-appearance:none;}
.btn-danger:active{background:rgba(239,68,68,.1);}
.inp{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 12px;outline:none;-webkit-appearance:none;}
.inp:focus{border-color:var(--gold);}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px;}
.form-row{margin-bottom:12px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.empty{text-align:center;padding:40px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2);}
.loading{text-align:center;padding:40px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2);}
.spinner{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 6px;background:rgba(200,146,42,.1);color:var(--gold);}
.code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);}
.article-card{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:8px;}
.article-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3;}
.article-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.article-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.cron-card{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:8px;}
.blog-card{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:8px;}
.blog-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text);}
.blog-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.tabs{display:flex;overflow-x:auto;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px 14px;cursor:pointer;white-space:nowrap;letter-spacing:.05em;transition:all .12s;flex-shrink:0;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.outreach-card{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:8px;}
.outreach-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;margin-bottom:2px;}
.outreach-platform{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--gold);margin-bottom:6px;}
.outreach-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;}
.release-card{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
.release-img{width:64px;height:48px;object-fit:cover;flex-shrink:0;background:var(--bg3);}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.qa-btn{background:var(--bg2);border:1px solid var(--border);padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;transition:border-color .15s;text-align:left;}
.qa-btn:active{border-color:var(--gold);background:rgba(200,146,42,.05);}
.qa-icon{font-size:20px;} .qa-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--text);line-height:1.2;}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
</style>
</head>
<body>

<div id="lock-screen">
  <div id="lock-logo">◈ DR Admin</div>
  <div id="lock-sub">DownRange Command Center<br>Enter your admin key to continue</div>
  <input type="password" id="lock-input" placeholder="Admin key..." autocomplete="current-password">
  <div id="lock-err">Invalid key</div>
  <button id="lock-btn" onclick="tryAuth()">Unlock Portal</button>
</div>

<div id="flash"><span id="flash-text"></span><button id="flash-close" onclick="hideFlash()">✕</button></div>

<div id="topbar">
  <div id="topbar-logo">◈ DR</div>
  <div id="topbar-title">COMMAND CENTER</div>
  <div id="topbar-status">●</div>
  <button id="topbar-menu-btn" onclick="openSectionSheet()">☰</button>
</div>

<div id="app">
  <div id="content">
    <div id="screen-dashboard" class="screen active"></div>
    <div id="screen-content" class="screen"></div>
    <div id="screen-outreach" class="screen"></div>
    <div id="screen-intel" class="screen"></div>
    <div id="screen-system" class="screen"></div>
    <div id="screen-media" class="screen"></div>
    <div id="screen-settings" class="screen"></div>
    <div id="screen-publishing" class="screen"></div>
  </div>
</div>

<div id="bottom-nav">
  <button class="nav-tab active" data-screen="dashboard" onclick="navTo('dashboard',this)">
    <span class="nav-tab-icon">◈</span><span class="nav-tab-label">Home</span>
  </button>
  <button class="nav-tab" data-screen="content" onclick="navTo('content',this)">
    <span class="nav-tab-icon">📰</span><span class="nav-tab-label">Content</span>
  </button>
  <button class="nav-tab" data-screen="outreach" onclick="navTo('outreach',this)">
    <span class="nav-tab-icon">📬</span><span class="nav-tab-label">Outreach</span>
  </button>
  <button class="nav-tab" data-screen="intel" onclick="navTo('intel',this)">
    <span class="nav-tab-icon">🧠</span><span class="nav-tab-label">Intel</span>
  </button>
  <button class="nav-tab" data-screen="system" onclick="navTo('system',this)">
    <span class="nav-tab-icon">⚙️</span><span class="nav-tab-label">System</span>
  </button>
</div>

<div id="drawer">
  <div id="drawer-topbar">
    <button id="drawer-back" onclick="closeDrawer()">← Back</button>
    <div id="drawer-title">Panel</div>
  </div>
  <div id="drawer-content"></div>
</div>

<div id="section-sheet" onclick="if(event.target===this)closeSectionSheet()">
  <div id="section-sheet-inner">
    <div id="sheet-handle"></div>
    <div id="sheet-list"></div>
  </div>
</div>

<script>
let adminKey = '';
let screenInited = {};

// AUTH
async function tryAuth() {
  const val = document.getElementById('lock-input').value.trim();
  if (!val) return;
  const btn = document.getElementById('lock-btn');
  const err = document.getElementById('lock-err');
  btn.disabled = true; btn.textContent = 'Verifying...'; err.style.display = 'none';
  // Test key against a lightweight auth endpoint
  try {
    const r = await fetch('/api/admin/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: val })
    });
    if (r.status === 401) {
      err.textContent = 'Invalid key — does not match ADMIN_KEY in Vercel';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Unlock Portal';
      return;
    }
    adminKey = val;
    localStorage.setItem('dr_admin_key', val);
    document.getElementById('lock-screen').style.display = 'none';
    initApp();
  } catch(e) {
    err.textContent = 'Network error: ' + e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Unlock Portal';
  }
}
document.getElementById('lock-input').addEventListener('keydown', e => { if(e.key==='Enter') tryAuth(); });
window.addEventListener('load', async () => {
  const k = localStorage.getItem('dr_admin_key');
  if (!k) return;
  // Silently re-verify stored key on each load
  try {
    const r = await fetch('/api/admin/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: k })
    });
    if (r.status === 401) {
      // Key is stale/wrong — clear it and show lock screen
      localStorage.removeItem('dr_admin_key');
      return;
    }
    adminKey = k;
    document.getElementById('lock-screen').style.display = 'none';
    initApp();
  } catch {
    // Network error — let them in anyway if key exists (offline use)
    adminKey = k;
    document.getElementById('lock-screen').style.display = 'none';
    initApp();
  }
});

// API — sends x-admin-key header on every request
async function api(path, opts={}) {
  const headers = { 'x-admin-key': adminKey, ...(opts.body ? {'Content-Type':'application/json'} : {}), ...(opts.headers||{}) };
  const r = await fetch(path, { ...opts, headers });
  if (!r.ok && r.status === 401) throw new Error('Unauthorized — check admin key');
  return r.json();
}

// FLASH
let flashTimer;
function flash(msg, type='info') {
  const el = document.getElementById('flash');
  el.className = 'show ' + type;
  document.getElementById('flash-text').textContent = msg;
  clearTimeout(flashTimer);
  if (!msg.startsWith('⏳')) flashTimer = setTimeout(hideFlash, 5000);
}
function hideFlash() {
  const el = document.getElementById('flash');
  el.classList.remove('show');
  setTimeout(()=>{ el.className=''; }, 200);
}

// NAV
function navTo(screen, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const titles = {dashboard:'Command Center',content:'Content',outreach:'Outreach',intel:'Intelligence',system:'System',media:'Media',settings:'Settings',publishing:'Publishing'};
  document.getElementById('topbar-title').textContent = (titles[screen]||screen).toUpperCase();
  if (!screenInited[screen]) { screenInited[screen]=true; renderScreen(screen); }
}

// DRAWER
function openDrawer(title, renderFn) {
  document.getElementById('drawer-title').textContent = title;
  document.getElementById('drawer-content').innerHTML = '<div class="loading"><span class="spinner">◈</span> Loading...</div>';
  document.getElementById('drawer').classList.add('open');
  requestAnimationFrame(() => renderFn(document.getElementById('drawer-content')));
}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

// SECTION SHEET
const SECTIONS = [
  {id:'dashboard',label:'Home',icon:'◈',panels:[]},
  {id:'content',label:'Content',icon:'📰',panels:[
    {id:'news',label:'News Articles',icon:'📰'},{id:'blog',label:'Blog',icon:'✍'},
    {id:'releases',label:'Gun Releases',icon:'🔫',badge:'new'},{id:'reviews',label:'Reviews',icon:'★'},
    {id:'canada',label:'Canada',icon:'🇨🇦'},{id:'brazil',label:'Brasil',icon:'🇧🇷'},
    {id:'competitions',label:'Competitions',icon:'🏆'},{id:'drafts',label:'Draft Recovery',icon:'🔍'},
    {id:'hub',label:'Content Hub',icon:'◈'},
  ]},
  {id:'publishing',label:'Publishing',icon:'📅',panels:[
    {id:'breaking',label:'Breaking Alerts',icon:'🔴'},{id:'schedule',label:'Schedule',icon:'📅'},
    {id:'newsletter',label:'Newsletter',icon:'📧'},{id:'seo',label:'SEO & Meta',icon:'🔍'},
  ]},
  {id:'intel',label:'Intelligence',icon:'🧠',panels:[
    {id:'intel',label:'Briefings',icon:'🧠'},{id:'statelaws',label:'State Laws',icon:'🗺'},

async function runNewsFeed() {
  const btn = document.getElementById('run-feed-btn');
  const res = document.getElementById('feed-result');
  if (!btn||!res) return;
  btn.disabled=true; btn.textContent='⏳ Running...'; res.innerHTML='';

    res.innerHTML = `<div style="padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;background:${d.ok?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'};border:1px solid ${d.ok?'var(--ok)':'var(--err)'};color:${d.ok?'var(--ok)':'var(--err)'}">${d.ok?`✓ Feed ran in ${d.ms||0}ms`:'✕ '+(d.error||'Failed')}</div>`;

async function loadOutreachInline(tab) {
  const el = document.getElementById('outreach-body');
  if (!el) return;
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading...</div>';
  try {
    if (tab==='contacts') {
      const d = await api('/api/outreach/contacts?limit=50');
      const list = d.contacts||[];
      el.innerHTML = !list.length ? '<div class="empty">No contacts</div>' :
        `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${d.count||list.length} contacts</div>` +
        list.map(c=>`<div class="outreach-card">
          <div class="outreach-name">${c.channelName||c.hostName||'—'}</div>
          <div class="outreach-platform">${c.source||'YouTube'} ${c.tier?'· Tier '+c.tier:''}</div>
          <div class="outreach-meta">
            ${c.subscribers?`<span>👥 ${fmtNum(c.subscribers)}</span>`:''}
            ${c.email?`<span>✉ ${c.email}</span>`:''}
            ${c.outreachStatus?`<span class="pill pill-dim">${c.outreachStatus}</span>`:''}
          </div></div>`).join('');
    } else if (tab==='queue') {
      const d = await api('/api/outreach/queue?limit=30');
      const list = d.entries||[];
      el.innerHTML = !list.length ? '<div class="empty">Queue is empty</div>' :
        `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${list.length} pending</div>` +
        list.map(q=>`<div class="outreach-card">
          <div class="outreach-name">${q.toName||q.contact?.channelName||'—'}</div>
          <div class="outreach-platform">${q.subject||''}</div>
          <div class="outreach-meta"><span class="pill pill-warn">${q.status||'PENDING'}</span>${q.draftedAt?`<span>${new Date(q.draftedAt).toLocaleDateString()}</span>`:''}</div>
        </div>`).join('');
    } else {
      const d = await api('/api/outreach/history?limit=30');
      const list = d.logs||[];
      el.innerHTML = !list.length ? '<div class="empty">No emails sent yet</div>' :
        `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${d.count||list.length} sent</div>` +
        list.map(s=>`<div class="outreach-card">
          <div class="outreach-name">${s.toName||'—'}</div>
          <div class="outreach-platform">${s.subject||''}</div>
          <div class="outreach-meta">
            <span class="pill pill-ok">${s.status||'sent'}</span>
            ${s.sentAt?`<span>${new Date(s.sentAt).toLocaleDateString()}</span>`:''}
            ${s.toEmail?`<span>${s.toEmail}</span>`:''}
          </div></div>`).join('');
    }
  } catch(e) { el.innerHTML=`<div class="empty">Error: ${e.message}</div>`; }
}

async function renderBreakingPanel(el) {
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading...</div>';

    const alerts = d.alerts||[];
    el.innerHTML=`
      <div class="form-row"><span class="lbl">Headline</span><input id="brk-h" class="inp" placeholder="Breaking: ..."></div>
      <div class="form-row"><span class="lbl">URL (optional)</span><input id="brk-u" class="inp" placeholder="https://..."></div>
      <div class="form-row"><span class="lbl">Urgency (1-10)</span><input id="brk-urg" class="inp" type="number" min="1" max="10" value="7"></div>
      <button class="btn" style="width:100%;margin-bottom:20px" id="brk-submit" onclick="addBreakingAlert()">Publish Alert</button>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:8px">${alerts.length} active alerts</div>
      ${!alerts.length ? '<div class="empty">No active alerts</div>' :

          <span class="pill pill-err">LIVE</span>

        </div>`).join('')}`;
  } catch(e) { el.innerHTML=`<div class="empty">Error: ${e.message}</div>`; }
}
async function addBreakingAlert() {
  const h=document.getElementById('brk-h')?.value?.trim(); if (!h) return;
  const btn=document.getElementById('brk-submit'); btn.disabled=true; btn.textContent='⏳ Publishing...';
  try {
    await api('/api/admin/breaking-alert',{method:'POST',body:JSON.stringify({headline:h,url:document.getElementById('brk-u')?.value||'',urgency:parseInt(document.getElementById('brk-urg')?.value)||7})});
    flash('✅ Alert published','ok');
    renderBreakingPanel(document.getElementById('drawer-content'));
  } catch(e) { flash('❌ '+e.message,'err'); btn.disabled=false; btn.textContent='Publish Alert'; }
}
async function deleteBreakingAlert(id) {
  await api('/api/admin/breaking-alert',{method:'DELETE',body:JSON.stringify({id})});
  flash('Alert removed','info');
  renderBreakingPanel(document.getElementById('drawer-content'));
}

// ─── PANEL: CRON JOBS ─────────────────────────────────────────────────────────
// GET /api/admin/cron-status → { jobs: [{id,label,schedule,desc,status,lastRun:{at,status},rate,streak,isOverdue}] }
async function renderCronsPanel(el) {
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading crons...</div>';
  try {
    const d = await api('/api/admin/cron-status');
    const jobs = d.jobs||[];
    // Group by group field
    const groups = {};
    jobs.forEach(j => { const g=j.group||'Other'; (groups[g]=groups[g]||[]).push(j); });
    let html = `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${jobs.length} cron jobs</div>`;
    for (const [gName, gjobs] of Object.entries(groups)) {
      html += `<div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 8px">${gName}</div>`;
      html += gjobs.map(j => {
        const statusCls = j.status==='success'?'pill-ok': j.status==='failed'?'pill-err': j.status==='overdue'?'pill-warn':'pill-dim';
        const lastRunStr = j.lastRun?.at ? new Date(j.lastRun.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Never';
        return `<div class="cron-card">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:16px">${j.icon||'⏱'}</span>
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;flex:1">${j.label||j.id}</span>
            <span class="pill ${statusCls}">${j.status||'never'}</span>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap">
            <span>⏱ ${j.schedule}</span>
            <span>Last: ${lastRunStr}</span>
            ${j.rate!==null?`<span>Rate: ${j.rate}%</span>`:''}
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);margin-bottom:8px">${j.desc||''}</div>
          <button class="btn btn-sm" onclick="triggerCron('${j.id}',this)">▶ Run Now</button>
        </div>`;
      }).join('');
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML=`<div class="empty">Error: ${e.message}</div>`; }
}

async function triggerCron(jobId, btn) {
  btn.disabled=true; btn.textContent='⏳';
  try {
    const d = await api('/api/admin/cron-status?trigger=true',{method:'POST',body:JSON.stringify({jobId})});
    flash(d.ok?`✓ ${jobId} ran (${d.ms||0}ms)`:'✕ '+(d.error||'Failed'), d.ok?'ok':'err');
  } catch(e) { flash('Error: '+e.message,'err'); }
  btn.disabled=false; btn.textContent='▶ Run Now';
}

}
async function sendTestEmail() {
  const to=document.getElementById('et-to')?.value?.trim(); if (!to) { flash('Enter an email','err'); return; }
  try {
    const d=await api('/api/admin/test-emails',{method:'POST',body:JSON.stringify({to})});
    document.getElementById('et-result').innerHTML=`<div style="padding:10px;background:${d.ok?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'};border:1px solid ${d.ok?'var(--ok)':'var(--err)'};font-family:'IBM Plex Mono',monospace;font-size:11px;color:${d.ok?'var(--ok)':'var(--err)'}">${d.ok?'✅ Sent':'❌ '+(d.error||'Failed')}</div>`;
  } catch(e) { flash('Error: '+e.message,'err'); }
}

// ─── PANEL: COPYRIGHT ─────────────────────────────────────────────────────────
// GET /api/admin/content-scan → { items: [{title, risk, source}] }
async function renderCopyrightPanel(el) {
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Scanning...</div>';
  try {
    const d = await api('/api/admin/content-scan');
    const items = d.items||d.articles||[];
    const h=items.filter(i=>i.risk==='HIGH').length, m=items.filter(i=>i.risk==='MEDIUM').length, l=items.filter(i=>i.risk==='LOW').length;
    el.innerHTML=`<div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--err)">${h}</div><div class="stat-lbl">High</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--warn)">${m}</div><div class="stat-lbl">Medium</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--ok)">${l}</div><div class="stat-lbl">Low</div></div>
      </div>
      <a href="https://downrangeco.com/admin" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:16px">Open Full Report →</a>
      ${items.slice(0,20).map(a=>`<div class="article-card">
        <div class="article-title">${a.title||a.sourceTitle||'—'}</div>
        <div class="article-meta"><span class="pill ${a.risk==='HIGH'?'pill-err':a.risk==='MEDIUM'?'pill-warn':'pill-ok'}">${a.risk||'?'}</span>${a.source?`<span>${a.source}</span>`:''}</div>
      </div>`).join('')}`;
  } catch(e) { el.innerHTML=`<div class="empty">Scan not available<br><br><a href="https://downrangeco.com/admin" target="_blank" style="color:var(--gold)">Open Admin →</a></div>`; }
}

// ─── PANEL: STATE LAWS ────────────────────────────────────────────────────────
// GET /api/admin/state-profiles → { states: [...] }
async function renderStateLawsPanel(el) {
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading states...</div>';
  try {
    const d = await api('/api/admin/state-profiles');
    const states = d.states||d.profiles||[];
    if (!states.length) { el.innerHTML='<div class="empty">No state profiles<br><span style="font-size:9px;color:var(--dim2)">Run State Agent to populate</span></div>'; return; }
    const cc=states.filter(s=>s.constitutionalCarry).length, rf=states.filter(s=>s.redFlagLaw).length;
    el.innerHTML=`<div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat-box" style="text-align:center"><div class="stat-val">${states.length}</div><div class="stat-lbl">States</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--ok)">${cc}</div><div class="stat-lbl">Const. Carry</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--err)">${rf}</div><div class="stat-lbl">Red Flag</div></div>
      </div>
      <input class="inp" id="state-search" placeholder="Search state..." oninput="filterStates(this.value)" style="margin-bottom:12px">
      <div id="state-list">${states.map(s=>`<div class="row" style="cursor:default" data-state="${(s.name||'').toLowerCase()}">
        <div style="flex:1"><div class="row-label"><span style="color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;margin-right:6px">${s.abbr||''}</span>${s.name||'—'}</div></div>
        ${s.rating?`<span style="font-family:'Bebas Neue',cursive;font-size:1.2rem;color:${s.rating==='A'||s.rating==='A+'?'var(--ok)':s.rating==='F'?'var(--err)':'var(--warn)'}">${s.rating}</span>`:''}
        ${s.constitutionalCarry?'<span class="pill pill-ok" style="margin-left:4px">CC</span>':''}
        ${s.redFlagLaw?'<span class="pill pill-err" style="margin-left:4px">RF</span>':''}
      </div>`).join('')}</div>`;
  } catch(e) { el.innerHTML=`<div class="empty">Error: ${e.message}</div>`; }
}
function filterStates(q) {
  document.querySelectorAll('#state-list .row').forEach(r => { r.style.display=r.dataset.state?.includes(q.toLowerCase())?'':'none'; });
}

// ─── PANEL: PULL LOG ──────────────────────────────────────────────────────────
// Use cron-status which includes history per job (lastRun objects)
async function renderPullLogPanel(el) {
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading logs...</div>';
  try {
    const d = await api('/api/admin/cron-status');
    const jobs = d.jobs||[];
    // Flatten all history entries across all jobs, sorted newest first
    const all = [];
    jobs.forEach(j => (j.history||[]).forEach(r => all.push({...r, jobId:j.id, jobLabel:j.label})));
    all.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
    const recent = all.slice(0,40);
    if (!recent.length) { el.innerHTML='<div class="empty">No run history yet</div>'; return; }
    el.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">${recent.length} recent runs</div>` +
      recent.map(r=>`<div style="padding:10px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
          <span class="pill ${r.status==='success'?'pill-ok':'pill-err'}">${r.status||'?'}</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;flex:1">${r.jobLabel||r.jobId||'—'}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim)">${r.at?new Date(r.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</span>
        </div>
        ${r.ms!==undefined?`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2)">${r.ms}ms${r.pulled!==undefined?' · pulled '+r.pulled:''}${r.saved!==undefined?' · saved '+r.saved:''}</div>`:'' }
        ${r.error?`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--err);margin-top:3px">${r.error}</div>`:''}
      </div>`).join('');
  } catch(e) { el.innerHTML=`<div class="empty">Error: ${e.message}</div>`; }
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function fmtNum(n) {
  if (!n) return '';
  const num = typeof n==='string' ? parseInt(n.replace(/[^0-9]/g,'')) : n;
  if (isNaN(num)) return n;
  if (num >= 1e6) return (num/1e6).toFixed(1)+'M';
  if (num >= 1e3) return (num/1e3).toFixed(0)+'K';
  return String(num);
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
    else closeSectionSheet();
  }
});
</script>
