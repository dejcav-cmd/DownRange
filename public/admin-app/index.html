      <div class="form-row"><span class="lbl">Alert Email</span>
        <input id="alert-email" class="inp" type="email" value="${cfg.email||'dejcav@gmail.com'}">
      </div>
      <div class="form-row"><span class="lbl">Failure Threshold (consecutive fails before alert)</span>
        <input id="alert-threshold" class="inp" type="number" min="1" max="10" value="${cfg.failThreshold||3}">
      </div>

      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Alert Types</div>
      ${['cronFailed','cronOverdue','sanityUnreachable','lowArticleCount'].map(key=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px">${key}</span>
          <button class="pill ${cfg[key]!==false?'pill-ok':'pill-dim'}" id="alert-toggle-${key}" onclick="toggleAlertType('${key}',this)">${cfg[key]!==false?'ON':'OFF'}</button>
        </div>`).join('')}

      <div class="divider"></div>
      <button class="btn" style="width:100%" onclick="saveAlertConfig(this)">Save Alert Config</button>
    `;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

function toggleAlertType(key, btn){
  const isOn = btn.textContent.trim()==='ON';
  btn.textContent = isOn?'OFF':'ON';
  btn.className = `pill ${isOn?'pill-dim':'pill-ok'}`;
  if(!window._alertCfgOverrides) window._alertCfgOverrides={};
  window._alertCfgOverrides[key] = !isOn;
}

async function saveAlertConfig(btn){
  btn.disabled=true;btn.textContent='⏳';
  try{
    const overrides=window._alertCfgOverrides||{};
    const config={
      email: document.getElementById('alert-email')?.value||'dejcav@gmail.com',
      failThreshold: parseInt(document.getElementById('alert-threshold')?.value)||3,
      ...overrides,
    };
    const d=await api('/api/admin/alert-config',{method:'POST',body:JSON.stringify({config})});
    flash(d.ok?'✅ Alert config saved':'❌ '+(d.error||'Failed'),d.ok?'ok':'err');
  }catch(e){flash('Error: '+e.message,'err');}
  btn.disabled=false;btn.textContent='Save Alert Config';
}

async function runOperation(endpoint, method, id, btn){
  if(btn.classList.contains('btn-danger')){
    if(!confirm('This is a destructive operation. Are you sure?')) return;
  }
  btn.disabled=true; btn.textContent='⏳ Running...';
  const res=document.getElementById('ops-result-'+id);
  try{
    const r=await fetch(endpoint,{method,headers:{'x-admin-key':adminKey,'Authorization':'Bearer '+adminKey}});
    const d=await r.json();
    const ok=d.ok||d.success||r.ok;
    if(res) res.innerHTML='<span style="color:'+(ok?'var(--ok)':'var(--err)')+'">'+( ok?'✓ Done':'✗ '+(d.error||'Failed'))+' — '+JSON.stringify(d).slice(0,80)+'</span>';
  }catch(e){if(res)res.innerHTML='<span style="color:var(--err)">✗ '+e.message+'</span>';}
  btn.disabled=false; btn.textContent='▶ '+id;
}

function renderCompliance(el){
  const RESTRICTED=[
    {abbr:'CA',name:'California',mag:10,awb:'Full AWB',supp:false,carry:false},
    {abbr:'CT',name:'Connecticut',mag:10,awb:'Full AWB',supp:false,carry:false},
    {abbr:'HI',name:'Hawaii',mag:10,awb:'Full AWB',supp:false,carry:false},
    {abbr:'IL',name:'Illinois',mag:15,awb:'Full AWB',supp:false,carry:false},
    {abbr:'MD',name:'Maryland',mag:10,awb:'Full AWB',supp:false,carry:false},
    {abbr:'MA',name:'Massachusetts',mag:10,awb:'Full AWB',supp:false,carry:false},
    {abbr:'NJ',name:'New Jersey',mag:10,awb:'Full AWB',supp:false,carry:false},
    {abbr:'NY',name:'New York',mag:10,awb:'Full AWB',supp:false,carry:false},
    {abbr:'WA',name:'Washington',mag:10,awb:'Restricted',supp:false,carry:true},
    {abbr:'CO',name:'Colorado',mag:15,awb:null,supp:true,carry:true},
    {abbr:'OR',name:'Oregon',mag:10,awb:null,supp:true,carry:true},
    {abbr:'DE',name:'Delaware',mag:17,awb:null,supp:false,carry:false},
    {abbr:'MN',name:'Minnesota',mag:null,awb:null,supp:true,carry:false},
    {abbr:'NE',name:'Nebraska',mag:null,awb:null,supp:true,carry:false},
  ];
  el.innerHTML=`
    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:12px">50-state compliance reference for DownRange deals</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Deal Title Compliance Checker</div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="compliance-q" class="inp" style="flex:1" placeholder="e.g. Magpul PMAG 30rd, AR-15 Lower...">
      <button class="btn" onclick="checkCompliance()">Check</button>
    </div>
    <div id="compliance-result" style="margin-bottom:16px"></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Restricted States Reference (${RESTRICTED.length})</div>
    ${RESTRICTED.map(s=>'<div class="row row-last"><div style="flex:1"><div class="row-label"><span style="color:var(--dim);font-family:\'IBM Plex Mono\',monospace;font-size:10px;margin-right:6px">'+s.abbr+'</span>'+s.name+'</div><div class="row-sub">'+(s.mag?'Mag: '+s.mag+'rd ':'')+(s.awb?s.awb+' ':'')+(!s.supp?'No Suppressor ':'')+(!s.carry?'No Carry':'')+'</div></div></div>').join('')}
  `;
}
function checkCompliance(){
  const q=(document.getElementById('compliance-q')?.value||'').toLowerCase();
  const res=document.getElementById('compliance-result');
  if(!q||!res) return;
  const mag30=q.match(/(30|32|33|40|100)\s*(rd|round)/i);
  const mag20=q.match(/(20|25)\s*(rd|round)/i);
  const isAWB=/(ar-?15|ak-?47|ar-?10|m4|m16|m1a|pistol brace|stabilizing brace|sbr|suppressor|silencer)/i.test(q);
  const isMag=mag30||mag20;
  const flags=[];
  if(mag30) flags.push({state:'CA,CT,CO,HI,IL,MD,MA,NJ,NY,OR,WA,DE',issue:'30rd mag restricted/banned'});
  if(mag20) flags.push({state:'CA,CT,CO,HI,IL,MD,MA,NJ,NY,OR,WA',issue:'20rd mag restricted/banned'});
  if(isAWB) flags.push({state:'CA,CT,HI,IL,MD,MA,NJ,NY',issue:'Possible AWB item — verify'});
  if(!flags.length){
    res.innerHTML='<div style="padding:10px;background:rgba(34,197,94,.08);border:1px solid var(--ok);font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--ok)">✓ No obvious restrictions detected — verify state-specific laws</div>';
  } else {
    res.innerHTML=flags.map(f=>'<div style="padding:10px;background:rgba(239,68,68,.08);border:1px solid var(--err);font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--err);margin-bottom:6px">⚠ '+f.issue+'<br><span style="color:var(--dim)">Affected: '+f.state+'</span></div>').join('');
  }
}

async function renderMailingList(el){

    const d=await api('/api/admin/mailing-list');
    const subs=d.subscribers||d.contacts||[];

    const active=subs.filter(s=>s.status==='active'||!s.status).length;
    const unsub=subs.filter(s=>s.status==='unsubscribed').length;
    el.innerHTML=`
      <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px">
        <div class="stat-box" style="text-align:center"><div class="stat-val">${total}</div><div class="stat-lbl">Total</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--ok)">${active}</div><div class="stat-lbl">Active</div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-val" style="color:var(--dim)">${unsub}</div><div class="stat-lbl">Unsub</div></div>
      </div>
      <div class="form-row"><span class="lbl">Add Subscriber</span>
        <input id="ml-email" class="inp" type="email" placeholder="email@example.com" style="margin-bottom:6px">
        <input id="ml-name" class="inp" placeholder="Name (optional)">
      </div>
      <button class="btn" style="width:100%;margin-bottom:20px" onclick="addSubscriber()">+ Add Subscriber</button>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:8px">${subs.length} subscribers</div>
      <input class="inp" id="ml-search" placeholder="Filter by email or name..." oninput="filterML(this.value)" style="margin-bottom:10px">
      <div id="ml-list">
        ${subs.map(s=>`<div class="row row-last" id="ml-${s._id||s.id||s.email}">
          <div style="flex:1"><div class="row-label">${s.name||s.email||'—'}</div><div class="row-sub">${s.name?s.email:''} <span class="pill ${s.status==='unsubscribed'?'pill-dim':'pill-ok'}">${s.status||'active'}</span></div></div>
          <button class="btn-danger btn-xs" onclick="removeSubscriber('${s._id||s.id}','${(s.email||'').replace(/'/g,'')}',this)">✕</button>
        </div>`).join('')}
      </div>`;
    window._mlSubs=subs;
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}<br><br><a href="https://downrangeco.com/admin" target="_blank" style="color:var(--gold)">Open Admin →</a></div>`;}
}
function filterML(q){
  const list=document.querySelectorAll('#ml-list .row');
  list.forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';});
}
async function addSubscriber(){
  const email=document.getElementById('ml-email')?.value?.trim();
  const name=document.getElementById('ml-name')?.value?.trim();
  if(!email){flash('Enter an email','err');return;}
  try{
    const d=await api('/api/admin/mailing-list',{method:'POST',body:JSON.stringify({action:'add',email,name})});
    flash(d.ok?'✅ Subscriber added':'❌ '+(d.error||'Failed'),d.ok?'ok':'err');
    if(d.ok) renderMailingList(document.getElementById('drawer-content'));
  }catch(e){flash('Error: '+e.message,'err');}
}
async function removeSubscriber(id, email, btn){
  btn.disabled=true;
  try{
    const d=await api('/api/admin/mailing-list',{method:'POST',body:JSON.stringify({action:'remove',id,email})});
    if(d.ok){flash('✅ Removed','info');btn.closest('.row')?.remove();}
    else flash('❌ '+(d.error||'Failed'),'err');
  }catch(e){flash('Error: '+e.message,'err');btn.disabled=false;}
}

];

let _trayOpen = false;
let _trayInited = false;

function toggleTray(btn) {
  if (_trayOpen) { closeTray(); return; }
  openTray(btn);
}

function openTray(btn) {
  // Mark ☰ active
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');

  // Build tray content once
  if (!_trayInited) {
    const body = document.getElementById('nav-tray-body');
    if (body) {
      body.innerHTML = TRAY_SECTIONS.map(sec => `
        <div class="tray-section">
          <div class="tray-section-hdr">${sec.icon} ${sec.label}</div>
          ${sec.panels.map(p => `
            <button class="tray-btn" onclick="openPanel('${p.id}','${p.l}');closeTray()">
              <span class="tray-btn-icon">${p.i}</span>
              <span class="tray-btn-label">${p.l}${p.b?` <span class="tray-btn-badge">${p.b}</span>`:''}</span>
              <span class="tray-btn-arrow">›</span>
            </button>`).join('')}
        </div>`).join('');
    }
    _trayInited = true;
  }

  document.getElementById('nav-tray').classList.add('open');
  _trayOpen = true;
}

function closeTray() {
  document.getElementById('nav-tray').classList.remove('open');
  _trayOpen = false;
  // If ☰ was active, revert to dashboard active if no screen is selected
  const moreBtn = document.getElementById('nt-more');
  if (moreBtn && moreBtn.classList.contains('active')) {
    moreBtn.classList.remove('active');
    // Re-activate the currently visible screen's tab if possible
    const active = document.querySelector('.screen.active');
    if (active) {
      const sid = active.id.replace('screen-','');
      const tab = document.querySelector('[data-s="'+sid+'"]');
      if (tab) tab.classList.add('active');
    }
  }
}

// Override openSheet to use the tray instead of the old section sheet
function openSheet() { openTray(document.getElementById('nt-more')); }

// Override navTo to also deactivate the ☰ button
const _origNavTo = navTo;


document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('modal-overlay').classList.contains('open'))closeModal();
    else if(document.getElementById('drawer').classList.contains('open'))closeDrawer();
    else closeSheet();
  }
});
